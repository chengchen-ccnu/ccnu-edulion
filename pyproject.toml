[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edu-math-agent"
version = "0.2.0"
description = "Dynamic multi-agent runtime and retrieval worker for middle-school mathematics"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
edu-agent = "edu_agent_app.__main__:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["edu_agent_app*"]

[tool.setuptools.package-data]
edu_agent_app = ["skills/*/SKILL.md", "skills/*/scripts/*", "skills/*/references/*", "skills/*/assets/*"]

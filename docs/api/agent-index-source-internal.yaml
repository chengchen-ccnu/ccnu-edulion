openapi: 3.1.0
info:
  title: Edu Agent Domain Source Internal API
  version: 1.2.0
  description: |
    T14.1 为 T13.2 独立 Index Worker 提供的 Java 事实源只读分页协议。接口只在服务间网络开放，
    使用专用调用方身份与本地加密初始化的共享令牌；Gateway 不路由这些路径。分页按
    (sourceRevision, entityId) 稳定前进，Worker 可做有界全量重建，也可按 Outbox 事件中的 entityId
    获取最新投影。T14.2.1 向前增加 Agent Access 专用课程候选复核和当前用户学习事实读取，
    两者使用独立调用方身份与 AGENT_ACCESS_DOMAIN_TOKEN。响应不含官方答案、解析、其他用户事实、
    OSS 定位或短期签名 URL。T14.2.2 向前增加 Agent Access 的 USER_PRIVATE 记忆分页/单实体投影；
    MySQL 仍是事实源，Qdrant 投影不能作为授权依据。
servers:
  - url: http://learning-service.internal
    description: 题目和知识点事实源。
  - url: http://course-service.internal
    description: 已发布课程文字事实源。
  - url: http://agent-access-service.internal
    description: 当前 ACTIVE 且未到期的学生私有记忆安全事实源。
tags:
  - name: AgentIndexSource
paths:
  /internal/v1/agent-index/student-memories:
    get:
      tags: [AgentIndexSource]
      operationId: pageStudentMemoryIndexProjections
      summary: 分页或按实体读取当前 USER_PRIVATE 学生记忆安全投影
      parameters:
        - {$ref: '#/components/parameters/InternalCaller'}
        - {$ref: '#/components/parameters/InternalToken'}
        - {$ref: '#/components/parameters/AfterRevision'}
        - {$ref: '#/components/parameters/AfterEntityId'}
        - {$ref: '#/components/parameters/EntityId'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200': {description: 不含证据明细、隐藏画像、会话原文、用量或秘密的安全页。, content: {application/json: {schema: {$ref: '#/components/schemas/StudentMemoryProjectionPage'}}}}
        '401': {$ref: '#/components/responses/InternalUnauthorized'}
        '422': {$ref: '#/components/responses/InternalValidationFailed'}
  /internal/v1/agent-index/questions:
    get:
      tags: [AgentIndexSource]
      operationId: pageQuestionIndexProjections
      summary: 分页读取当前 ACTIVE SYSTEM 初中数学题安全投影
      parameters:
        - {$ref: '#/components/parameters/InternalCaller'}
        - {$ref: '#/components/parameters/InternalToken'}
        - {$ref: '#/components/parameters/AfterRevision'}
        - {$ref: '#/components/parameters/AfterEntityId'}
        - {$ref: '#/components/parameters/EntityId'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200': {description: Stable page., content: {application/json: {schema: {$ref: '#/components/schemas/QuestionProjectionPage'}}}}
        '401': {$ref: '#/components/responses/InternalUnauthorized'}
        '422': {$ref: '#/components/responses/InternalValidationFailed'}
  /internal/v1/agent-index/knowledge-points:
    get:
      tags: [AgentIndexSource]
      operationId: pageKnowledgePointIndexProjections
      summary: 分页读取已启用初中数学知识点及有界前置关系
      parameters:
        - {$ref: '#/components/parameters/InternalCaller'}
        - {$ref: '#/components/parameters/InternalToken'}
        - {$ref: '#/components/parameters/AfterRevision'}
        - {$ref: '#/components/parameters/AfterEntityId'}
        - {$ref: '#/components/parameters/EntityId'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200': {description: Stable page., content: {application/json: {schema: {$ref: '#/components/schemas/KnowledgePointProjectionPage'}}}}
        '401': {$ref: '#/components/responses/InternalUnauthorized'}
        '422': {$ref: '#/components/responses/InternalValidationFailed'}
  /internal/v1/agent-index/course-texts:
    get:
      tags: [AgentIndexSource]
      operationId: pageCourseTextIndexProjections
      summary: 分页读取当前已发布初中数学课程 ARTICLE 文字投影
      parameters:
        - {$ref: '#/components/parameters/InternalCaller'}
        - {$ref: '#/components/parameters/InternalToken'}
        - {$ref: '#/components/parameters/AfterRevision'}
        - {$ref: '#/components/parameters/AfterEntityId'}
        - {$ref: '#/components/parameters/EntityId'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200': {description: Stable page., content: {application/json: {schema: {$ref: '#/components/schemas/CourseTextProjectionPage'}}}}
        '401': {$ref: '#/components/responses/InternalUnauthorized'}
        '422': {$ref: '#/components/responses/InternalValidationFailed'}
  /internal/v1/agent-access/course-candidates:verify:
    post:
      tags: [AgentIndexSource]
      operationId: reauthorizeCourseTextCandidates
      summary: 用当前发布版本和报名投影批量复核课程索引候选
      parameters:
        - {$ref: '#/components/parameters/AgentAccessCaller'}
        - {$ref: '#/components/parameters/AgentAccessToken'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CourseCandidateVerifyRequest'}}}}
      responses:
        '200': {description: 精确字段及当前访问都成立的候选。, content: {application/json: {schema: {$ref: '#/components/schemas/CourseCandidateVerifyResponse'}}}}
        '401': {$ref: '#/components/responses/InternalUnauthorized'}
  /internal/v1/agent-access/student-facts:query:
    post:
      tags: [AgentIndexSource]
      operationId: queryAuthorizedStudentFacts
      summary: 读取可信 owner 的四类安全学习事实
      parameters:
        - {$ref: '#/components/parameters/AgentAccessCaller'}
        - {$ref: '#/components/parameters/AgentAccessToken'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StudentFactQueryRequest'}}}}
      responses:
        '200': {description: 只含 owner 自有事实、最终 attempt 和已公布成绩。, content: {application/json: {schema: {$ref: '#/components/schemas/StudentFactQueryResponse'}}}}
        '401': {$ref: '#/components/responses/InternalUnauthorized'}
components:
  parameters:
    InternalCaller:
      name: X-Internal-Caller
      in: header
      required: true
      schema: {type: string, const: agent-index-worker}
    InternalToken:
      name: X-Internal-Service-Token
      in: header
      required: true
      schema: {type: string, minLength: 32, writeOnly: true}
      description: AGENT_INDEX_SERVICE_TOKEN；不得写入日志、响应、仓库配置或事件。
    AgentAccessCaller:
      name: X-Internal-Caller
      in: header
      required: true
      schema: {type: string, const: agent-access-service}
    AgentAccessToken:
      name: X-Internal-Service-Token
      in: header
      required: true
      schema: {type: string, minLength: 32, writeOnly: true}
      description: AGENT_ACCESS_DOMAIN_TOKEN；只在 Agent Access、Course 与 Learning 之间共享。
    AfterRevision:
      name: afterRevision
      in: query
      required: false
      schema: {type: integer, minimum: 0, default: 0}
    AfterEntityId:
      name: afterEntityId
      in: query
      required: false
      schema: {type: string, format: uuid, default: 00000000-0000-0000-0000-000000000000}
    EntityId:
      name: entityId
      in: query
      required: false
      schema: {type: string, format: uuid}
      description: 事件增量拉取时精确读取一个当前投影；不存在表示事实已删除或不再可索引。
    PageSize:
      name: size
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 200, default: 100}
  responses:
    InternalUnauthorized:
      description: 调用方身份或服务令牌不正确。
      content: {application/json: {schema: {$ref: '#/components/schemas/InternalError'}}}
    InternalValidationFailed:
      description: 游标或分页参数不合法。
      content: {application/json: {schema: {$ref: '#/components/schemas/InternalError'}}}
  schemas:
    StudentMemoryIndexProjection:
      type: object
      additionalProperties: false
      required: [entityId, subjectUserId, sourceRevision, educationStage, subject, memoryType, text, visibility, accessScope, requiresCurrentCourseAccess]
      properties:
        entityId: {type: string, format: uuid}
        subjectUserId: {type: string, format: uuid, description: IAM 全局 userId；Worker 必须写为 user_id payload 并在查询时精确过滤。}
        sourceRevision: {type: integer, minimum: 1}
        educationStage: {type: string, const: JUNIOR}
        subject: {type: string, const: MATH}
        memoryType: {type: string, enum: [PREFERENCE, UNRESOLVED_POINT, SELF_REPORTED_PATTERN, LEARNING_EVIDENCE, TOPIC_EXPERIENCE]}
        text: {type: string, minLength: 1, maxLength: 500}
        visibility: {type: string, const: USER_PRIVATE}
        accessScope: {type: string, const: USER_PRIVATE}
        courseId: {type: string, format: uuid}
        courseVersionId: {type: string, minLength: 1, maxLength: 64}
        lessonId: {type: string, format: uuid}
        requiresCurrentCourseAccess: {type: boolean}
        expiresAt: {type: string, format: date-time}
      description: 课程范围字段出现时 requiresCurrentCourseAccess 必须为 true，候选进入模型前由 Java 按当前版本和访问资格复核，依赖失败 fail-closed。
    StudentMemoryProjectionPage:
      type: object
      additionalProperties: false
      required: [items, hasMore]
      properties:
        items: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/StudentMemoryIndexProjection'}}
        hasMore: {type: boolean}
        nextCursor:
          oneOf: [{$ref: '#/components/schemas/ProjectionCursor'}, {type: 'null'}]
    InternalError:
      type: object
      additionalProperties: false
      required: [code, message, traceId, timestamp, path, fieldErrors]
      properties:
        code: {type: string}
        message: {type: string}
        traceId: {type: string}
        timestamp: {type: string, format: date-time}
        path: {type: string}
        fieldErrors: {type: array, items: {type: object}}
    ProjectionCursor:
      type: object
      additionalProperties: false
      required: [sourceRevision, entityId]
      properties:
        sourceRevision: {type: integer, minimum: 1}
        entityId: {type: string, format: uuid}
    QuestionIndexProjection:
      type: object
      additionalProperties: false
      required: [entityId, questionVersionId, sourceRevision, educationStage, grade, subject, questionType, stem, options, knowledgePointIds]
      properties:
        entityId: {type: string, format: uuid}
        questionVersionId: {type: string, format: uuid}
        sourceRevision: {type: integer, minimum: 1}
        educationStage: {type: string, const: JUNIOR}
        grade: {type: string, enum: [GRADE_7, GRADE_8, GRADE_9]}
        subject: {type: string, const: MATH}
        questionType: {type: string, enum: [SINGLE_CHOICE, MULTIPLE_CHOICE, TRUE_FALSE, FILL_BLANK, SHORT_ANSWER, COMPOSITE]}
        stem: {type: string, minLength: 1, maxLength: 30000}
        options: {type: array, maxItems: 20, items: {type: string, maxLength: 4000}}
        knowledgePointIds: {type: array, maxItems: 32, items: {type: string, format: uuid}}
      description: 不包含 answers、analysis、教师私有题、历史版本或媒体 URL。
    QuestionProjectionPage:
      type: object
      additionalProperties: false
      required: [items, hasMore]
      properties:
        items: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/QuestionIndexProjection'}}
        hasMore: {type: boolean}
        nextCursor:
          oneOf: [{$ref: '#/components/schemas/ProjectionCursor'}, {type: 'null'}]
    KnowledgePointIndexProjection:
      type: object
      additionalProperties: false
      required: [entityId, code, name, sourceRevision, educationStage, subject, prerequisiteIds]
      properties:
        entityId: {type: string, format: uuid}
        code: {type: string, minLength: 1, maxLength: 64}
        name: {type: string, minLength: 1, maxLength: 120}
        sourceRevision: {type: integer, minimum: 1}
        educationStage: {type: string, const: JUNIOR}
        subject: {type: string, const: MATH}
        prerequisiteIds: {type: array, maxItems: 32, items: {type: string, format: uuid}}
    KnowledgePointProjectionPage:
      type: object
      additionalProperties: false
      required: [items, hasMore]
      properties:
        items: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/KnowledgePointIndexProjection'}}
        hasMore: {type: boolean}
        nextCursor:
          oneOf: [{$ref: '#/components/schemas/ProjectionCursor'}, {type: 'null'}]
    CourseTextIndexProjection:
      type: object
      additionalProperties: false
      required: [entityId, courseId, courseVersionId, lessonId, sourceRevision, educationStage, subject, title, articleMarkdown, accessType]
      properties:
        entityId: {type: string, format: uuid}
        courseId: {type: string, format: uuid}
        courseVersionId: {type: string, minLength: 1, maxLength: 64}
        lessonId: {type: string, format: uuid}
        sourceRevision: {type: integer, minimum: 1}
        educationStage: {type: string, const: JUNIOR}
        subject: {type: string, const: MATH}
        title: {type: string, minLength: 1, maxLength: 120}
        articleMarkdown: {type: string, minLength: 1, maxLength: 200000}
        accessType: {type: string, enum: [FREE, PAID]}
      description: 在线命中后仍必须回到 Java 按当前用户复核课程访问；索引可见不等于用户有权读取。
    CourseTextProjectionPage:
      type: object
      additionalProperties: false
      required: [items, hasMore]
      properties:
        items: {type: array, maxItems: 200, items: {$ref: '#/components/schemas/CourseTextIndexProjection'}}
        hasMore: {type: boolean}
        nextCursor:
          oneOf: [{$ref: '#/components/schemas/ProjectionCursor'}, {type: 'null'}]
    CourseCandidate:
      type: object
      additionalProperties: false
      required: [entityId, courseId, courseVersionId, lessonId, sourceRevision]
      properties:
        entityId: {type: string, format: uuid}
        courseId: {type: string, format: uuid}
        courseVersionId: {type: string, minLength: 1, maxLength: 80}
        lessonId: {type: string, format: uuid}
        sourceRevision: {type: integer, minimum: 1}
    CourseCandidateVerifyRequest:
      type: object
      additionalProperties: false
      required: [ownerUserId, candidates]
      properties:
        ownerUserId: {type: string, format: uuid, description: Agent Access 从 ai_run 取得，禁止转传浏览器或 Python userId。}
        candidates: {type: array, minItems: 1, maxItems: 20, items: {$ref: '#/components/schemas/CourseCandidate'}}
    CourseCandidateVerifyResponse:
      type: object
      additionalProperties: false
      required: [allowedEntityIds]
      properties:
        allowedEntityIds: {type: array, maxItems: 20, uniqueItems: true, items: {type: string, format: uuid}}
    StudentFactQueryRequest:
      type: object
      additionalProperties: false
      required: [ownerUserId, toolName, resourceIds, limit]
      properties:
        ownerUserId: {type: string, format: uuid, description: Agent Access 从 ai_run 取得的可信 owner。}
        toolName: {type: string, enum: [STUDENT_WRONG_QUESTIONS, STUDENT_SUBMISSIONS, STUDENT_PUBLISHED_GRADES, STUDENT_PROGRESS]}
        resourceIds: {type: array, maxItems: 100, uniqueItems: true, items: {type: string, format: uuid}}
        limit: {type: integer, minimum: 1, maximum: 20}
    SafeStudentFact:
      type: object
      additionalProperties: false
      required: [evidenceId, title, summary, revision]
      properties:
        evidenceId: {type: string, format: uuid}
        title: {type: string, minLength: 1, maxLength: 200}
        summary: {type: string, minLength: 1, maxLength: 4000}
        revision: {type: integer, minimum: 0}
      description: 不含 assessment_question.snapshot_json、官方答案/解析、未公布成绩、旧 attempt 或他人数据。
    StudentFactQueryResponse:
      type: object
      additionalProperties: false
      required: [facts]
      properties:
        facts: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/SafeStudentFact'}}

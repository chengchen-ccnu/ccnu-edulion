openapi: 3.0.3
info:
  title: Learning 账号撤权影响统计内部协议
  version: 1.0.0
  description: IAM 只提交 Course 返回的稳定课程 ID；Learning 只读取本域报名事实，不查询 IAM 或 Course 表。内部入口不暴露给浏览器。
paths:
  /internal/v1/account-impact/active-students:count:
    post:
      summary: 统计课程集合内去重 ACTIVE 报名学生人数
      description: 仅 iam-service，复用独立 COURSE_SUSPENSION_IAM_TOKEN 加密凭据；最多1000个ID。响应只含聚合人数，不返回学生身份。统计为读取时事实；数据库故障不得当成零人数。
      parameters:
        - {name: X-Internal-Caller, in: header, required: true, schema: {type: string, enum: [iam-service]}}
        - {name: X-Internal-Service-Token, in: header, required: true, schema: {type: string}, description: 不打印或记录的加密配置秘密}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [courseIds]
              properties:
                courseIds: {type: array, maxItems: 1000, items: {type: string, format: uuid}}
      responses:
        '200':
          description: 精确去重人数；空课程集合为零
          content:
            application/json:
              schema:
                type: object
                required: [activeStudents]
                properties:
                  activeStudents: {type: integer, format: int64, minimum: 0}
        '401': {$ref: 'openapi.yaml#/components/responses/Unauthorized'}
        '422': {$ref: 'openapi.yaml#/components/responses/ValidationFailed'}
        '500': {$ref: 'openapi.yaml#/components/responses/InternalError'}

      responses:
        '201': {description: Draft assessment created., content: {application/json: {schema: {$ref: '#/components/schemas/TeacherAssessment'}}}}
        '200': {description: Identical idempotent replay., content: {application/json: {schema: {$ref: '#/components/schemas/TeacherAssessment'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/LearningNotFound'}
        '409': {$ref: '#/components/responses/LearningConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '503': {$ref: '#/components/responses/LearningDependencyUnavailable'}
  /api/v1/teacher/assessments/{assessmentId}:
    get:
      tags: [Teacher Assessments]
      operationId: getTeacherAssessment
      summary: Get one assessment in the current teacher's course scope
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
      responses:
        '200': {description: Full teacher projection., content: {application/json: {schema: {$ref: '#/components/schemas/TeacherAssessment'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/LearningNotFound'}
    put:
      tags: [Teacher Assessments]
      operationId: updateTeacherAssessment
      summary: Update draft metadata with optimistic revision
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdateAssessmentRequest'}}}
      responses:
        '200': {description: Updated draft., content: {application/json: {schema: {$ref: '#/components/schemas/TeacherAssessment'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/LearningNotFound'}
        '409': {$ref: '#/components/responses/LearningConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      tags: [Teacher Assessments]
      operationId: deleteTeacherAssessment
      summary: Delete one owned draft assessment
      description: Only DRAFT assessments can be deleted. Published assessment history must be archived instead.
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
      responses:
        '204': {description: Draft assessment deleted.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/LearningNotFound'}
        '409': {$ref: '#/components/responses/LearningConflict'}
  /api/v1/teacher/assessments/{assessmentId}/questions:
    put:
      tags: [Teacher Assessments]
      operationId: replaceAssessmentQuestions
      summary: Replace ordered draft questions using exact immutable questionVersionId values
      description: SYSTEM question versions and current teacher TEACHER question versions are allowed. Other teachers' private versions are hidden as 404. Published papers cannot be changed.
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ReplaceAssessmentQuestionsRequest'}}}
      responses:
        '200': {description: Updated draft., content: {application/json: {schema: {$ref: '#/components/schemas/TeacherAssessment'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/LearningNotFound'}
        '409': {$ref: '#/components/responses/LearningConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/v1/teacher/assessments/{assessmentId}/publication:
    put:
      tags: [Teacher Assessments]
      operationId: updateAssessmentPublication
      summary: Publish an immutable paper snapshot or archive it
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdateAssessmentPublicationRequest'}}}
      responses:
        '200': {description: Current assessment state., content: {application/json: {schema: {$ref: '#/components/schemas/TeacherAssessment'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/LearningNotFound'}
        '409': {$ref: '#/components/responses/LearningConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/v1/teacher/assessments/{assessmentId}/closure:
    post:
      tags: [Teacher Assessments]
      operationId: closeTeacherAssessment
      summary: Irreversibly close an owned published assessment and enqueue bounded draft settlement
      description: Closing immediately rejects new attempts and answer writes. Existing drafts are finalized only from their last successfully saved server answers by bounded, idempotent and recoverable background batches. The affected count is frozen in the close receipt; pendingSettlementCount remains authoritative until it reaches zero.
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CloseAssessmentRequest'}}}
      responses:
        '200': {description: Close receipt or identical idempotent replay., content: {application/json: {schema: {$ref: '#/components/schemas/CloseAssessmentResult'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/LearningNotFound'}
        '409': {$ref: '#/components/responses/LearningConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/teacher/assessments/{assessmentId}/grade-publication:
    post:
      tags: [Teacher Assessments]
      operationId: publishAssessmentGrades
      summary: Irreversibly publish all current and future recalculated grades for an owned assessment
      description: Requires the assessment to be closed, all drafts settled and every answer needing manual grading completed. Publication cannot be withdrawn; later regrading updates the visible score and gradeUpdatedAt without changing the publication fact.
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PublishAssessmentResultRequest'}}}
      responses:
        '200': {description: Current teacher assessment and replay marker., content: {application/json: {schema: {$ref: '#/components/schemas/AssessmentPublicationCommandResult'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/LearningNotFound'}
        '409': {$ref: '#/components/responses/LearningConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/teacher/assessments/{assessmentId}/deadline:
    put:
      tags: [Teacher Assessments]
      operationId: updateTeacherAssessmentDeadline
      summary: Adjust an owned published assessment deadline with an audit record
      description: Only an open, unpublished assessment can be adjusted. The new final deadline must be at least one hour after server time; expectedRevision protects concurrent changes and prior late submissions are reclassified from the new close time.
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UpdateAssessmentDeadlineRequest'}}}
      responses:
        '200': {description: Updated teacher assessment., content: {application/json: {schema: {$ref: '#/components/schemas/TeacherAssessment'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/LearningNotFound'}
        '409': {$ref: '#/components/responses/LearningConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/LearningDependencyUnavailable'}
  /api/v1/teacher/assessments/{assessmentId}/answer-publication:
    post:
      tags: [Teacher Assessments]
      operationId: publishAssessmentAnswers
      summary: Irreversibly publish reference answers and analyses for an owned assessment
      description: Manual publication requires closure and zero pending draft settlements but does not require subjective grading to finish. HOMEWORK and EXAM answers can never be published before whole-assessment closure.
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PublishAssessmentResultRequest'}}}
      responses:
        '200': {description: Current teacher assessment and replay marker., content: {application/json: {schema: {$ref: '#/components/schemas/AssessmentPublicationCommandResult'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/LearningNotFound'}
        '409': {$ref: '#/components/responses/LearningConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/teacher/assessments/{assessmentId}/results:
    get:
      tags: [Teacher Assessments]
      operationId: listAssessmentResults
      summary: Page attempts for an assessment in the current teacher's scope
      parameters:
        - $ref: '#/components/parameters/AssessmentId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200': {description: Attempt results., content: {application/json: {schema: {$ref: '#/components/schemas/TeacherAttemptResultPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/LearningNotFound'}
  /api/v1/teacher/attempts/{attemptId}:
    get:
      tags: [Teacher Assessments]
      operationId: getTeacherAttemptResult
      summary: Read one final attempt result for owner-teacher grading
      description: Returns the requested learner's final valid attempt for an owner teacher after the HOMEWORK or EXAM is closed and draft settlement is complete. The assessment does not need all manual grading to be complete. Historical attempts, non-owner access and inconsistent attempt resources are hidden as 404; this endpoint does not relax the all-attempt results readiness gate.
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '200': {description: Single attempt result including grading facts., content: {application/json: {schema: {$ref: '#/components/schemas/AttemptResult'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/LearningNotFound'}
        '409': {$ref: '#/components/responses/LearningConflict'}
  /api/v1/teacher/attempts/{attemptId}/grades:
    post:
      tags: [Teacher Assessments]
      operationId: gradeAttemptAnswers
      summary: Transactionally grade manual answers with optimistic attempt revision
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ManualGradeRequest'}}}
      responses:
        '200': {description: Recalculated result and state., content: {application/json: {schema: {$ref: '#/components/schemas/AttemptResult'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/LearningNotFound'}
        '409': {$ref: '#/components/responses/LearningConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/v1/teacher/learning/courses/{courseId}/students:
    get:
      tags: [Teacher Assessments]
      operationId: listCourseStudentLearning
      summary: Page enrollment, progress and grading projections within the current teacher's owned course
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200': {description: Teacher-scoped learning projection., content: {application/json: {schema: {$ref: '#/components/schemas/StudentLearningPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/LearningNotFound'}
        '503': {$ref: '#/components/responses/LearningDependencyUnavailable'}
  /api/v1/teacher/gradebook:
    get:
      tags: [Teacher Assessments]
      operationId: getTeacherGradebook
      summary: Query a safe course HOMEWORK and EXAM gradebook matrix
      description: Requires teaching access and course ownership. The response contains only the requested page of students; totals and assessment statistics are database aggregates. Before every selected assessment is closed, settled and fully graded, the aggregate is PENDING and all score cells and numeric statistics are null. PRACTICE is rejected by the type filter and never included.
      parameters:
        - name: courseId
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: assessmentId
          in: query
          schema: {type: string, format: uuid}
        - name: type
          in: query
          schema: {type: string, enum: [HOMEWORK, EXAM]}
        - name: submissionStatus
          in: query
          schema: {$ref: '#/components/schemas/AssessmentSubmissionStatus'}
        - name: gradingStatus
          in: query
          schema: {$ref: '#/components/schemas/AssessmentGradingStatus'}
        - name: late
          in: query
          schema: {type: boolean}
        - name: keyword
          in: query
          schema: {type: string, maxLength: 120}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          schema: {$ref: '#/components/schemas/GradebookSortField', default: STUDENT_NUMBER}
        - name: direction
          in: query
          schema: {type: string, enum: [asc, desc], default: asc}
      responses:
        '200': {description: Course gradebook matrix and safe aggregate state., content: {application/json: {schema: {$ref: '#/components/schemas/Gradebook'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/LearningNotFound'}
        '409': {$ref: '#/components/responses/LearningConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/LearningDependencyUnavailable'}
  /api/v1/teacher/gradebook/export:
    get:
      tags: [Teacher Assessments]
      operationId: exportTeacherGradebookCsv
      summary: Stream a UTF-8 BOM gradebook CSV
      description: The selected course must have at most 5000 students and 100 closed, settled and fully graded HOMEWORK/EXAM assessments. The response is a synchronous dynamic-column CSV streamed by bounded student batches; the server does not construct the complete matrix or byte array in memory. It contains no answers, comments, contact information or historical attempts.
      parameters:
        - name: courseId
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: clientRequestId
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: assessmentId
          in: query
          schema: {type: string, format: uuid}
        - name: type
          in: query
          schema: {type: string, enum: [HOMEWORK, EXAM]}
        - name: submissionStatus
          in: query
          schema: {$ref: '#/components/schemas/AssessmentSubmissionStatus'}
        - name: gradingStatus
          in: query
          schema: {$ref: '#/components/schemas/AssessmentGradingStatus'}
        - name: late
          in: query
          schema: {type: boolean}
        - name: keyword
          in: query
          schema: {type: string, maxLength: 120}
      responses:
        '200':
          description: UTF-8 CSV with BOM; file name is stable and contains no student identity.
          headers:
            Content-Disposition:
              description: Attachment file name for the generated CSV.
              schema: {type: string, example: attachment; filename="gradebook-course-20260905.csv"}
          content:
            text/csv:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/LearningNotFound'}
        '409': {$ref: '#/components/responses/LearningConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/LearningDependencyUnavailable'}
  /api/v1/media/external-image-transfers:
    post:
      tags: [Media]
      operationId: transferExternalQuestionImage
      summary: Idempotently transfer one allow-listed HTTPS question image into media-service
      description: |
        TEACHER transfers create owner-only assets; SYSTEM transfers require administration:access and create
        administrator-owned assets readable by authenticated students and teachers. media-service validates the HTTPS host before and after
        redirects, blocks private/link-local destinations, enforces image MIME and size limits, stores the
        object through its own storage port and returns only a stable mediaId. The source URL is neither
        persisted nor logged. Dry-run callers must not invoke this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalImageTransferRequest'
      responses:
        '201':
          description: Image transferred and READY asset created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
        '200':
          description: Identical transfer replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/MediaConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/MediaDependencyUnavailable'
  /api/v1/media/uploads:
    post:
      tags: [Media]
      operationId: createMediaUpload
      summary: Create or replay an upload session
      description: |
        The authenticated caller declares the intended media purpose and immutable file metadata. The service validates role, purpose, extension, MIME, size and quota, then generates an unguessable private OSS object key. Reusing the same `clientRequestId` with the same request fingerprint returns the original session; changing any immutable field returns `MEDIA.IDEMPOTENCY_CONFLICT`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMediaUploadRequest'
      responses:
        '201':
          description: Upload session created.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Location:
              schema:
                type: string
                example: /api/v1/media/uploads/0198f434-215d-7abc-9123-123456789abc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadSession'
        '200':
          description: Existing session returned for an identical `clientRequestId` replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/MediaConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/MediaDependencyUnavailable'
  /api/v1/media/uploads/{uploadId}:
    get:
      tags: [Media]
      operationId: getMediaUpload
      summary: Get an owned upload session and resumable part state
      description: Ownership is derived from the authenticated Gateway identity. A session owned by another user is indistinguishable from a missing session.
      parameters:
        - $ref: '#/components/parameters/UploadId'
      responses:
        '200':
          description: Current upload session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MediaNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [Media]
      operationId: cancelMediaUpload
      summary: Idempotently cancel an unfinished upload session
      description: Cancels the exact recorded single-object upload or multipart provider upload. Terminal sessions are returned unchanged and no bucket listing or broad deletion is performed.
      parameters:
        - $ref: '#/components/parameters/UploadId'
      responses:
        '204':
          description: The unfinished session is canceled, or was already canceled.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MediaNotFound'
        '409':
          $ref: '#/components/responses/MediaConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/MediaDependencyUnavailable'
  /api/v1/media/uploads/{uploadId}/parts/authorize:
    post:
      tags: [Media]
      operationId: authorizeMediaUploadPart
      summary: Create a short-lived URL for one multipart part
      description: Repeating the same part number and declared length is idempotent. The URL is bound to the server-side object key and provider upload ID; neither is a business identifier.
      parameters:
        - $ref: '#/components/parameters/UploadId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizeMediaPartRequest'
      responses:
        '200':
          description: Short-lived part upload grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadGrant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MediaNotFound'
        '409':
          $ref: '#/components/responses/MediaConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/MediaDependencyUnavailable'
  /api/v1/media/uploads/{uploadId}/complete:
    post:
      tags: [Media]
      operationId: completeMediaUpload
      summary: Complete, verify and enqueue an uploaded object
      description: |
        For multipart sessions, parts must be unique and ordered by `partNumber`. The service completes the provider upload, performs an OSS HEAD check for object existence, length and MIME, and records the asset plus Outbox event in one local transaction. An identical replay returns the same asset; conflicting completion data returns `MEDIA.IDEMPOTENCY_CONFLICT`. Processing continues asynchronously and may remain pending while RabbitMQ is unavailable.
      parameters:
        - $ref: '#/components/parameters/UploadId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteMediaUploadRequest'
      responses:
        '202':
          description: Object verified and asynchronous processing accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
        '200':
          description: Existing asset returned for an identical completion replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MediaNotFound'
        '409':
          $ref: '#/components/responses/MediaConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/MediaDependencyUnavailable'
  /api/v1/media:
    get:
      tags: [Media]
      operationId: listMedia
      summary: List media assets owned by the authenticated caller
      description: Results are ordered by `createdAt` descending and then `mediaId` descending. Pagination is one-based and stable for a fixed dataset.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: purpose
          in: query
          schema:
            $ref: '#/components/schemas/MediaPurpose'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/MediaAssetStatus'
      responses:
        '200':
          description: Paged owned assets; no OSS key or signed URL is included.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAssetPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/media/{mediaId}:
    get:
      tags: [Media]
      operationId: getMedia
      summary: Get owned media metadata and processing status
      description: Returns stable media metadata and processing state only for the uploader. It does not grant domain visibility and never exposes an object key or signed URL.
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: Media metadata without storage credentials or a signed URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MediaNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/media/{mediaId}/access-grants:
    post:
      tags: [Media]
      operationId: createMediaAccessGrant
      description: Version 0.22.0 security correction. Direct grants require asset ownership, including for SYSTEM assets. Other users use the Learning public-question or assessment domain grant, which validates current content and answer publication. Existing short-lived URLs expire at their original TTL; no asset or course practice data is deleted.
      summary: Issue a short-lived, object-level read grant
      parameters:
        - $ref: '#/components/parameters/MediaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMediaAccessGrantRequest'
      responses:
        '201':
          description: Short-lived private read grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAccessGrant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/MediaNotFound'
        '409':
          $ref: '#/components/responses/MediaConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/MediaDependencyUnavailable'
  /api/v1/media/{mediaId}/binding-validations:
    post:
      tags: [Media]
      operationId: validateMediaBinding
      summary: Validate that an owned media asset can be bound by a domain service
      description: Validates uploader ownership, exact purpose and READY state without exposing storage metadata. Course-service calls this versioned contract before committing a local media reference; a successful validation does not itself create the reference.
      parameters:
        - $ref: '#/components/parameters/MediaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaBindingValidationRequest'
      responses:
        '200':
          description: The asset exists, belongs to the authenticated caller, matches the requested purpose and is READY.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaBindingValidation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MediaNotFound'
        '409':
          $ref: '#/components/responses/MediaConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/ai/preferences/explanation:
    get:
      tags: [Agent]
      operationId: getAgentExplanationPreference
      summary: Read the current user's explicit explanation preference
      description: Requires learning:access. When no explicit value exists, returns GUIDED_STEP_BY_STEP with revision 0. Inferred preferences, profiles, evidence and memories are never exposed.
      responses:
        '200': {description: Explicit preference or the public default., content: {application/json: {schema: {$ref: '#/components/schemas/AgentExplanationPreference'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    put:
      tags: [Agent]
      operationId: updateAgentExplanationPreference
      summary: Update the current user's explicit explanation preference
      description: Requires learning:access. expectedRevision prevents lost updates; retrying the same clientRequestId with the same body returns the original result without advancing revision again.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateAgentExplanationPreferenceRequest'}
      responses:
        '200': {description: Updated preference or idempotently recovered result., content: {application/json: {schema: {$ref: '#/components/schemas/AgentExplanationPreference'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/AgentConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/ai/conversations:
    post:
      tags: [Agent]
      operationId: createAgentConversation
      summary: Create or recover an AI conversation
      description: Requires learning:access. clientRequestId is unique per authenticated user; retrying the same logical request returns the same conversation and never creates a second row.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAgentConversationRequest'}
      responses:
        '201': {description: Conversation created., content: {application/json: {schema: {$ref: '#/components/schemas/AgentConversation'}}}}
        '200': {description: Idempotent retry recovered the existing conversation., content: {application/json: {schema: {$ref: '#/components/schemas/AgentConversation'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    get:
      tags: [Agent]
      operationId: listAgentConversations
      summary: List the current user's AI conversations
      description: Requires learning:access. Results are owner-scoped and ordered by lastMessageAt descending then id descending.
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200': {description: Owner-scoped conversation page., content: {application/json: {schema: {$ref: '#/components/schemas/AgentConversationPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/ai/conversations/{conversationId}:
    get:
      tags: [Agent]
      operationId: getAgentConversation
      summary: Get an owner-visible AI conversation
      parameters:
        - {$ref: '#/components/parameters/AgentConversationId'}
      responses:
        '200': {description: Conversation summary., content: {application/json: {schema: {$ref: '#/components/schemas/AgentConversation'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AgentNotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    patch:
      tags: [Agent]
      operationId: renameAgentConversation
      summary: Rename an active owner-visible AI conversation
      description: Requires learning:access. requestId is stable for one logical rename and expectedRevision is a CAS guard. Titles are trimmed and reject blank values or control characters. Foreign, archived and missing conversations are indistinguishable safe 404 responses.
      parameters:
        - {$ref: '#/components/parameters/AgentConversationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RenameAgentConversationRequest'}
      responses:
        '200': {description: Renamed conversation or an idempotent replay., content: {application/json: {schema: {$ref: '#/components/schemas/AgentConversation'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AgentNotFound'}
        '409': {$ref: '#/components/responses/AgentConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    delete:
      tags: [Agent]
      operationId: archiveAgentConversation
      summary: Archive an active owner-visible AI conversation
      description: Requires learning:access. This is user-visible deletion implemented as ACTIVE to ARCHIVED; messages, runs, audit, usage and memory facts remain retained. An active run returns 409 and must be stopped first. requestId is stable and expectedRevision is a CAS guard. Foreign, archived and missing conversations are indistinguishable safe 404 responses.
      parameters:
        - {$ref: '#/components/parameters/AgentConversationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ArchiveAgentConversationRequest'}
      responses:
        '204': {description: Conversation archived; no body is returned.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AgentNotFound'}
        '409': {$ref: '#/components/responses/AgentConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/ai/conversations/{conversationId}/messages:
    get:
      tags: [Agent]
      operationId: listAgentMessages
      summary: List persisted messages in an owner-visible conversation
      description: Interrupted assistant output is returned with completeness PARTIAL and must never be presented as a complete answer.
      parameters:
        - {$ref: '#/components/parameters/AgentConversationId'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/Size'}
      responses:
        '200': {description: Message page ordered by sequenceNo ascending., content: {application/json: {schema: {$ref: '#/components/schemas/AgentMessagePage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AgentNotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
    post:
      tags: [Agent]
      operationId: sendAgentMessage
      summary: Persist a user message and stream one Agent run
      description: |
        Requires learning:access. The browser sends stable identifiers only; Java re-authorizes every question,
        course, lesson and media reference and constructs trustedContext. clientRequestId is unique within the
        conversation. Retrying it returns the same messageId/runId and saved events without restarting Python.
        A different request while the conversation has an active run fails with 409 and is never queued.
      parameters:
        - {$ref: '#/components/parameters/AgentConversationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SendAgentMessageRequest'}
      responses:
        '200':
          description: UTF-8 SSE. data is AgentClientStreamEvent JSON; sequence is strictly consecutive and exactly one FINAL_RESULT terminates the run.
          headers:
            X-Agent-Run-Id:
              description: Stable run identity used for cancel and saved-event recovery.
              schema: {type: string, format: uuid}
          content:
            text/event-stream:
              schema: {type: string}
              x-event-schema: {$ref: '#/components/schemas/AgentClientStreamEvent'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AgentNotFound'}
        '409': {$ref: '#/components/responses/AgentConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/AgentUnavailable'}
  /api/v1/ai/conversations/{conversationId}/messages/{messageId}/regenerations:
    post:
      tags: [Agent]
      operationId: regenerateAgentMessage
      summary: Regenerate the last valid user message
      description: Requires learning:access and owner access. The server reuses and re-authorizes the persisted text, media and context snapshot, appends one assistant message and run, and preserves all old answers and events. The same clientRequestId only replays saved events.
      parameters:
        - {$ref: '#/components/parameters/AgentConversationId'}
        - {$ref: '#/components/parameters/AgentMessageId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegenerateAgentMessageRequest'}
      responses:
        '200':
          description: UTF-8 SSE using the same discriminated AgentClientStreamEvent union as a normal send.
          headers:
            X-Agent-Run-Id:
              description: Stable run identity used for cancel and saved-event recovery.
              schema: {type: string, format: uuid}
          content:
            text/event-stream:
              schema: {type: string}
              x-event-schema: {$ref: '#/components/schemas/AgentClientStreamEvent'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AgentNotFound'}
        '409': {$ref: '#/components/responses/AgentConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/AgentUnavailable'}
  /api/v1/ai/conversations/{conversationId}/messages/{messageId}/question-media/{mediaId}/access-grants:
    post:
      tags: [Agent]
      operationId: createAgentMessageQuestionMediaAccessGrant
      summary: Authorize one historical question image bound to an owner-visible message
      description: Requires learning:access and an owner-visible PRACTICE_FLOATING conversation. Agent Access derives questionId and the exact questionVersionId from the persisted USER message, then Learning verifies that immutable ACTIVE SYSTEM version and its safe content binding before issuing a short-lived grant. The browser cannot submit or override question identity, version, purpose, variant ownership or visibility. Foreign conversations/messages, mismatched versions, archived questions and unrelated media are indistinguishable from missing resources.
      parameters:
        - {$ref: '#/components/parameters/AgentConversationId'}
        - {$ref: '#/components/parameters/AgentMessageId'}
        - {$ref: '#/components/parameters/MediaId'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateAssessmentMediaAccessGrantRequest'}}}
      responses:
        '201': {description: Short-lived grant for the exact historical question content binding., content: {application/json: {schema: {$ref: '#/components/schemas/MediaAccessGrant'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AgentNotFound'}
        '409': {$ref: '#/components/responses/AgentConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/AgentUnavailable'}
  /api/v1/ai/runs/{runId}/events:
    get:
      tags: [Agent]
      operationId: listAgentRunEvents
      summary: Read saved public events without regenerating a run
      parameters:
        - {$ref: '#/components/parameters/AgentRunId'}
        - name: afterSequence
          in: query
          required: false
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        '200': {description: Saved owner-visible events ordered by sequence., content: {application/json: {schema: {$ref: '#/components/schemas/AgentRunEventPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AgentNotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/ai/runs/{runId}/cancel:
    post:
      tags: [Agent]
      operationId: cancelAgentRun
      summary: Idempotently cancel an owner-visible Agent run
      description: A terminal run remains terminal and never gets a second terminal event. Cancellation stops new model/tool work best-effort but cannot promise that an already-sent provider request is unbilled.
      parameters:
        - {$ref: '#/components/parameters/AgentRunId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CancelAgentRunRequest'}
      responses:
        '200': {description: Stable cancellation result., content: {application/json: {schema: {$ref: '#/components/schemas/CancelAgentRunResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AgentNotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/ai/conversations/{conversationId}/pending-practice-action:
    get:
      tags: [Agent]
      operationId: getPendingPracticeActionForConversation
      summary: Read the one current pending practice action in an owner-visible conversation
      description: Requires learning:access. An expired current action is atomically marked EXPIRED and then treated as no current action. No action and a foreign conversation are returned as the same safe 404. requestId is a stable identifier for one logical read retry; reads never create or mutate an action except the deterministic expiry transition.
      parameters:
        - {$ref: '#/components/parameters/AgentConversationId'}
        - {$ref: '#/components/parameters/ReadRequestId'}
      responses:
        '200': {description: The unique current action., content: {application/json: {schema: {$ref: '#/components/schemas/PendingPracticeAction'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AgentNotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/ai/pending-practice-actions/{actionId}:
    get:
      tags: [Agent]
      operationId: getPendingPracticeAction
      summary: Read an owner-visible practice action and its stable execution result
      parameters:
        - {$ref: '#/components/parameters/PendingPracticeActionId'}
        - {$ref: '#/components/parameters/ReadRequestId'}
      responses:
        '200': {description: Current action state., content: {application/json: {schema: {$ref: '#/components/schemas/PendingPracticeAction'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AgentNotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/ai/pending-practice-actions/{actionId}:confirm:
    post:
      tags: [Agent]
      operationId: confirmPendingPracticeAction
      summary: Confirm one current pending action and idempotently create the owner's autonomous practice
      description: Requires learning:access. The server uses only the already persisted candidates. expectedRevision is a CAS guard. A repeated requestId or a repeated confirmation returns the same execution result and never creates another practice. An expired action is not refreshed or regenerated.
      parameters:
        - {$ref: '#/components/parameters/PendingPracticeActionId'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ConfirmPendingPracticeActionRequest'}}}
      responses:
        '200': {description: Stable confirmed, executing, succeeded, or recovered action., content: {application/json: {schema: {$ref: '#/components/schemas/PendingPracticeAction'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AgentNotFound'}
        '409': {$ref: '#/components/responses/AgentConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/AgentUnavailable'}
  /api/v1/ai/pending-practice-actions/{actionId}:cancel:
    post:
      tags: [Agent]
      operationId: cancelPendingPracticeAction
      summary: Cancel one current pending action without deleting any conversation or created practice
      parameters:
        - {$ref: '#/components/parameters/PendingPracticeActionId'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CancelPendingPracticeActionRequest'}}}
      responses:
        '200': {description: Stable cancelled action or idempotent replay., content: {application/json: {schema: {$ref: '#/components/schemas/PendingPracticeAction'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AgentNotFound'}
        '409': {$ref: '#/components/responses/AgentConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/learning/autonomous-practices/{autonomousPracticeId}/entry:
    get:
      tags: [Learning]
      operationId: getAutonomousPracticeEntry
      summary: Read the current owner's autonomous-practice entry
      description: Requires learning:access. The practice is course-free and owner-only; a foreign id is a safe 404. The returned relative route is stable and contains no host or token.
      parameters:
        - {$ref: '#/components/parameters/AutonomousPracticeId'}
        - {$ref: '#/components/parameters/ReadRequestId'}
      responses:
        '200': {description: Owner-visible practice entry., content: {application/json: {schema: {$ref: '#/components/schemas/AutonomousPracticeEntry'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/LearningNotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: EDU_REFRESH
  headers:
    TraceId:
      description: Correlation identifier propagated through Gateway and services.
      schema:
        type: string
    RefreshCookie:
      description: Rotating opaque refresh token. HttpOnly, SameSite=Strict, Path=/api/v1 and Secure outside local development. Gateway removes this cookie before forwarding non-IAM routes.
      schema:
        type: string
        example: EDU_REFRESH=opaque-token; Max-Age=604800; Path=/api/v1; HttpOnly; SameSite=Strict; Secure
    ClearedRefreshCookie:
      description: Expired refresh cookie returned by logout.
      schema:
        type: string
        example: EDU_REFRESH=; Max-Age=0; Path=/api/v1; HttpOnly; SameSite=Strict; Secure
  parameters:
    Page:
      name: page
      in: query
      description: One-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    AgentConversationId:
      name: conversationId
      in: path
      required: true
      description: Owner-scoped AI conversation ID; foreign IDs are reported as not found.
      schema: {type: string, format: uuid}
    AgentMessageId:
      name: messageId
      in: path
      required: true
      description: Owner-scoped retained user message ID; foreign, stale or non-last messages are reported as not found.
      schema: {type: string, format: uuid}
    AgentRunId:
      name: runId
      in: path
      required: true
      description: Owner-scoped Agent run ID; foreign IDs are reported as not found.
      schema: {type: string, format: uuid}
    PendingPracticeActionId:
      name: actionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    AutonomousPracticeId:
      name: autonomousPracticeId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ReadRequestId:
      name: requestId
      in: query
      required: true
      description: Stable UUID for retrying one logical read. Reads are naturally idempotent and this identifier is used for correlation rather than selecting domain data.
      schema: {type: string, format: uuid}
    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LessonId:
      name: lessonId
      in: path
      required: true
      description: Course-domain lesson ID; it must belong to the version selected by the authorization endpoint.
      schema:
        type: string
        format: uuid
    ResourceId:
      name: resourceId
      in: path
      required: true
      description: Course-domain lesson media reference ID. The client never substitutes a media-service asset ID here.
      schema:
        type: string
        format: uuid
    UploadId:
      name: uploadId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MediaId:
      name: mediaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuestionId:
      name: questionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    KnowledgePointId:
      name: knowledgePointId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ImportTaskId:
      name: importTaskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssessmentId:
      name: assessmentId
      in: path
      required: true
      schema: {type: string, format: uuid}
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema: {type: string, format: uuid}
    WrongQuestionId:
      name: wrongQuestionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    UserId:
      name: userId
      in: path
      required: true
      description: Stable IAM account ID; administrator queries never accept an account name as a path identifier.
      schema: {type: string, format: uuid}
    CaptchaId:
      name: captchaId
      in: path
      required: true
      description: Opaque arithmetic CAPTCHA identifier. It carries no answer or account fact.
      schema: {type: string, format: uuid}
    IdentityTypePath:
      name: identityType
      in: path
      required: true
      description: Verified identity type to replace or remove.
      schema: {$ref: '#/components/schemas/IdentityType'}
  responses:
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:

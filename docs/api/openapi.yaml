      required: [id, questionScope, sourceMediaId, sourceFormat, sourceSystem, dryRun, maxItems, status, progress, totalRows, processedRows, successCount, reviewCount, resolvedCount, skippedCount, failureCount, errors, retainUntil, sourceReleasedAt, createdAt, updatedAt]
      properties:
        id:

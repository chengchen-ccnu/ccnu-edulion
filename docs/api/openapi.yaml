      tags: [Media]
      operationId: transferExternalQuestionImage
      summary: Idempotently transfer one allow-listed HTTPS question image into media-service
      description: |
        TEACHER transfers create owner-only assets; SYSTEM transfers require administration:access and create
        administrator-owned assets readable by authenticated students and teachers. media-service validates the HTTPS host before and after
        redirects, blocks private/link-local destinations, enforces image MIME and size limits, stores the
        object through its own storage port and returns only a stable mediaId. The source URL is neither
        persisted nor logged. Dry-run callers must not invoke this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalImageTransferRequest'
      responses:
        '201':
          description: Image transferred and READY asset created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
        '200':
          description: Identical transfer replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/MediaConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/MediaDependencyUnavailable'
  /api/v1/media/uploads:
    post:
      tags: [Media]
      operationId: createMediaUpload
      summary: Create or replay an upload session
      description: |
        The authenticated caller declares the intended media purpose and immutable file metadata. The service validates role, purpose, extension, MIME, size and quota, then generates an unguessable private OSS object key. Reusing the same `clientRequestId` with the same request fingerprint returns the original session; changing any immutable field returns `MEDIA.IDEMPOTENCY_CONFLICT`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMediaUploadRequest'
      responses:
        '201':
          description: Upload session created.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Location:
              schema:
                type: string
                example: /api/v1/media/uploads/0198f434-215d-7abc-9123-123456789abc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadSession'
        '200':
          description: Existing session returned for an identical `clientRequestId` replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/MediaConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/MediaDependencyUnavailable'
  /api/v1/media/uploads/{uploadId}:
    get:
      tags: [Media]
      operationId: getMediaUpload
      summary: Get an owned upload session and resumable part state
      description: Ownership is derived from the authenticated Gateway identity. A session owned by another user is indistinguishable from a missing session.
      parameters:
        - $ref: '#/components/parameters/UploadId'
      responses:
        '200':
          description: Current upload session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MediaNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [Media]
      operationId: cancelMediaUpload
      summary: Idempotently cancel an unfinished upload session
      description: Cancels the exact recorded single-object upload or multipart provider upload. Terminal sessions are returned unchanged and no bucket listing or broad deletion is performed.
      parameters:
        - $ref: '#/components/parameters/UploadId'
      responses:
        '204':
          description: The unfinished session is canceled, or was already canceled.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MediaNotFound'
        '409':
          $ref: '#/components/responses/MediaConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/MediaDependencyUnavailable'
  /api/v1/media/uploads/{uploadId}/parts/authorize:
    post:
      tags: [Media]
      operationId: authorizeMediaUploadPart
      summary: Create a short-lived URL for one multipart part
      description: Repeating the same part number and declared length is idempotent. The URL is bound to the server-side object key and provider upload ID; neither is a business identifier.
      parameters:
        - $ref: '#/components/parameters/UploadId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizeMediaPartRequest'
      responses:
        '200':
          description: Short-lived part upload grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadGrant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MediaNotFound'
        '409':
          $ref: '#/components/responses/MediaConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/MediaDependencyUnavailable'
  /api/v1/media/uploads/{uploadId}/complete:
    post:
      tags: [Media]
      operationId: completeMediaUpload
      summary: Complete, verify and enqueue an uploaded object
      description: |
        For multipart sessions, parts must be unique and ordered by `partNumber`. The service completes the provider upload, performs an OSS HEAD check for object existence, length and MIME, and records the asset plus Outbox event in one local transaction. An identical replay returns the same asset; conflicting completion data returns `MEDIA.IDEMPOTENCY_CONFLICT`. Processing continues asynchronously and may remain pending while RabbitMQ is unavailable.
      parameters:
        - $ref: '#/components/parameters/UploadId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteMediaUploadRequest'
      responses:
        '202':
          description: Object verified and asynchronous processing accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
        '200':
          description: Existing asset returned for an identical completion replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MediaNotFound'
        '409':
          $ref: '#/components/responses/MediaConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/MediaDependencyUnavailable'
  /api/v1/media:
    get:
      tags: [Media]
      operationId: listMedia
      summary: List media assets owned by the authenticated caller
      description: Results are ordered by `createdAt` descending and then `mediaId` descending. Pagination is one-based and stable for a fixed dataset.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: purpose
          in: query
          schema:
            $ref: '#/components/schemas/MediaPurpose'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/MediaAssetStatus'
      responses:
        '200':
          description: Paged owned assets; no OSS key or signed URL is included.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAssetPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/media/{mediaId}:
    get:
      tags: [Media]
      operationId: getMedia
      summary: Get owned media metadata and processing status
      description: Returns stable media metadata and processing state only for the uploader. It does not grant domain visibility and never exposes an object key or signed URL.
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: Media metadata without storage credentials or a signed URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MediaNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/media/{mediaId}/access-grants:
    post:
      tags: [Media]
      operationId: createMediaAccessGrant
      summary: Issue a short-lived, object-level read grant
      description: The uploader may preview an owned READY asset. HLS grants point to an expiring rewritten playlist whose segment URLs expire with the grant. The client cannot assert course, question, AI-session or review visibility, and signed URLs must never be persisted.
      parameters:
        - $ref: '#/components/parameters/MediaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMediaAccessGrantRequest'
      responses:
        '201':
          description: Short-lived private read grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAccessGrant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/MediaNotFound'
        '409':
          $ref: '#/components/responses/MediaConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/MediaDependencyUnavailable'
  /api/v1/media/{mediaId}/binding-validations:
    post:
      tags: [Media]
      operationId: validateMediaBinding
      summary: Validate that an owned media asset can be bound by a domain service
      description: Validates uploader ownership, exact purpose and READY state without exposing storage metadata. Course-service calls this versioned contract before committing a local media reference; a successful validation does not itself create the reference.
      parameters:
        - $ref: '#/components/parameters/MediaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaBindingValidationRequest'
      responses:
        '200':
          description: The asset exists, belongs to the authenticated caller, matches the requested purpose and is READY.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaBindingValidation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MediaNotFound'
        '409':
          $ref: '#/components/responses/MediaConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: EDU_REFRESH
  headers:
    TraceId:
      description: Correlation identifier propagated through Gateway and services.
      schema:
        type: string
    RefreshCookie:
      description: Rotating opaque refresh token. HttpOnly, SameSite=Strict, Path=/api/v1/auth and Secure outside local development.
      schema:
        type: string
        example: EDU_REFRESH=opaque-token; Max-Age=604800; Path=/api/v1/auth; HttpOnly; SameSite=Strict; Secure
    ClearedRefreshCookie:
      description: Expired refresh cookie returned by logout.
      schema:
        type: string
        example: EDU_REFRESH=; Max-Age=0; Path=/api/v1/auth; HttpOnly; SameSite=Strict; Secure
  parameters:
    Page:
      name: page
      in: query
      description: One-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LessonId:
      name: lessonId
      in: path
      required: true
      description: Course-domain lesson ID; it must belong to the version selected by the authorization endpoint.
      schema:
        type: string
        format: uuid
    ResourceId:
      name: resourceId
      in: path
      required: true
      description: Course-domain lesson media reference ID. The client never substitutes a media-service asset ID here.
      schema:
        type: string
        format: uuid
    UploadId:
      name: uploadId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MediaId:
      name: mediaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuestionId:
      name: questionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    KnowledgePointId:
      name: knowledgePointId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ImportTaskId:
      name: importTaskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: IAM.UNAUTHORIZED
            message: 请先登录或重新登录
            traceId: 2f6c8c3b98f14a9c
            timestamp: '2026-07-16T10:00:00Z'
            path: /api/v1/users/me
            fieldErrors: []
    Forbidden:
      description: The authenticated user cannot access the resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: IAM.FORBIDDEN
            message: 无权访问该资源
            traceId: 2f6c8c3b98f14a9c
            timestamp: '2026-07-16T10:00:00Z'
            path: /api/v1/users/me
            fieldErrors: []
    CoursePlaybackForbidden:
      description: The published course exists, but T11 enrollment/learning permission is required for this non-preview lesson.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: COURSE.ENROLLMENT_REQUIRED
            message: 该课时需要报名后观看
            traceId: 2f6c8c3b98f14a9c
            timestamp: '2026-08-05T10:00:00Z'
            path: /api/v1/courses/0195d9c2-1c3f-7b6e-a9dd-7367730a6201/lessons/0195d9c2-1c3f-7b6e-a9dd-7367730a6501/resources/0195d9c2-1c3f-7b6e-a9dd-7367730a6601/playback-grants
            fieldErrors: []
    RefreshConflict:
      description: The refresh token was already rotated or revoked. The whole token family is revoked and the user must log in again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: IAM.REFRESH_REUSED
            message: 登录会话已失效，请重新登录
            traceId: 2f6c8c3b98f14a9c
            timestamp: '2026-07-16T10:00:00Z'
            path: /api/v1/auth/refresh
            fieldErrors: []
    NotFound:
      description: The requested resource does not exist or is not visible.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: COURSE.NOT_FOUND
            message: 课程不存在或不可见
            traceId: 2f6c8c3b98f14a9c
            timestamp: '2026-07-16T10:00:00Z'
            path: /api/v1/courses/0195d9c2-1c3f-7b6e-a9dd-7367730a6201
            fieldErrors: []
    ValidationFailed:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: COMMON.VALIDATION_FAILED
            message: 请求参数不合法
            traceId: 2f6c8c3b98f14a9c
            timestamp: '2026-07-16T10:00:00Z'
            path: /api/v1/auth/login
            fieldErrors:
              - field: account
                reason: 账号不能为空
    VersionConflict:
      description: The editable course revision changed since it was read.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: COURSE.VERSION_CONFLICT
            message: 课程已被更新，请刷新后重试
            traceId: 2f6c8c3b98f14a9c
            timestamp: '2026-07-16T10:00:00Z'
            path: /api/v1/teacher/courses/0195d9c2-1c3f-7b6e-a9dd-7367730a6201
            fieldErrors: []
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: GATEWAY.RATE_LIMITED
            message: 请求过于频繁，请稍后再试
            traceId: 2f6c8c3b98f14a9c
            timestamp: '2026-07-16T10:00:00Z'
            path: /api/v1/auth/login
            fieldErrors: []
    InternalError:
      description: Unexpected server error without internal details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: COMMON.INTERNAL_ERROR
            message: 服务暂时不可用
            traceId: 2f6c8c3b98f14a9c
            timestamp: '2026-07-16T10:00:00Z'
            path: /api/v1/courses
            fieldErrors: []
    MediaNotFound:
      description: The upload or media asset does not exist or is not owned by the authenticated caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: MEDIA.NOT_FOUND
            message: 媒体资源不存在或不可见
            traceId: 2f6c8c3b98f14a9c
            timestamp: '2026-08-01T10:00:00Z'
            path: /api/v1/media/0198f434-215d-7abc-9123-123456789abc
            fieldErrors: []
    MediaConflict:
      description: The idempotency key, upload state, completion metadata or media state conflicts with the requested operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: MEDIA.IDEMPOTENCY_CONFLICT
            message: clientRequestId 已用于不同的上传请求
            traceId: 2f6c8c3b98f14a9c
            timestamp: '2026-08-01T10:00:00Z'
            path: /api/v1/media/uploads
            fieldErrors: []
    MediaDependencyUnavailable:
      description: OSS is unavailable for an operation that must complete synchronously. RabbitMQ outages do not use this response after media facts have committed; pending Outbox records are retried.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: MEDIA.STORAGE_UNAVAILABLE
            message: 媒体存储暂时不可用，请稍后重试
            traceId: 2f6c8c3b98f14a9c
            timestamp: '2026-08-01T10:00:00Z'
            path: /api/v1/media/uploads
            fieldErrors: []
    QuestionNotFound:
      description: The question, knowledge point or import task does not exist or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: QUESTION.NOT_FOUND
            message: 题目或任务不存在
            traceId: 2f6c8c3b98f14a9c
            timestamp: '2026-08-09T10:00:00Z'
            path: /api/v1/teacher/questions/0198f434-215d-7abc-9123-123456789abc
            fieldErrors: []
    QuestionConflict:
      description: The idempotency key, optimistic revision, lifecycle transition or stable knowledge-point code conflicts.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: QUESTION.REVISION_CONFLICT
            message: 题目已被更新，请刷新后重试
            traceId: 2f6c8c3b98f14a9c
            timestamp: '2026-08-09T10:00:00Z'
            path: /api/v1/teacher/questions/0198f434-215d-7abc-9123-123456789abc
            fieldErrors: []
    LegacyQuestionReviewConflict:
      description: The import task is not in a final reviewable state, the item revision is stale/already resolved, or the idempotency key conflicts with another request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            taskNotReviewable:
              summary: Final batch has not completed
              value:
                code: QUESTION_IMPORT.TASK_NOT_REVIEWABLE
                message: 历史导入任务未进入可人工复核终态
                traceId: 2f6c8c3b98f14a9c
                timestamp: '2026-08-12T10:00:00Z'
                path: /api/v1/teacher/question-imports/0198f434-215d-7abc-9123-123456789abc/items/0198f434-215d-7abc-9123-123456789abd/resolution
                fieldErrors: []
            revisionConflict:
              summary: Review item has changed
              value:
                code: QUESTION_IMPORT.ITEM_REVISION_CONFLICT
                message: 复核项已被更新，请刷新后重试
                traceId: 2f6c8c3b98f14a9c
                timestamp: '2026-08-12T10:00:00Z'
                path: /api/v1/teacher/question-imports/0198f434-215d-7abc-9123-123456789abc/items/0198f434-215d-7abc-9123-123456789abd/resolution
                fieldErrors: []
    QuestionDependencyUnavailable:
      description: media-service or the short-lived source download is unavailable before the requested operation can safely proceed. Committed Outbox events remain retryable and do not use this response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: QUESTION.MEDIA_UNAVAILABLE
            message: 媒体服务暂时不可用，请稍后重试
            traceId: 2f6c8c3b98f14a9c
            timestamp: '2026-08-09T10:00:00Z'
            path: /api/v1/teacher/question-imports
            fieldErrors: []
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [account, password]
      properties:
        account:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
    LoginResponse:
      type: object
      additionalProperties: false
      required: [tokenType, accessToken, expiresIn]
      properties:
        tokenType:
          type: string
          const: Bearer
        accessToken:
          type: string
        expiresIn:
          type: integer
          minimum: 1
          description: Access token lifetime in seconds.
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, displayName, roles, permissions]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        avatarUrl:
          type: [string, 'null']
          format: uri
        roles:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/UserRole'
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
    UserRole:
      type: string
      enum: [STUDENT, TEACHER, ADMIN]
    CoursePage:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CourseSummary'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
          format: int64
    CourseSummary:
      type: object
      additionalProperties: false
      required: [id, title, summary, coverMediaId, coverUrl, teacher, category, level, accessType]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 120
        summary:
          type: string
          maxLength: 300
        coverMediaId:
          type: [string, 'null']
          format: uuid
          description: Stable COURSE_COVER media reference for the immutable published version; null only for legacy or intentionally unbound courses.
        coverUrl:
          type: [string, 'null']
          format: uri
          readOnly: true
          description: Read-only display projection. Historical external URLs may appear during migration; signed URLs are transient and must not be persisted.
        teacher:
          $ref: '#/components/schemas/TeacherSummary'
        category:
          $ref: '#/components/schemas/CategorySummary'
        level:
          $ref: '#/components/schemas/CourseLevel'
        accessType:
          $ref: '#/components/schemas/CourseAccessType'
    CourseDetail:
      type: object
      additionalProperties: false
      required: [id, title, summary, description, coverMediaId, coverUrl, teacher, category, level, accessType, publishedVersion, chapters]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 120
        summary:
          type: string
          maxLength: 300
        description:
          type: string
          description: Markdown course description.
        coverMediaId:
          type: [string, 'null']
          format: uuid
          description: Stable COURSE_COVER media reference frozen into this published course version.
        coverUrl:
          type: [string, 'null']
          format: uri
          readOnly: true
          description: Historical or authorized display projection; never a course write fact.
        teacher:
          $ref: '#/components/schemas/TeacherSummary'
        category:
          $ref: '#/components/schemas/CategorySummary'
        level:
          $ref: '#/components/schemas/CourseLevel'
        accessType:
          $ref: '#/components/schemas/CourseAccessType'
        publishedVersion:
          type: string
        chapters:
          type: array
          items:
            $ref: '#/components/schemas/Chapter'
    TeacherSummary:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 80
    CategorySummary:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 50
    CourseLevel:
      type: string
      enum: [BEGINNER, INTERMEDIATE, ADVANCED]
    CourseAccessType:
      type: string
      enum: [PUBLIC, ENROLLMENT_REQUIRED]
    CoursePublicationStatus:
      type: string
      enum: [DRAFT, PUBLISHED, UNPUBLISHED]
    Chapter:
      type: object
      additionalProperties: false
      required: [id, title, sequence, lessons]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 120
        sequence:
          type: integer
          minimum: 1
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/LessonSummary'
    LessonSummary:
      type: object
      additionalProperties: false
      required: [id, title, type, sequence, previewable, resources]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 120
        type:
          type: string
          enum: [VIDEO, ARTICLE, ASSESSMENT]
        sequence:
          type: integer
          minimum: 1
        previewable:
          type: boolean
        resources:
          type: array
          description: Stable media references frozen into the same course version. Signed playback/download URLs are obtained separately and are never stored here.
          items:
            $ref: '#/components/schemas/LessonMediaResource'
    CreateCourseRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId, title, summary, description, coverMediaId, instructorDisplayName, categoryId, level, accessType]
      properties:
        clientRequestId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1

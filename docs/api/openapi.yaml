      description: Resolves the server-side final attempt pointer and never accepts a historical attempt identifier.
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/AssessmentId'
      responses:
        '200': {description: Safe final task result following T11B publication visibility., content: {application/json: {schema: {$ref: '#/components/schemas/AttemptResult'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/LearningNotFound'}
        '409': {$ref: '#/components/responses/LearningConflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/teacher/assessments:
    get:
      tags: [Teacher Assessments]
      operationId: listTeacherAssessments

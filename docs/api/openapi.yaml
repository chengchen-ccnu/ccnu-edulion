openapi: 3.1.0
info:
  title: EDU Platform Gateway API
  version: 0.5.0
  description: T07 Gateway contract. Authentication uses short-lived bearer access tokens and a rotating HttpOnly refresh cookie. Media uploads are authorized through Gateway, transferred directly to private OSS objects, and completed idempotently before asynchronous processing.
servers:
  - url: http://localhost:8080
    description: Local Gateway
  - url: http://127.0.0.1:4010
    description: OpenAPI mock
tags:
  - name: Authentication
  - name: Users
  - name: Courses
  - name: Teacher Courses
  - name: Media
paths:
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Log in with a platform account
      description: Validates credentials with account/IP rate limiting, records a login audit, returns a short-lived access token and sets a rotating HttpOnly refresh cookie. Failed credentials never reveal whether the account exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              student:
                value:
                  account: student_test_01
                  password: example-password
      responses:
        '200':
          description: Login succeeded
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                success:
                  value:
                    tokenType: Bearer
                    accessToken: mock-access-token
                    expiresIn: 900
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshAccessToken
      summary: Rotate the refresh session and issue a new access token
      description: The current refresh token is read only from the HttpOnly cookie. A successful call invalidates it and sets a replacement cookie.
      security:
        - refreshCookie: []
      responses:
        '200':
          description: Refresh succeeded and the refresh cookie was rotated.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/RefreshConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current refresh session and clear its cookie
      description: Missing or previously revoked refresh cookies are treated as idempotent success; the response always expires the browser cookie.
      security: []
      responses:
        '204':
          description: The session is revoked or was already absent. The refresh cookie is cleared.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Set-Cookie:
              $ref: '#/components/headers/ClearedRefreshCookie'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: Get the authenticated user summary
      description: Re-reads the active IAM account, roles and permissions for the JWT subject so frontends can restore current authorization without trusting persisted browser profile data.
      responses:
        '200':
          description: Current user
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
              examples:
                student:
                  value:
                    id: 0195d9c2-1c3f-7b6e-a9dd-7367730a6171
                    displayName: 示例学生
                    avatarUrl: https://cdn.example.test/avatars/student.png
                    roles: [STUDENT]
                    permissions: [learning:access]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/courses:
    get:
      tags: [Courses]
      operationId: listCourses
      summary: List published courses
      description: Returns only the current public version of published courses. Draft and unpublished versions are never projected, and all filters are optional.
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: keyword
          in: query
          schema:
            type: string
            maxLength: 100
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: level
          in: query
          schema:
            $ref: '#/components/schemas/CourseLevel'
        - name: accessType
          in: query
          schema:
            $ref: '#/components/schemas/CourseAccessType'
      responses:
        '200':
          description: Paged course summaries
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursePage'
              examples:
                firstPage:
                  value:
                    items:
                      - id: 0195d9c2-1c3f-7b6e-a9dd-7367730a6201
                        title: 七年级代数基础
                        summary: 从有理数到一元一次方程
                        coverUrl: https://cdn.example.test/courses/algebra-cover.jpg
                        teacher:
                          id: 0195d9c2-1c3f-7b6e-a9dd-7367730a6101
                          displayName: 王老师
                        category:
                          id: 0195d9c2-1c3f-7b6e-a9dd-7367730a6301
                          name: 初中数学
                        level: BEGINNER
                        accessType: PUBLIC
                    page: 1
                    size: 20
                    total: 1
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/courses/categories:
    get:
      tags: [Courses]
      operationId: listCourseCategories
      summary: List active course categories
      security: []
      responses:
        '200':
          description: Active categories ordered by name and identifier
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategorySummary'
              examples:
                active:
                  value:
                    - id: 0195d9c2-1c3f-7b6e-a9dd-7367730a6301
                      name: 初中数学
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/courses/{courseId}:
    get:
      tags: [Courses]
      operationId: getCourse
      summary: Get a published course detail
      description: Returns the immutable public version and ordered curriculum. Missing, draft and unpublished courses share the same not-found response to avoid leaking private course existence.
      security: []
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Course detail
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'
              examples:
                algebra:
                  value:
                    id: 0195d9c2-1c3f-7b6e-a9dd-7367730a6201
                    title: 七年级代数基础
                    summary: 从有理数到一元一次方程
                    description: "## 课程介绍\n循序渐进掌握代数基础。"
                    coverUrl: https://cdn.example.test/courses/algebra-cover.jpg
                    teacher:
                      id: 0195d9c2-1c3f-7b6e-a9dd-7367730a6101
                      displayName: 王老师
                    category:
                      id: 0195d9c2-1c3f-7b6e-a9dd-7367730a6301
                      name: 初中数学
                    level: BEGINNER
                    accessType: PUBLIC
                    publishedVersion: v1
                    chapters:
                      - id: 0195d9c2-1c3f-7b6e-a9dd-7367730a6401
                        title: 有理数
                        sequence: 1
                        lessons:
                          - id: 0195d9c2-1c3f-7b6e-a9dd-7367730a6501
                            title: 正数与负数
                            type: VIDEO
                            sequence: 1
                            previewable: true
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/teacher/courses:
    get:
      tags: [Teacher Courses]
      operationId: listTeacherCourses
      summary: List courses owned by the current teacher
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Paged teacher course editor snapshots ordered by most recently updated
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherCoursePage'
              examples:
                firstPage:
                  value:
                    items:
                      - id: 0195d9c2-1c3f-7b6e-a9dd-7367730a6201
                        publicationStatus: DRAFT
                        hasUnpublishedChanges: true
                        publishedVersion: null
                        draftVersion: v1
                        version: v1
                        revision: 0
                        title: 七年级代数基础
                        summary: 从有理数到一元一次方程
                        description: "## 课程介绍\n循序渐进掌握代数基础。"
                        coverUrl: https://cdn.example.test/courses/algebra-cover.jpg
                        instructorDisplayName: 王老师
                        category:
                          id: 0195d9c2-1c3f-7b6e-a9dd-7367730a6301
                          name: 初中数学
                        level: BEGINNER
                        accessType: PUBLIC
                        chapters: []
                        createdAt: '2026-08-01T00:00:00Z'
                        updatedAt: '2026-08-01T00:00:00Z'
                    page: 1
                    size: 20
                    total: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Teacher Courses]
      operationId: createTeacherCourse
      summary: Create an idempotent course draft owned by the current teacher
      description: Repeating the same `clientRequestId` for the same teacher returns the originally created course.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourseRequest'
      responses:
        '201':
          description: Course draft created
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Location:
              schema:
                type: string
                example: /api/v1/teacher/courses/0195d9c2-1c3f-7b6e-a9dd-7367730a6201
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherCourse'
        '200':
          description: Existing course returned for a repeated `clientRequestId`
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherCourse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/teacher/courses/{courseId}:
    get:
      tags: [Teacher Courses]
      operationId: getTeacherCourse
      summary: Get the current teacher-owned course editor snapshot
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Current draft when present, otherwise the latest published version
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherCourse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Teacher Courses]
      operationId: updateTeacherCourse
      summary: Replace editable course metadata
      description: Editing a course without a draft copies the immutable published version into a new draft first. Repeating an identical request body is a no-op.
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCourseRequest'
      responses:
        '200':
          description: Updated editor snapshot
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherCourse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/teacher/courses/{courseId}/curriculum:
    put:
      tags: [Teacher Courses]
      operationId: replaceTeacherCourseCurriculum
      summary: Replace the complete editable chapter and lesson ordering
      description: Repeating an identical curriculum body is a no-op and preserves the current chapter and lesson identifiers.
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceCurriculumRequest'
      responses:
        '200':
          description: Updated editor snapshot
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherCourse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/teacher/courses/{courseId}/publication:
    put:
      tags: [Teacher Courses]
      operationId: updateTeacherCoursePublication
      summary: Publish the current draft or unpublish the current live course
      description: Publishing archives the previous published version without modifying it. Repeating the same target status is idempotent.
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePublicationRequest'
      responses:
        '200':
          description: Current publication state
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursePublication'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/media/uploads:
    post:
      tags: [Media]
      operationId: createMediaUpload
      summary: Create or replay an upload session
      description: |
        The authenticated caller declares the intended media purpose and immutable file metadata. The service validates role, purpose, extension, MIME, size and quota, then generates an unguessable private OSS object key. Reusing the same `clientRequestId` with the same request fingerprint returns the original session; changing any immutable field returns `MEDIA.IDEMPOTENCY_CONFLICT`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMediaUploadRequest'
      responses:
        '201':
          description: Upload session created.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Location:
              schema:
                type: string
                example: /api/v1/media/uploads/0198f434-215d-7abc-9123-123456789abc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadSession'
        '200':
          description: Existing session returned for an identical `clientRequestId` replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/MediaConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/MediaDependencyUnavailable'
  /api/v1/media/uploads/{uploadId}:
    get:
      tags: [Media]
      operationId: getMediaUpload
      summary: Get an owned upload session and resumable part state
      description: Ownership is derived from the authenticated Gateway identity. A session owned by another user is indistinguishable from a missing session.
      parameters:
        - $ref: '#/components/parameters/UploadId'
      responses:
        '200':
          description: Current upload session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MediaNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [Media]
      operationId: cancelMediaUpload
      summary: Idempotently cancel an unfinished upload session
      description: Cancels the exact recorded single-object upload or multipart provider upload. Terminal sessions are returned unchanged and no bucket listing or broad deletion is performed.
      parameters:
        - $ref: '#/components/parameters/UploadId'
      responses:
        '204':
          description: The unfinished session is canceled, or was already canceled.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MediaNotFound'
        '409':
          $ref: '#/components/responses/MediaConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/MediaDependencyUnavailable'
  /api/v1/media/uploads/{uploadId}/parts/authorize:
    post:
      tags: [Media]
      operationId: authorizeMediaUploadPart
      summary: Create a short-lived URL for one multipart part
      description: Repeating the same part number and declared length is idempotent. The URL is bound to the server-side object key and provider upload ID; neither is a business identifier.
      parameters:
        - $ref: '#/components/parameters/UploadId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizeMediaPartRequest'
      responses:
        '200':
          description: Short-lived part upload grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadGrant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MediaNotFound'
        '409':
          $ref: '#/components/responses/MediaConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/MediaDependencyUnavailable'
  /api/v1/media/uploads/{uploadId}/complete:
    post:
      tags: [Media]
      operationId: completeMediaUpload
      summary: Complete, verify and enqueue an uploaded object
      description: |
        For multipart sessions, parts must be unique and ordered by `partNumber`. The service completes the provider upload, performs an OSS HEAD check for object existence, length and MIME, and records the asset plus Outbox event in one local transaction. An identical replay returns the same asset; conflicting completion data returns `MEDIA.IDEMPOTENCY_CONFLICT`. Processing continues asynchronously and may remain pending while RabbitMQ is unavailable.
      parameters:
        - $ref: '#/components/parameters/UploadId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteMediaUploadRequest'
      responses:
        '202':
          description: Object verified and asynchronous processing accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
        '200':
          description: Existing asset returned for an identical completion replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MediaNotFound'
        '409':
          $ref: '#/components/responses/MediaConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/MediaDependencyUnavailable'
  /api/v1/media:
    get:
      tags: [Media]
      operationId: listMedia
      summary: List media assets owned by the authenticated caller
      description: Results are ordered by `createdAt` descending and then `mediaId` descending. Pagination is one-based and stable for a fixed dataset.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: purpose
          in: query
          schema:
            $ref: '#/components/schemas/MediaPurpose'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/MediaAssetStatus'
      responses:
        '200':
          description: Paged owned assets; no OSS key or signed URL is included.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAssetPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/media/{mediaId}:
    get:
      tags: [Media]
      operationId: getMedia
      summary: Get owned media metadata and processing status
      description: Returns stable media metadata and processing state only for the uploader. It does not grant domain visibility and never exposes an object key or signed URL.
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: Media metadata without storage credentials or a signed URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MediaNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/media/{mediaId}/access-grants:
    post:
      tags: [Media]
      operationId: createMediaAccessGrant
      summary: Issue a short-lived, object-level read grant
      description: T07 permits the uploader to preview an owned READY asset. Domain-authorized viewers are added by later consumer tasks; the client cannot assert course, question, AI-session or review visibility. Signed URLs are transient projections and must not be persisted.
      parameters:
        - $ref: '#/components/parameters/MediaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMediaAccessGrantRequest'
      responses:
        '201':
          description: Short-lived private read grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAccessGrant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/MediaNotFound'
        '409':
          $ref: '#/components/responses/MediaConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/MediaDependencyUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: EDU_REFRESH
  headers:
    TraceId:
      description: Correlation identifier propagated through Gateway and services.
      schema:
        type: string
    RefreshCookie:
      description: Rotating opaque refresh token. HttpOnly, SameSite=Strict, Path=/api/v1/auth and Secure outside local development.
      schema:
        type: string
        example: EDU_REFRESH=opaque-token; Max-Age=604800; Path=/api/v1/auth; HttpOnly; SameSite=Strict; Secure
    ClearedRefreshCookie:
      description: Expired refresh cookie returned by logout.
      schema:
        type: string
        example: EDU_REFRESH=; Max-Age=0; Path=/api/v1/auth; HttpOnly; SameSite=Strict; Secure
  parameters:
    Page:
      name: page
      in: query
      description: One-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UploadId:
      name: uploadId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MediaId:
      name: mediaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: IAM.UNAUTHORIZED
            message: 请先登录或重新登录
            traceId: 2f6c8c3b98f14a9c
            timestamp: '2026-07-16T10:00:00Z'
            path: /api/v1/users/me
            fieldErrors: []
    Forbidden:
      description: The authenticated user cannot access the resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: IAM.FORBIDDEN
            message: 无权访问该资源
            traceId: 2f6c8c3b98f14a9c
            timestamp: '2026-07-16T10:00:00Z'
            path: /api/v1/users/me
            fieldErrors: []
    RefreshConflict:
      description: The refresh token was already rotated or revoked. The whole token family is revoked and the user must log in again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: IAM.REFRESH_REUSED
            message: 登录会话已失效，请重新登录
            traceId: 2f6c8c3b98f14a9c
            timestamp: '2026-07-16T10:00:00Z'
            path: /api/v1/auth/refresh
            fieldErrors: []
    NotFound:
      description: The requested resource does not exist or is not visible.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: COURSE.NOT_FOUND
            message: 课程不存在或不可见
            traceId: 2f6c8c3b98f14a9c
            timestamp: '2026-07-16T10:00:00Z'
            path: /api/v1/courses/0195d9c2-1c3f-7b6e-a9dd-7367730a6201
            fieldErrors: []
    ValidationFailed:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: COMMON.VALIDATION_FAILED
            message: 请求参数不合法
            traceId: 2f6c8c3b98f14a9c
            timestamp: '2026-07-16T10:00:00Z'
            path: /api/v1/auth/login
            fieldErrors:
              - field: account
                reason: 账号不能为空
    VersionConflict:
      description: The editable course revision changed since it was read.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: COURSE.VERSION_CONFLICT
            message: 课程已被更新，请刷新后重试
            traceId: 2f6c8c3b98f14a9c
            timestamp: '2026-07-16T10:00:00Z'
            path: /api/v1/teacher/courses/0195d9c2-1c3f-7b6e-a9dd-7367730a6201
            fieldErrors: []
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: GATEWAY.RATE_LIMITED
            message: 请求过于频繁，请稍后再试
            traceId: 2f6c8c3b98f14a9c
            timestamp: '2026-07-16T10:00:00Z'
            path: /api/v1/auth/login
            fieldErrors: []
    InternalError:
      description: Unexpected server error without internal details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: COMMON.INTERNAL_ERROR
            message: 服务暂时不可用
            traceId: 2f6c8c3b98f14a9c
            timestamp: '2026-07-16T10:00:00Z'
            path: /api/v1/courses
            fieldErrors: []
    MediaNotFound:
      description: The upload or media asset does not exist or is not owned by the authenticated caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: MEDIA.NOT_FOUND
            message: 媒体资源不存在或不可见
            traceId: 2f6c8c3b98f14a9c
            timestamp: '2026-08-01T10:00:00Z'
            path: /api/v1/media/0198f434-215d-7abc-9123-123456789abc
            fieldErrors: []
    MediaConflict:
      description: The idempotency key, upload state, completion metadata or media state conflicts with the requested operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: MEDIA.IDEMPOTENCY_CONFLICT
            message: clientRequestId 已用于不同的上传请求
            traceId: 2f6c8c3b98f14a9c
            timestamp: '2026-08-01T10:00:00Z'
            path: /api/v1/media/uploads
            fieldErrors: []
    MediaDependencyUnavailable:
      description: OSS is unavailable for an operation that must complete synchronously. RabbitMQ outages do not use this response after media facts have committed; pending Outbox records are retried.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: MEDIA.STORAGE_UNAVAILABLE
            message: 媒体存储暂时不可用，请稍后重试
            traceId: 2f6c8c3b98f14a9c
            timestamp: '2026-08-01T10:00:00Z'
            path: /api/v1/media/uploads
            fieldErrors: []
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [account, password]
      properties:
        account:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
    LoginResponse:
      type: object
      additionalProperties: false
      required: [tokenType, accessToken, expiresIn]
      properties:
        tokenType:
          type: string
          const: Bearer
        accessToken:
          type: string
        expiresIn:
          type: integer
          minimum: 1
          description: Access token lifetime in seconds.
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, displayName, roles, permissions]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        avatarUrl:
          type: [string, 'null']
          format: uri
        roles:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/UserRole'
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
    UserRole:
      type: string
      enum: [STUDENT, TEACHER, ADMIN]
    CoursePage:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CourseSummary'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
          format: int64
    CourseSummary:
      type: object
      additionalProperties: false
      required: [id, title, summary, coverUrl, teacher, category, level, accessType]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 120
        summary:
          type: string
          maxLength: 300
        coverUrl:
          type: string
          format: uri
        teacher:
          $ref: '#/components/schemas/TeacherSummary'
        category:
          $ref: '#/components/schemas/CategorySummary'
        level:
          $ref: '#/components/schemas/CourseLevel'
        accessType:
          $ref: '#/components/schemas/CourseAccessType'
    CourseDetail:
      type: object
      additionalProperties: false
      required: [id, title, summary, description, coverUrl, teacher, category, level, accessType, publishedVersion, chapters]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 120
        summary:
          type: string
          maxLength: 300
        description:
          type: string
          description: Markdown course description.
        coverUrl:
          type: string
          format: uri
        teacher:
          $ref: '#/components/schemas/TeacherSummary'
        category:
          $ref: '#/components/schemas/CategorySummary'
        level:
          $ref: '#/components/schemas/CourseLevel'
        accessType:
          $ref: '#/components/schemas/CourseAccessType'
        publishedVersion:
          type: string
        chapters:
          type: array
          items:
            $ref: '#/components/schemas/Chapter'
    TeacherSummary:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 80
    CategorySummary:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 50
    CourseLevel:
      type: string
      enum: [BEGINNER, INTERMEDIATE, ADVANCED]
    CourseAccessType:
      type: string
      enum: [PUBLIC, ENROLLMENT_REQUIRED]
    CoursePublicationStatus:
      type: string
      enum: [DRAFT, PUBLISHED, UNPUBLISHED]
    Chapter:
      type: object
      additionalProperties: false
      required: [id, title, sequence, lessons]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 120
        sequence:
          type: integer
          minimum: 1
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/LessonSummary'
    LessonSummary:
      type: object
      additionalProperties: false
      required: [id, title, type, sequence, previewable]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 120
        type:
          type: string
          enum: [VIDEO, ARTICLE, ASSESSMENT]
        sequence:
          type: integer
          minimum: 1
        previewable:
          type: boolean
    CreateCourseRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId, title, summary, description, coverUrl, instructorDisplayName, categoryId, level, accessType]
      properties:
        clientRequestId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 120
        summary:
          type: string
          maxLength: 300
        description:
          type: string
          maxLength: 20000
        coverUrl:
          type: string
          format: uri
          maxLength: 512
        instructorDisplayName:
          type: string
          minLength: 1
          maxLength: 80
          description: Course byline content; ownership is always taken from the trusted authenticated user ID.
        categoryId:
          type: string
          format: uuid
        level:
          $ref: '#/components/schemas/CourseLevel'
        accessType:
          $ref: '#/components/schemas/CourseAccessType'
    UpdateCourseRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, title, summary, description, coverUrl, instructorDisplayName, categoryId, level, accessType]
      properties:
        expectedRevision:
          type: integer
          minimum: 0
          format: int64
        title:
          type: string
          minLength: 1
          maxLength: 120
        summary:
          type: string
          maxLength: 300
        description:
          type: string
          maxLength: 20000
        coverUrl:
          type: string
          format: uri
          maxLength: 512
        instructorDisplayName:
          type: string
          minLength: 1
          maxLength: 80
        categoryId:
          type: string
          format: uuid
        level:
          $ref: '#/components/schemas/CourseLevel'
        accessType:
          $ref: '#/components/schemas/CourseAccessType'
    ReplaceCurriculumRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, chapters]
      properties:
        expectedRevision:
          type: integer
          minimum: 0
          format: int64
        chapters:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ChapterInput'
    ChapterInput:
      type: object
      additionalProperties: false
      required: [title, sequence, lessons]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        sequence:
          type: integer
          minimum: 1
        lessons:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/LessonInput'
    LessonInput:
      type: object
      additionalProperties: false
      required: [title, type, sequence, previewable]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        type:
          type: string
          enum: [VIDEO, ARTICLE, ASSESSMENT]
        sequence:
          type: integer
          minimum: 1
        previewable:
          type: boolean
    UpdatePublicationRequest:
      type: object
      additionalProperties: false
      required: [status, expectedRevision]
      properties:
        status:
          type: string
          enum: [PUBLISHED, UNPUBLISHED]
        expectedRevision:
          type: integer
          minimum: 0
          format: int64
    TeacherCourse:
      type: object
      additionalProperties: false
      required: [id, publicationStatus, hasUnpublishedChanges, version, revision, title, summary, description, coverUrl, instructorDisplayName, category, level, accessType, chapters, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        publicationStatus:
          $ref: '#/components/schemas/CoursePublicationStatus'
        hasUnpublishedChanges:
          type: boolean
        publishedVersion:
          type: [string, 'null']
        draftVersion:
          type: [string, 'null']
        version:
          type: string
        revision:
          type: integer
          minimum: 0
          format: int64
        title:
          type: string
        summary:
          type: string
        description:
          type: string
        coverUrl:
          type: string
          format: uri
        instructorDisplayName:
          type: string
        category:
          $ref: '#/components/schemas/CategorySummary'
        level:
          $ref: '#/components/schemas/CourseLevel'
        accessType:
          $ref: '#/components/schemas/CourseAccessType'
        chapters:
          type: array
          items:
            $ref: '#/components/schemas/Chapter'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TeacherCoursePage:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TeacherCourse'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
          format: int64
    CoursePublication:
      type: object
      additionalProperties: false
      required: [id, status, hasUnpublishedChanges, revision, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/CoursePublicationStatus'
        publishedVersion:
          type: [string, 'null']
        draftVersion:
          type: [string, 'null']
        hasUnpublishedChanges:
          type: boolean
        revision:
          type: integer
          minimum: 0
          format: int64
        updatedAt:
          type: string
          format: date-time
    MediaPurpose:
      type: string
      description: Stable business purpose. T07 enables COURSE_COVER and LESSON_VIDEO; later domain tasks enable the remaining values without inventing a second upload protocol.
      enum: [COURSE_COVER, LESSON_VIDEO, VIDEO_POSTER, SUBTITLE, COURSEWARE, ARTICLE_ATTACHMENT, QUESTION_IMAGE, QUESTION_AUDIO, QUESTION_ATTACHMENT, QUESTION_IMPORT_SOURCE, AI_QUESTION_IMAGE, USER_AVATAR, TEACHER_QUALIFICATION, BANNER_IMAGE, TOPIC_COVER, REPORT_EXPORT]
    MediaUploadMode:
      type: string
      enum: [SINGLE_PUT, MULTIPART]
    MediaUploadStatus:
      type: string
      enum: [CREATED, UPLOADING, UPLOADED, VERIFYING, PROCESSING, READY, REJECTED, FAILED, EXPIRED, CANCELED]
    MediaAssetStatus:
      type: string
      enum: [UPLOADED, VERIFYING, PROCESSING, READY, REJECTED, FAILED, EXPIRED, DELETING, DELETED]
    MediaProcessingStatus:
      type: string
      enum: [PENDING, RUNNING, SUCCEEDED, FAILED, CANCELED]
    CreateMediaUploadRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId, purpose, fileName, size, mimeType, sha256]
      properties:
        clientRequestId:
          type: string
          format: uuid
        purpose:
          $ref: '#/components/schemas/MediaPurpose'
        fileName:
          type: string
          minLength: 1
          maxLength: 255
          description: Original display name only. It is never used as the OSS object key.
        size:
          type: integer
          format: int64
          minimum: 1
        mimeType:
          type: string
          minLength: 3
          maxLength: 127
        sha256:
          type: string
          pattern: '^[a-fA-F0-9]{64}$'
    AuthorizeMediaPartRequest:
      type: object
      additionalProperties: false
      required: [partNumber, contentLength]
      properties:
        partNumber:
          type: integer
          minimum: 1
          maximum: 10000
        contentLength:
          type: integer
          format: int64
          minimum: 1
        contentMd5:
          type: [string, 'null']
          pattern: '^[A-Za-z0-9+/]{22}==$'
    CompleteMediaUploadRequest:
      type: object
      additionalProperties: false
      required: [sha256, parts]
      properties:
        sha256:
          type: string
          pattern: '^[a-fA-F0-9]{64}$'
        parts:
          type: array
          maxItems: 10000
          description: Empty for SINGLE_PUT. Required, unique and ascending for MULTIPART.
          items:
            $ref: '#/components/schemas/CompletedMediaPart'
    CompletedMediaPart:
      type: object
      additionalProperties: false
      required: [partNumber, etag]
      properties:
        partNumber:
          type: integer
          minimum: 1
          maximum: 10000
        etag:
          type: string
          minLength: 1
          maxLength: 128
    MediaUploadGrant:
      type: object
      additionalProperties: false
      required: [method, url, headers, expiresAt]
      properties:
        method:
          type: string
          const: PUT
        url:
          type: string
          format: uri
          description: Short-lived bearer URL. Never persist or log it.
        headers:
          type: object
          additionalProperties:
            type: string
          description: Exact headers that must accompany the direct OSS request.
        expiresAt:
          type: string
          format: date-time
    MediaMultipartUpload:
      type: object
      additionalProperties: false
      required: [partSize, maxParts, uploadedParts]
      properties:
        partSize:
          type: integer
          format: int64
          minimum: 5242880
        maxParts:
          type: integer
          minimum: 1
          maximum: 10000
        uploadedParts:
          type: array
          items:
            $ref: '#/components/schemas/UploadedMediaPart'
    UploadedMediaPart:
      type: object
      additionalProperties: false
      required: [partNumber, etag, size]
      properties:
        partNumber:
          type: integer
        etag:
          type: string
        size:
          type: integer
          format: int64
    MediaUploadSession:
      type: object
      additionalProperties: false
      required: [uploadId, clientRequestId, purpose, mode, status, fileName, size, mimeType, sha256, expiresAt, createdAt]
      properties:
        uploadId:
          type: string
          format: uuid
        clientRequestId:
          type: string
          format: uuid
        purpose:
          $ref: '#/components/schemas/MediaPurpose'
        mode:
          $ref: '#/components/schemas/MediaUploadMode'
        status:
          $ref: '#/components/schemas/MediaUploadStatus'
        fileName:
          type: string
        size:
          type: integer
          format: int64
        mimeType:
          type: string
        sha256:
          type: string
        uploadGrant:
          oneOf:
            - $ref: '#/components/schemas/MediaUploadGrant'
            - type: 'null'
        multipart:
          oneOf:
            - $ref: '#/components/schemas/MediaMultipartUpload'
            - type: 'null'
        mediaId:
          type: [string, 'null']
          format: uuid
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    MediaVariant:
      type: object
      additionalProperties: false
      required: [variant, mimeType, size]
      properties:
        variant:
          type: string
          maxLength: 80
          example: baseline-mp4-v1
        mimeType:
          type: string
        size:
          type: integer
          format: int64
          minimum: 0
    MediaAsset:
      type: object
      additionalProperties: false
      required: [mediaId, purpose, status, processingStatus, originalFileName, mimeType, size, sha256, variants, createdAt, updatedAt]
      properties:
        mediaId:
          type: string
          format: uuid
        purpose:
          $ref: '#/components/schemas/MediaPurpose'
        status:
          $ref: '#/components/schemas/MediaAssetStatus'
        processingStatus:
          $ref: '#/components/schemas/MediaProcessingStatus'
        originalFileName:
          type: string
        mimeType:
          type: string
        size:
          type: integer
          format: int64
        sha256:
          type: string
        variants:
          type: array
          items:
            $ref: '#/components/schemas/MediaVariant'
        errorCode:
          type: [string, 'null']
        errorMessage:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MediaAssetPage:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MediaAsset'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          format: int64
          minimum: 0
    CreateMediaAccessGrantRequest:
      type: object
      additionalProperties: false
      required: [variant, disposition]
      properties:
        variant:
          type: string
          maxLength: 80
          description: Use `ORIGINAL` for the verified private source object or a listed variant name.
        disposition:
          type: string
          enum: [INLINE, ATTACHMENT]
    MediaAccessGrant:
      type: object
      additionalProperties: false
      required: [method, url, headers, expiresAt]
      properties:
        method:
          type: string
          const: GET
        url:
          type: string
          format: uri
          description: Short-lived bearer URL. Never persist or log it.
        headers:
          type: object
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, traceId, timestamp, path, fieldErrors]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*\.[A-Z][A-Z0-9_]*$'
          example: COMMON.VALIDATION_FAILED
        message:
          type: string
        traceId:
          type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      additionalProperties: false
      required: [field, reason]
      properties:
        field:
          type: string
        reason:
          type: string
security:
  - bearerAuth: []

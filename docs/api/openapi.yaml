openapi: 3.1.0
info:
  title: EDU Platform Gateway API
  version: 0.24.2
  description: T15D adds owner-only conversation rename/archive commands, a finite next-message capability selection, and a structured single-turn practice offer while preserving T14.3 autonomous-practice confirmation. T15D.1 clarifies that a browser-visible pending practice action always contains at least one Java-verified candidate; zero-candidate retrieval returns only a normal student-facing answer. Java remains the authorization and write boundary; Python still executes eligibility, tool, budget, audit and proposal safeguards.
servers:
  - url: http://localhost:8080
    description: Local Gateway
  - url: http://127.0.0.1:4010
    description: OpenAPI mock
tags:
  - name: Authentication
  - name: Users
  - name: Protocols
  - name: Teacher Applications
  - name: Admin Users
  - name: Courses
  - name: Teacher Courses
  - name: Media
  - name: Teacher Questions
  - name: System Questions
  - name: Question Imports
  - name: Knowledge Points
  - name: Learning
  - name: Assessments
  - name: Teacher Assessments
  - name: Agent
paths:
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Log in with a verified email or mainland-China phone and password
      description: Accepts only a normalized verified email or +86 mainland-China phone identity; nickname and the internal compatibility account are never login identifiers. Password failures one through three do not require arithmetic CAPTCHA. Attempts four and five require a valid one-time CAPTCHA before password verification; a CAPTCHA error does not verify the password or increment the password-failure counter. The fifth wrong password locks the account for 15 minutes. Unknown identities follow the same external error and timing policy. Success returns a 15-minute access token and sets the existing seven-day rotating HttpOnly refresh cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              student:
                value:
                  identity: student1@example.invalid
                  password: example-password
      responses:
        '200':
          description: Login succeeded
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                success:
                  value:
                    tokenType: Bearer
                    accessToken: mock-access-token
                    expiresIn: 900
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/SecurityStateUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/verification-login-challenges:
    post:
      tags: [Authentication]
      operationId: createVerificationLoginChallenge
      summary: Request a verification code for an existing account login
      description: Requires a successfully consumed arithmetic CAPTCHA before any delivery attempt. Only an existing ACTIVE account with the requested verified identity can receive a code; unknown identities receive the same 202 response shape and comparable processing but are never registered automatically. Email uses the configured provider-neutral delivery port; phone is available only when the channel-capabilities response enables it.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateProtectedVerificationChallengeRequest'}
      responses:
        '202':
          description: Request accepted without disclosing whether the identity exists.
          content: {application/json: {schema: {$ref: '#/components/schemas/VerificationChallenge'}}}
        '422': {$ref: '#/components/responses/VerificationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/SecurityStateUnavailable'}
  /api/v1/auth/verification-login:
    post:
      tags: [Authentication]
      operationId: loginWithVerificationCode
      summary: Log an existing account in with a one-time verification code
      description: Atomically consumes the short-lived verification challenge and logs in only an existing ACTIVE account whose normalized verified identity matches it. Unknown identities, mismatched codes and expired/consumed challenges share the same failure response and never create an account. Success sets the same seven-day rotating HttpOnly refresh cookie as password login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VerificationCodeLoginRequest'}
      responses:
        '200':
          description: Login succeeded.
          headers:
            X-Trace-Id: {$ref: '#/components/headers/TraceId'}
            Set-Cookie: {$ref: '#/components/headers/RefreshCookie'}
          content: {application/json: {schema: {$ref: '#/components/schemas/LoginResponse'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/VerificationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/SecurityStateUnavailable'}
  /api/v1/auth/captchas:
    post:
      tags: [Authentication]
      operationId: createArithmeticCaptcha
      summary: Create a short-lived arithmetic image CAPTCHA
      description: Creates an approximately two-minute Redis challenge with bounded answer attempts. The answer never appears in the response, logs or a persistent database. A correct answer is consumed once by the protected operation; errors are separately rate-limited and never increment password-failure counters.
      security: []
      responses:
        '201':
          description: CAPTCHA created.
          content: {application/json: {schema: {$ref: '#/components/schemas/ArithmeticCaptcha'}}}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/SecurityStateUnavailable'}
  /api/v1/auth/captchas/{captchaId}/refresh:
    post:
      tags: [Authentication]
      operationId: refreshArithmeticCaptcha
      summary: Replace an arithmetic CAPTCHA within its bounded refresh allowance
      description: Invalidates the previous challenge and returns a new image in the same bounded refresh chain. Refresh is rate-limited; exceeding the chain allowance requires creating a fresh CAPTCHA.
      security: []
      parameters:
        - $ref: '#/components/parameters/CaptchaId'
      responses:
        '201':
          description: Previous CAPTCHA invalidated and replacement created.
          content: {application/json: {schema: {$ref: '#/components/schemas/ArithmeticCaptcha'}}}
        '404': {$ref: '#/components/responses/CaptchaNotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/SecurityStateUnavailable'}
  /api/v1/auth/channel-capabilities:
    get:
      tags: [Authentication]
      operationId: getAuthenticationChannelCapabilities
      summary: Get environment-safe registration and verification-login channel capabilities
      description: Allows clients to hide phone registration and phone verification-code login when production has no SMS provider. Password login remains available for any already verified identity. The response contains no provider credentials or account-existence facts.
      security: []
      responses:
        '200':
          description: Current channel capabilities.
          content: {application/json: {schema: {$ref: '#/components/schemas/AuthenticationChannelCapabilities'}}}
        '503': {$ref: '#/components/responses/SecurityStateUnavailable'}
  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshAccessToken
      summary: Rotate the refresh session and issue a new access token
      description: The current refresh token is read only from the HttpOnly cookie. A successful call invalidates it and sets a replacement cookie.
      security:
        - refreshCookie: []
      responses:
        '200':
          description: Refresh succeeded and the refresh cookie was rotated.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/RefreshConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current refresh session and clear its cookie
      description: Missing or previously revoked refresh cookies are treated as idempotent success; the response always expires the browser cookie.
      security: []
      responses:
        '204':
          description: The session is revoked or was already absent. The refresh cookie is cleared.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Set-Cookie:
              $ref: '#/components/headers/ClearedRefreshCookie'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/registration-challenges:
    post:
      tags: [Authentication]
      operationId: createRegistrationChallenge
      summary: Create a student-registration verification challenge
      description: Consumes a valid arithmetic CAPTCHA before creating a short-lived one-time delivery challenge and cooldown in Redis. Email is trimmed and matched case-insensitively; mainland-China phone input is normalized to +86 E.164. Local/test may use an explicitly configured non-logging fixed-code adapter, while production without the requested delivery channel returns 503 rather than pretending delivery succeeded. example.invalid Seed identities are never sent through SMTP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateProtectedVerificationChallengeRequest'}
      responses:
        '202':
          description: Challenge accepted for delivery without disclosing target availability.
          content: {application/json: {schema: {$ref: '#/components/schemas/VerificationChallenge'}}}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/SecurityStateUnavailable'}
  /api/v1/auth/register:
    post:
      tags: [Authentication]
      operationId: registerStudent
      summary: Consume a one-time challenge and create a learning-capable account
      description: Atomically creates one ACTIVE account with a server-generated internal compatibility account, one verified unique identity, the required 1-30 visible-character nickname, the STUDENT role with learning:access, and current TERMS/PRIVACY agreement facts in MySQL after one-time Redis verification-code consumption. Nicknames may contain Chinese characters and may be duplicated; blank/control-character nicknames are rejected and never participate in authentication. Public registration can never create ADMIN or teaching:access. Database unique constraints remain authoritative under concurrency.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterStudentRequest'}
      responses:
        '201':
          description: Account created. Login remains a separate explicit operation.
          content: {application/json: {schema: {$ref: '#/components/schemas/RegistrationResult'}}}
        '409': {$ref: '#/components/responses/IdentityConflict'}
        '422': {$ref: '#/components/responses/VerificationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/SecurityStateUnavailable'}
  /api/v1/auth/password-reset-challenges:
    post:
      tags: [Authentication]
      operationId: createPasswordResetChallenge
      summary: Request a non-enumerating password-reset challenge
      description: Consumes a valid arithmetic CAPTCHA before processing any one-time-code delivery. Existing and unknown targets receive the same 202 shape and comparable processing. Redis holds only short-lived digests, failure counters and cooldown state; no account-existence fact is exposed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateProtectedVerificationChallengeRequest'}
      responses:
        '202':
          description: Request accepted regardless of whether the target maps to an account.
          content: {application/json: {schema: {$ref: '#/components/schemas/VerificationChallenge'}}}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/SecurityStateUnavailable'}
  /api/v1/auth/password-reset:
    post:
      tags: [Authentication]
      operationId: resetPassword
      summary: Consume a password-reset challenge and invalidate every old session
      description: A successful reset replaces the password hash, increments the persistent account sessionVersion, revokes every Refresh Session, and records a security audit in one MySQL transaction. Redis is invalidated before the transaction so a cache failure cannot leave an old access token silently accepted. A correctly consumed challenge for an unknown or unavailable account returns the same 204 shape without changing any account, preventing the completion result from becoming an enumeration oracle.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResetPasswordRequest'}
      responses:
        '204': {description: Challenge consumed. When an active account matched, its password was reset and every previous access and refresh session was invalidated; account existence is not disclosed.}
        '422': {$ref: '#/components/responses/VerificationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/SecurityStateUnavailable'}
  /api/v1/auth/password/change:
    post:
      tags: [Authentication]
      operationId: changePassword
      summary: Change the authenticated account password and invalidate every device
      description: Requires the current password. Success increments persistent sessionVersion, revokes all Refresh Sessions including the current one, records an audit, and clears the refresh cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangePasswordRequest'}
      responses:
        '204':
          description: Password changed and all sessions revoked.
          headers:
            Set-Cookie: {$ref: '#/components/headers/ClearedRefreshCookie'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/SecurityStateUnavailable'}
  /api/v1/auth/logout-all:
    post:
      tags: [Authentication]
      operationId: logoutAllDevices
      summary: Invalidate access and refresh sessions on every device
      description: Increments persistent sessionVersion and revokes every Refresh Session. The current refresh cookie is cleared; repeated calls create a new audited version and remain safe.
      responses:
        '204':
          description: Every session is invalid and the current refresh cookie is cleared.
          headers:
            Set-Cookie: {$ref: '#/components/headers/ClearedRefreshCookie'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/SecurityStateUnavailable'}
  /api/v1/users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: Get the authenticated user summary
      description: Re-reads the active IAM account, roles and permissions for the JWT subject so frontends can restore current authorization without trusting persisted browser profile data.
      responses:
        '200':
          description: Current user
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
              examples:
                student:
                  value:
                    id: 0195d9c2-1c3f-7b6e-a9dd-7367730a6171
                    displayName: 示例学生
                    avatarUrl: https://cdn.example.test/avatars/student.png
                    roles: [STUDENT]
                    permissions: [learning:access]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/me/sessions:
    get:
      tags: [Users]
      operationId: listMySessions
      summary: List active Refresh Sessions for the current account
      description: Returns device labels and timestamps only; raw or hashed refresh tokens are never exposed. The current session is identified from the HttpOnly refresh cookie when present.
      responses:
        '200':
          description: Active, unexpired sessions ordered by most recent use.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/AccountSession'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/SecurityStateUnavailable'}
  /api/v1/users/me/identities:
    get:
      tags: [Users]
      operationId: listMyVerifiedIdentities
      summary: List the current account's masked verified identities
      description: Returns at most one verified email and one verified phone plus the account identity revision. Full normalized identity values are never returned.
      responses:
        '200':
          description: Current masked identities and revision.
          content: {application/json: {schema: {$ref: '#/components/schemas/VerifiedIdentityCollection'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/SecurityStateUnavailable'}
    post:
      tags: [Users]
      operationId: bindSecondIdentity
      summary: Bind the missing second identity type
      description: Requires the current password, current HttpOnly refresh cookie, a verified one-time challenge for the new normalized identity and the current identity revision. Success atomically adds the other identity type, increments revision and sessionVersion, upgrades the current Refresh Session to the new version, records a security audit and revokes all other devices. The response includes a replacement 15-minute Access Token because the caller's previous token is invalidated with every other device. Binding an already-present identity type is a 409 conflict.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/BindIdentityRequest'}}}
      responses:
        '200':
          description: Second identity bound and other devices revoked.
          content: {application/json: {schema: {$ref: '#/components/schemas/IdentityMutationResult'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/AccountConflict'}
        '422': {$ref: '#/components/responses/VerificationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/SecurityStateUnavailable'}
  /api/v1/users/me/identity-verification-challenges:
    post:
      tags: [Users]
      operationId: createIdentityVerificationChallenge
      summary: Send a one-time code for binding or replacing a verified identity
      description: Requires the current password and current identity revision before sending to the new normalized identity. The requested operation and identity type are bound into the Redis challenge so a bind challenge cannot be replayed for replacement or another target. SMTP/SMS failure leaves no consumable challenge and releases the delivery reservation for a bounded retry.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateIdentityVerificationChallengeRequest'}}}
      responses:
        '202':
          description: Challenge accepted for delivery.
          content: {application/json: {schema: {$ref: '#/components/schemas/VerificationChallenge'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/AccountConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/SecurityStateUnavailable'}
  /api/v1/users/me/identities/{identityType}:
    put:
      tags: [Users]
      operationId: replaceVerifiedIdentity
      summary: Atomically replace the verified identity of one type
      description: Requires current password, a verification challenge bound to REPLACE and the new identity, and the current revision. The new identity is verified before one MySQL transaction replaces the old row, increments revision/sessionVersion, revokes every Refresh Session and writes a security audit. The refresh cookie is cleared and the caller must log in again.
      parameters:
        - $ref: '#/components/parameters/IdentityTypePath'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ReplaceIdentityRequest'}}}
      responses:
        '200':
          description: Identity replaced and every device revoked.
          headers: {Set-Cookie: {$ref: '#/components/headers/ClearedRefreshCookie'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/IdentityMutationResult'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/AccountConflict'}
        '422': {$ref: '#/components/responses/VerificationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/SecurityStateUnavailable'}
    delete:
      tags: [Users]
      operationId: unbindVerifiedIdentity
      summary: Unbind one verified identity while preserving at least one
      description: Requires current password and the current identity revision. The last verified identity can never be removed. Success atomically deletes the selected identity, increments revision/sessionVersion, revokes every Refresh Session, writes a security audit and clears the refresh cookie so the caller must log in again.
      parameters:
        - $ref: '#/components/parameters/IdentityTypePath'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UnbindIdentityRequest'}}}
      responses:
        '200':
          description: Identity unbound and every device revoked.
          headers: {Set-Cookie: {$ref: '#/components/headers/ClearedRefreshCookie'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/IdentityMutationResult'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/AccountConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/SecurityStateUnavailable'}
  /api/v1/protocols/current:
    get:
      tags: [Protocols]
      operationId: listCurrentProtocolDocuments
      summary: Get the current user agreement and privacy policy
      description: Returns the current effective immutable TERMS and PRIVACY documents, including full body, effective time, current flag and whether existing users must consent again. Historical documents and agreements are never overwritten. Local/test documents explicitly state that they are development test versions and cannot be released to production.
      security: []
      responses:
        '200':
          description: Exactly one current TERMS and one current PRIVACY document.
          content: {application/json: {schema: {$ref: '#/components/schemas/CurrentProtocolDocuments'}}}
        '500': {$ref: '#/components/responses/InternalError'}
  /api/v1/teacher-applications:
    post:
      tags: [Teacher Applications]
      operationId: submitTeacherApplication
      summary: Submit or resubmit the current ordinary account's teacher application
      description: Validates that qualificationMediaId is the caller-owned READY TEACHER_QUALIFICATION asset before committing the application fact. A rejected application may be resubmitted with expectedRevision; T12D never approves, rejects, grants TEACHER, or adds teaching:access.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubmitTeacherApplicationRequest'}
      responses:
        '201': {description: First application submitted., content: {application/json: {schema: {$ref: '#/components/schemas/TeacherApplication'}}}}
        '200': {description: Rejected application resubmitted or identical request replayed., content: {application/json: {schema: {$ref: '#/components/schemas/TeacherApplication'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/AccountConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/MediaDependencyUnavailable'}
  /api/v1/teacher-applications/me:
    get:
      tags: [Teacher Applications]
      operationId: getMyTeacherApplication
      summary: Get the current account's teacher-application status fact
      description: Returns only the caller's own submission and current T16-owned review status. Qualification content requires a separate future domain-authorized media grant and is never projected here.
      responses:
        '200': {description: Current application., content: {application/json: {schema: {$ref: '#/components/schemas/TeacherApplication'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/AccountNotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/admin/users:
    get:
      tags: [Admin Users]
      operationId: listAdminUsers
      summary: Query accounts for administration
      description: Requires administration:access. Identity values are masked; password hashes, refresh-token hashes and verification secrets are never returned.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - {name: keyword, in: query, schema: {type: string, maxLength: 100}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/AccountStatus'}}
      responses:
        '200': {description: Account page., content: {application/json: {schema: {$ref: '#/components/schemas/AdminUserPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/admin/users/{userId}:
    get:
      tags: [Admin Users]
      operationId: getAdminUser
      summary: Get one account administration projection
      parameters: [{$ref: '#/components/parameters/UserId'}]
      responses:
        '200': {description: Account projection., content: {application/json: {schema: {$ref: '#/components/schemas/AdminUser'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AccountNotFound'}
  /api/v1/admin/users/{userId}/unlock:
    post:
      tags: [Admin Users]
      operationId: unlockAdminUser
      summary: Clear a short-term login lock and persist an audited unlock fact
      parameters: [{$ref: '#/components/parameters/UserId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AdminAccountCommandRequest'}}}}
      responses:
        '200': {description: Current account projection., content: {application/json: {schema: {$ref: '#/components/schemas/AdminAccountCommandResult'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/AccountNotFound'}
        '409': {$ref: '#/components/responses/AccountConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/SecurityStateUnavailable'}
  /api/v1/admin/users/{userId}/disable:
    post:
      tags: [Admin Users]
      operationId: disableAdminUser
      summary: Disable an account and invalidate every session
      description: The MySQL transaction changes status, increments sessionVersion, revokes Refresh Sessions and records the administrator reason. An administrator cannot disable the current account through this endpoint.
      parameters: [{$ref: '#/components/parameters/UserId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AdminAccountCommandRequest'}}}}
      responses:

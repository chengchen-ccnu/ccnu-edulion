            timestamp: '2026-08-01T10:00:00Z'
            path: /api/v1/media/uploads
            fieldErrors: []
    MediaDependencyUnavailable:
      description: OSS is unavailable for an operation that must complete synchronously. RabbitMQ outages do not use this response after media facts have committed; pending Outbox records are retried.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: MEDIA.STORAGE_UNAVAILABLE
            message: 媒体存储暂时不可用，请稍后重试
            traceId: 2f6c8c3b98f14a9c
            timestamp: '2026-08-01T10:00:00Z'
            path: /api/v1/media/uploads
            fieldErrors: []
    QuestionNotFound:
      description: The question, knowledge point or import task does not exist or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: QUESTION.NOT_FOUND
            message: 题目或任务不存在
            traceId: 2f6c8c3b98f14a9c
            timestamp: '2026-08-09T10:00:00Z'
            path: /api/v1/teacher/questions/0198f434-215d-7abc-9123-123456789abc
            fieldErrors: []
    QuestionConflict:
      description: The idempotency key, optimistic revision, lifecycle transition or stable knowledge-point code conflicts.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: QUESTION.REVISION_CONFLICT
            message: 题目已被更新，请刷新后重试
            traceId: 2f6c8c3b98f14a9c
            timestamp: '2026-08-09T10:00:00Z'
            path: /api/v1/teacher/questions/0198f434-215d-7abc-9123-123456789abc
            fieldErrors: []
    QuestionDependencyUnavailable:
      description: media-service or the short-lived source download is unavailable before the requested operation can safely proceed. Committed Outbox events remain retryable and do not use this response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: QUESTION.MEDIA_UNAVAILABLE
            message: 媒体服务暂时不可用，请稍后重试
            traceId: 2f6c8c3b98f14a9c
            timestamp: '2026-08-09T10:00:00Z'
            path: /api/v1/teacher/question-imports
            fieldErrors: []
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [account, password]
      properties:
        account:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
    LoginResponse:
      type: object
      additionalProperties: false
      required: [tokenType, accessToken, expiresIn]
      properties:
        tokenType:
          type: string
          const: Bearer
        accessToken:
          type: string
        expiresIn:
          type: integer
          minimum: 1
          description: Access token lifetime in seconds.
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, displayName, roles, permissions]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        avatarUrl:
          type: [string, 'null']
          format: uri
        roles:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/UserRole'
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
    UserRole:
      type: string
      enum: [STUDENT, TEACHER, ADMIN]
    CoursePage:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CourseSummary'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
          format: int64
    CourseSummary:
      type: object
      additionalProperties: false
      required: [id, title, summary, coverMediaId, coverUrl, teacher, category, level, accessType]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 120
        summary:
          type: string
          maxLength: 300
        coverMediaId:
          type: [string, 'null']
          format: uuid
          description: Stable COURSE_COVER media reference for the immutable published version; null only for legacy or intentionally unbound courses.
        coverUrl:
          type: [string, 'null']
          format: uri
          readOnly: true
          description: Read-only display projection. Historical external URLs may appear during migration; signed URLs are transient and must not be persisted.
        teacher:
          $ref: '#/components/schemas/TeacherSummary'
        category:
          $ref: '#/components/schemas/CategorySummary'
        level:
          $ref: '#/components/schemas/CourseLevel'
        accessType:
          $ref: '#/components/schemas/CourseAccessType'
    CourseDetail:
      type: object
      additionalProperties: false
      required: [id, title, summary, description, coverMediaId, coverUrl, teacher, category, level, accessType, publishedVersion, chapters]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 120
        summary:
          type: string
          maxLength: 300
        description:
          type: string
          description: Markdown course description.
        coverMediaId:
          type: [string, 'null']
          format: uuid
          description: Stable COURSE_COVER media reference frozen into this published course version.
        coverUrl:
          type: [string, 'null']
          format: uri
          readOnly: true
          description: Historical or authorized display projection; never a course write fact.
        teacher:
          $ref: '#/components/schemas/TeacherSummary'
        category:
          $ref: '#/components/schemas/CategorySummary'
        level:
          $ref: '#/components/schemas/CourseLevel'
        accessType:
          $ref: '#/components/schemas/CourseAccessType'
        publishedVersion:
          type: string
        chapters:
          type: array
          items:
            $ref: '#/components/schemas/Chapter'
    TeacherSummary:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 80
    CategorySummary:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 50
    CourseLevel:
      type: string
      enum: [BEGINNER, INTERMEDIATE, ADVANCED]
    CourseAccessType:
      type: string
      enum: [PUBLIC, ENROLLMENT_REQUIRED]
    CoursePublicationStatus:
      type: string
      enum: [DRAFT, PUBLISHED, UNPUBLISHED]
    Chapter:
      type: object
      additionalProperties: false
      required: [id, title, sequence, lessons]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 120
        sequence:
          type: integer
          minimum: 1
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/LessonSummary'
    LessonSummary:
      type: object
      additionalProperties: false
      required: [id, title, type, sequence, previewable, resources]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 120
        type:
          type: string
          enum: [VIDEO, ARTICLE, ASSESSMENT]
        sequence:
          type: integer
          minimum: 1
        previewable:
          type: boolean
        resources:
          type: array
          description: Stable media references frozen into the same course version. Signed playback/download URLs are obtained separately and are never stored here.
          items:
            $ref: '#/components/schemas/LessonMediaResource'
    CreateCourseRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId, title, summary, description, coverMediaId, instructorDisplayName, categoryId, level, accessType]
      properties:
        clientRequestId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 120
        summary:
          type: string
          maxLength: 300
        description:
          type: string
          maxLength: 20000
        coverMediaId:
          type: [string, 'null']
          format: uuid
          description: READY COURSE_COVER owned by the current teacher. Null creates a course without a cover; coverUrl is intentionally not accepted for writes.
        instructorDisplayName:
          type: string
          minLength: 1
          maxLength: 80
          description: Course byline content; ownership is always taken from the trusted authenticated user ID.
        categoryId:
          type: string
          format: uuid
        level:
          $ref: '#/components/schemas/CourseLevel'
        accessType:
          $ref: '#/components/schemas/CourseAccessType'
    UpdateCourseRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, title, summary, description, coverMediaId, instructorDisplayName, categoryId, level, accessType]
      properties:
        expectedRevision:
          type: integer
          minimum: 0
          format: int64
        title:
          type: string
          minLength: 1
          maxLength: 120
        summary:
          type: string
          maxLength: 300
        description:
          type: string
          maxLength: 20000
        coverMediaId:
          type: [string, 'null']
          format: uuid
          description: Replacement READY COURSE_COVER media ID. Null atomically releases the draft cover reference; historical coverUrl is not writable.
        instructorDisplayName:
          type: string
          minLength: 1
          maxLength: 80
        categoryId:
          type: string
          format: uuid
        level:
          $ref: '#/components/schemas/CourseLevel'
        accessType:
          $ref: '#/components/schemas/CourseAccessType'
    ReplaceCurriculumRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, chapters]
      properties:
        expectedRevision:
          type: integer
          minimum: 0
          format: int64
        chapters:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ChapterInput'
    ChapterInput:
      type: object
      additionalProperties: false
      required: [title, sequence, lessons]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        sequence:
          type: integer
          minimum: 1
        lessons:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/LessonInput'
    LessonInput:
      type: object
      additionalProperties: false
      required: [title, type, sequence, previewable]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        type:
          type: string
          enum: [VIDEO, ARTICLE, ASSESSMENT]
        sequence:
          type: integer
          minimum: 1
        previewable:
          type: boolean
        resources:
          type: array
          maxItems: 100
          default: []
          description: Stable media bindings for this lesson. Omission is equivalent to an empty list for T05 client compatibility.
          items:
            $ref: '#/components/schemas/LessonMediaResourceInput'
    LessonMediaPurpose:
      type: string
      description: Course-owned lesson purposes enabled by an explicit T08A upload and binding policy.
      enum: [LESSON_VIDEO, VIDEO_POSTER, SUBTITLE, COURSEWARE, ARTICLE_ATTACHMENT]
    LessonMediaResourceInput:
      type: object
      additionalProperties: false
      required: [mediaId, purpose, sequence]
      properties:
        mediaId:
          type: string
          format: uuid
          description: READY asset owned by the current teacher and validated by media-service before the course transaction commits.
        purpose:
          $ref: '#/components/schemas/LessonMediaPurpose'
        sequence:
          type: integer
          minimum: 1
          maximum: 100
          description: Ordering within the same purpose; values must be unique and contiguous from 1.
    LessonMediaResource:
      type: object
      additionalProperties: false
      required: [id, mediaId, purpose, sequence]
      properties:
        id:
          type: string
          format: uuid
          description: Course-domain reference row ID, not a media-service asset ID.
        mediaId:
          type: string
          format: uuid
        purpose:
          $ref: '#/components/schemas/LessonMediaPurpose'
        sequence:
          type: integer
          minimum: 1
    UpdatePublicationRequest:
      type: object
      additionalProperties: false
      required: [status, expectedRevision]
      properties:
        status:
          type: string
          enum: [PUBLISHED, UNPUBLISHED]
        expectedRevision:
          type: integer
          minimum: 0
          format: int64
    TeacherCourse:
      type: object
      additionalProperties: false
      required: [id, publicationStatus, hasUnpublishedChanges, version, revision, title, summary, description, coverMediaId, coverUrl, instructorDisplayName, category, level, accessType, chapters, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        publicationStatus:
          $ref: '#/components/schemas/CoursePublicationStatus'
        hasUnpublishedChanges:
          type: boolean
        publishedVersion:
          type: [string, 'null']
        draftVersion:
          type: [string, 'null']
        version:
          type: string
        revision:
          type: integer
          minimum: 0
          format: int64
        title:
          type: string
        summary:
          type: string
        description:
          type: string
        coverMediaId:
          type: [string, 'null']
          format: uuid
          description: Stable COURSE_COVER reference of the editable version.
        coverUrl:
          type: [string, 'null']
          format: uri
          readOnly: true
          description: Historical read compatibility or an authorized display projection; never accepted by create/update writes.
        instructorDisplayName:
          type: string
        category:
          $ref: '#/components/schemas/CategorySummary'
        level:
          $ref: '#/components/schemas/CourseLevel'
        accessType:
          $ref: '#/components/schemas/CourseAccessType'
        chapters:
          type: array
          items:
            $ref: '#/components/schemas/Chapter'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TeacherCoursePage:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TeacherCourse'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
          format: int64
    CoursePublication:
      type: object
      additionalProperties: false
      required: [id, status, hasUnpublishedChanges, revision, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/CoursePublicationStatus'
        publishedVersion:
          type: [string, 'null']
        draftVersion:
          type: [string, 'null']
        hasUnpublishedChanges:
          type: boolean
        revision:
          type: integer
          minimum: 0
          format: int64
        updatedAt:
          type: string
          format: date-time
    QuestionStage:
      type: string
      enum: [JUNIOR]
    QuestionGrade:
      type: string
      enum: [SEVEN, EIGHT, NINE]
    QuestionSubject:
      type: string
      enum: [MATHEMATICS]
    QuestionType:
      type: string
      enum: [SINGLE_CHOICE, MULTIPLE_CHOICE, TRUE_FALSE, FILL_BLANK, SHORT_ANSWER, COMPOSITE]
    QuestionInputType:
      type: string
      description: COMPOSITE is created only by the bounded T09A migration contract; T10 editing is not implemented.
      enum: [SINGLE_CHOICE, MULTIPLE_CHOICE, TRUE_FALSE, FILL_BLANK, SHORT_ANSWER]
    QuestionDifficulty:
      type: string
      enum: [EASY, MEDIUM, HARD]
    QuestionStatus:
      type: string
      enum: [DRAFT, ACTIVE, ARCHIVED]
    QuestionMediaPurpose:
      type: string
      enum: [QUESTION_IMAGE, QUESTION_AUDIO, QUESTION_ATTACHMENT]
    KnowledgePoint:
      type: object
      additionalProperties: false
      required: [id, code, name, parentId, stage, grade, subject, sortOrder, enabled, revision, children]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          pattern: '^JUNIOR_MATH_[A-Z0-9_]{2,50}$'
        name:
          type: string
          minLength: 1
          maxLength: 100
        parentId:
          type: [string, 'null']
          format: uuid
        stage:
          $ref: '#/components/schemas/QuestionStage'
        grade:
          $ref: '#/components/schemas/QuestionGrade'
        subject:
          $ref: '#/components/schemas/QuestionSubject'
        sortOrder:
          type: integer
          minimum: 0
          maximum: 100000
        enabled:
          type: boolean
        revision:
          type: integer
          format: int64
          minimum: 0
        children:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgePoint'
    CreateKnowledgePointRequest:
      type: object
      additionalProperties: false
      required: [code, name, parentId, stage, grade, subject, sortOrder, enabled]
      properties:
        code:
          type: string
          pattern: '^JUNIOR_MATH_[A-Z0-9_]{2,50}$'
        name:
          type: string
          minLength: 1
          maxLength: 100
        parentId:
          type: [string, 'null']
          format: uuid
        stage:
          $ref: '#/components/schemas/QuestionStage'
        grade:
          $ref: '#/components/schemas/QuestionGrade'
        subject:
          $ref: '#/components/schemas/QuestionSubject'
        sortOrder:
          type: integer
          minimum: 0
          maximum: 100000
        enabled:
          type: boolean
    UpdateKnowledgePointRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, name, parentId, grade, sortOrder, enabled]
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
        name:
          type: string
          minLength: 1
          maxLength: 100
        parentId:
          type: [string, 'null']
          format: uuid
        grade:
          $ref: '#/components/schemas/QuestionGrade'
        sortOrder:
          type: integer
          minimum: 0
          maximum: 100000
        enabled:
          type: boolean
    QuestionOptionInput:
      type: object
      additionalProperties: false
      required: [key, content]
      properties:
        key:
          type: string
          pattern: '^[A-H]$'
        content:
          type: string
          minLength: 1
          maxLength: 10000
          description: Markdown/LaTeX text. External or embedded image URLs are rejected; images use version media references.
    QuestionMediaInput:
      type: object
      additionalProperties: false
      required: [mediaId, purpose, sequence]
      properties:
        mediaId:
          type: string
          format: uuid
        purpose:
          $ref: '#/components/schemas/QuestionMediaPurpose'
        sequence:
          type: integer
          minimum: 1
          maximum: 100
    QuestionVersionInput:
      type: object
      additionalProperties: false
      required: [type, difficulty, stage, grade, subject, stem, options, answers, analysis, knowledgePointIds, media]
      properties:
        type:
          $ref: '#/components/schemas/QuestionInputType'
        difficulty:
          $ref: '#/components/schemas/QuestionDifficulty'
        stage:
          $ref: '#/components/schemas/QuestionStage'
        grade:
          $ref: '#/components/schemas/QuestionGrade'
        subject:
          $ref: '#/components/schemas/QuestionSubject'
        stem:
          type: string
          minLength: 1
          maxLength: 50000
          description: Markdown/LaTeX source; rendering is a frontend responsibility.
        options:
          type: array
          maxItems: 8
          description: Required for choice questions and empty for fill/short-answer questions. TRUE_FALSE uses no options.
          items:
            $ref: '#/components/schemas/QuestionOptionInput'
        answers:
          type: array
          minItems: 1
          maxItems: 20
          description: Canonical answer tokens or Markdown/LaTeX strings. This field is teacher-only in T09.
          items:
            type: string
            minLength: 1
            maxLength: 20000
        analysis:
          type: string
          maxLength: 50000
          description: Full teacher-only analysis; an empty string means no analysis supplied.
        knowledgePointIds:
          type: array
          uniqueItems: true
          maxItems: 30
          items:
            type: string
            format: uuid
        media:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/QuestionMediaInput'
    CreateQuestionRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId, version]
      properties:
        clientRequestId:
          type: string
          format: uuid
        version:
          $ref: '#/components/schemas/QuestionVersionInput'
    UpdateQuestionRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, version]
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
        version:
          $ref: '#/components/schemas/QuestionVersionInput'
    UpdateQuestionStatusRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, status]
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
        status:
          type: string
          enum: [ACTIVE, ARCHIVED]
    QuestionMedia:
      type: object
      additionalProperties: false
      required: [id, mediaId, purpose, sequence]
      properties:
        id:
          type: string
          format: uuid
          description: learning-service version-media row ID and the stable media referenceId.
        mediaId:
          type: string
          format: uuid
        purpose:
          $ref: '#/components/schemas/QuestionMediaPurpose'
        sequence:
          type: integer
          minimum: 1
    QuestionLegacySource:
      type: object
      additionalProperties: false
      required: [sourceSystem, externalId, originalDifficulty, pathEdition, jsonEdition, pathGrade, jsonGrade, metadataConflict]
      properties:
        sourceSystem: {type: string}
        externalId: {type: string}
        originalDifficulty: {type: [string, 'null']}
        pathEdition: {type: [string, 'null']}
        jsonEdition: {type: [string, 'null']}
        pathGrade: {type: [string, 'null']}
        jsonGrade: {type: [string, 'null']}
        metadataConflict:
          type: boolean
          description: Both values are retained; true means no value won automatically.
    QuestionChild:
      type: object
      additionalProperties: false
      required: [questionId, sequence, type, stem]
      properties:
        questionId: {type: string, format: uuid}
        sequence: {type: integer, minimum: 1, maximum: 100}
        type: {$ref: '#/components/schemas/QuestionType'}
        stem: {type: string}
    QuestionVersion:
      type: object
      additionalProperties: false
      required: [id, versionNumber, type, difficulty, stage, grade, subject, stem, options, answers, analysis, knowledgePoints, media, legacySource, children, createdAt]
      properties:
        id:
          type: string
          format: uuid
        versionNumber:
          type: integer
          minimum: 1
        type:
          $ref: '#/components/schemas/QuestionType'
        difficulty:
          $ref: '#/components/schemas/QuestionDifficulty'
        stage:
          $ref: '#/components/schemas/QuestionStage'
        grade:
          $ref: '#/components/schemas/QuestionGrade'
        subject:
          $ref: '#/components/schemas/QuestionSubject'
        stem:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/QuestionOptionInput'
        answers:
          type: array
          description: Teacher-only correct answer projection in T09; never reuse this schema for a student endpoint.
          items:
            type: string
        analysis:
          type: string
          description: Teacher-only full analysis projection.
        knowledgePoints:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgePoint'
        media:
          type: array
          items:
            $ref: '#/components/schemas/QuestionMedia'
        legacySource:
          oneOf:
            - $ref: '#/components/schemas/QuestionLegacySource'
            - type: 'null'
        children:
          type: array
          maxItems: 100
          description: Immutable ordered subquestion projection; empty for non-composite questions.
          items:
            $ref: '#/components/schemas/QuestionChild'
        createdAt:
          type: string
          format: date-time
    QuestionSummary:
      type: object
      additionalProperties: false
      required: [id, status, revision, currentVersionId, versionNumber, type, difficulty, grade, stemPreview, knowledgePointIds, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/QuestionStatus'
        revision:
          type: integer
          format: int64
          minimum: 0
        currentVersionId:
          type: string
          format: uuid
        versionNumber:
          type: integer
          minimum: 1
        type:
          $ref: '#/components/schemas/QuestionType'
        difficulty:
          $ref: '#/components/schemas/QuestionDifficulty'
        grade:
          $ref: '#/components/schemas/QuestionGrade'
        stemPreview:
          type: string
          maxLength: 240
        knowledgePointIds:
          type: array
          items:
            type: string
            format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TeacherQuestion:
      type: object
      additionalProperties: false
      required: [id, status, revision, currentVersion, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/QuestionStatus'
        revision:
          type: integer
          format: int64
          minimum: 0
        currentVersion:
          $ref: '#/components/schemas/QuestionVersion'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    QuestionPage:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/QuestionSummary'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          format: int64
          minimum: 0
    QuestionImportSourceFormat:
      type: string
      enum: [CSV, XLSX]
    QuestionImportStatus:
      type: string
      enum: [PENDING, PROCESSING, COMPLETED, PARTIAL_SUCCESS, FAILED, CLEANED]
    QuestionImportItemOutcome:
      type: string
      enum: [IMPORTED, VALID, NEEDS_REVIEW, SKIPPED, FAILED]
    CreateQuestionImportRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId, sourceMediaId, sourceFormat]
      properties:
        clientRequestId:
          type: string
          format: uuid
        sourceMediaId:
          type: string
          format: uuid
          description: READY QUESTION_IMPORT_SOURCE owned by the current teacher.
        sourceFormat:
          $ref: '#/components/schemas/QuestionImportSourceFormat'
    QuestionImportRowError:
      type: object
      additionalProperties: false
      required: [rowNumber, code, message]
      properties:
        rowNumber:
          type: integer
          minimum: 2
        code:
          type: string
          pattern: '^QUESTION_IMPORT\.[A-Z][A-Z0-9_]*$'
        message:
          type: string
          maxLength: 500
    QuestionImportTask:
      type: object
      additionalProperties: false
      required: [id, sourceMediaId, sourceFormat, sourceSystem, dryRun, status, progress, totalRows, processedRows, successCount, reviewCount, skippedCount, failureCount, errors, retainUntil, sourceReleasedAt, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        sourceMediaId:
          type: [string, 'null']
          format: uuid
        sourceFormat:
          oneOf:
            - $ref: '#/components/schemas/QuestionImportSourceFormat'
            - type: string
              const: LEGACY_JSON
        sourceSystem:
          type: [string, 'null']
          maxLength: 80
          description: Stable migration namespace; null for CSV/XLSX.
        dryRun:
          type: boolean
        status:
          $ref: '#/components/schemas/QuestionImportStatus'
        progress:
          type: integer
          minimum: 0
          maximum: 100
        totalRows:
          type: integer
          minimum: 0
        processedRows:
          type: integer
          minimum: 0
        successCount:
          type: integer
          minimum: 0
        reviewCount:
          type: integer
          minimum: 0
        skippedCount:
          type: integer
          minimum: 0
        failureCount:
          type: integer
          minimum: 0
        errors:
          type: array
          items:
            $ref: '#/components/schemas/QuestionImportRowError'
        failureCode:
          type: [string, 'null']
        failureMessage:
          type: [string, 'null']
        retainUntil:
          type: string
          format: date-time
          description: Earliest time the source reference may be released after a terminal result.
        sourceReleasedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateLegacyQuestionImportRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId, sourceSystem, sourceRootFingerprint, dryRun, maxItems]
      properties:
        clientRequestId: {type: string, format: uuid}
        sourceSystem:
          type: string
          pattern: '^[A-Z0-9][A-Z0-9_-]{2,79}$'
          description: Stable namespace such as LEGACY_RAWSTON_V3; it is not a filesystem path.
        sourceRootFingerprint:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: SHA-256 of the normalized read-only root label; the directory path is not stored.
        dryRun:
          type: boolean
        maxItems:
          type: integer
          minimum: 1
          maximum: 1000
          description: Hard task ceiling. Full-corpus migration is deliberately impossible through this contract.
    LegacyQuestionImportItem:
      type: object
      additionalProperties: false
      required: [externalId, relativePath, pathEdition, pathGrade, contentSha256, json]
      properties:
        externalId:
          type: string
          minLength: 1
          maxLength: 160
        relativePath:
          type: string
          minLength: 1
          maxLength: 500
          description: Normalized relative path only; absolute paths and `..` are rejected and only its hash is persisted.
        pathEdition: {type: string, minLength: 1, maxLength: 100}
        pathGrade: {type: string, minLength: 1, maxLength: 100}
        contentSha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: SHA-256 of the original UTF-8 file bytes; treated as an opaque source idempotency fingerprint.
        json:
          type: object
          description: One legacy per-question object. It is bounded to 256 KiB by the server and never echoed or logged.
          additionalProperties: true
    LegacyQuestionImportBatchRequest:
      type: object
      additionalProperties: false
      required: [batchId, finalBatch, items]
      properties:
        batchId: {type: string, format: uuid}
        finalBatch:
          type: boolean
          description: Marks the task terminal after this batch; later new batches are rejected.
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/LegacyQuestionImportItem'
    LegacyQuestionImportIssue:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [EMBEDDED_OPTIONS_AMBIGUOUS, IMPLICIT_MULTI_PART, SUBQUESTION_ANSWER_MISSING, PATH_JSON_METADATA_CONFLICT, SOURCE_CONTENT_CONFLICT, TYPE_UNSUPPORTED, FIELD_INVALID, HTML_UNSAFE, EXTERNAL_IMAGE_TRANSFER_FAILED]
        message: {type: string, maxLength: 300}
    LegacyQuestionImportItemResult:
      type: object
      additionalProperties: false
      required: [externalId, outcome, questionId, issueCodes]
      properties:
        externalId: {type: string, maxLength: 160}
        outcome: {$ref: '#/components/schemas/QuestionImportItemOutcome'}
        questionId: {type: [string, 'null'], format: uuid}
        issueCodes:
          type: array
          uniqueItems: true
          items: {type: string}
    LegacyQuestionImportBatchResult:
      type: object
      additionalProperties: false
      required: [importTaskId, batchId, replayed, finalBatch, processedCount, importedCount, validCount, reviewCount, skippedCount, failedCount, items]
      properties:
        importTaskId: {type: string, format: uuid}
        batchId: {type: string, format: uuid}
        replayed: {type: boolean}
        finalBatch: {type: boolean}
        processedCount: {type: integer, minimum: 0, maximum: 20}
        importedCount: {type: integer, minimum: 0, maximum: 20}
        validCount: {type: integer, minimum: 0, maximum: 20}
        reviewCount: {type: integer, minimum: 0, maximum: 20}
        skippedCount: {type: integer, minimum: 0, maximum: 20}
        failedCount: {type: integer, minimum: 0, maximum: 20}
        items:
          type: array
          maxItems: 20
          items: {$ref: '#/components/schemas/LegacyQuestionImportItemResult'}
    LegacyQuestionImportCleanupResult:
      type: object
      additionalProperties: false
      required: [importTaskId, questionsDeleted, sourceReferencesDeleted, mediaReferencesReleased, alreadyCleaned]
      properties:
        importTaskId: {type: string, format: uuid}
        questionsDeleted: {type: integer, minimum: 0}
        sourceReferencesDeleted: {type: integer, minimum: 0}
        mediaReferencesReleased: {type: integer, minimum: 0}
        alreadyCleaned: {type: boolean}
    QuestionImportPage:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/QuestionImportTask'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          format: int64
          minimum: 0
    ExternalImageTransferRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId, sourceUrl]
      properties:
        clientRequestId:
          type: string
          format: uuid
          description: Deterministically derived from sourceSystem/externalId/image index for safe retry.
        sourceUrl:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 2000
          description: Used only during this call; media-service must not persist or log it.
    MediaPurpose:
      type: string
      description: Stable business purpose. T08A enables the six course purposes; T09 additionally enables QUESTION_IMAGE, QUESTION_AUDIO, QUESTION_ATTACHMENT and QUESTION_IMPORT_SOURCE through reviewed teacher-only policies. Other frozen values remain disabled until their owning domain supplies policy and authorization.
      enum: [COURSE_COVER, LESSON_VIDEO, VIDEO_POSTER, SUBTITLE, COURSEWARE, ARTICLE_ATTACHMENT, QUESTION_IMAGE, QUESTION_AUDIO, QUESTION_ATTACHMENT, QUESTION_IMPORT_SOURCE, AI_QUESTION_IMAGE, USER_AVATAR, TEACHER_QUALIFICATION, BANNER_IMAGE, TOPIC_COVER, REPORT_EXPORT]
    MediaUploadMode:
      type: string
      enum: [SINGLE_PUT, MULTIPART]
    MediaUploadStatus:
      type: string
      enum: [CREATED, UPLOADING, UPLOADED, VERIFYING, PROCESSING, READY, REJECTED, FAILED, EXPIRED, CANCELED]
    MediaAssetStatus:
      type: string
      enum: [UPLOADED, VERIFYING, PROCESSING, READY, REJECTED, FAILED, EXPIRED, DELETING, DELETED]
    MediaProcessingStatus:
      type: string
      enum: [PENDING, RUNNING, SUCCEEDED, FAILED, CANCELED]
    CreateMediaUploadRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId, purpose, fileName, size, mimeType, sha256]
      properties:
        clientRequestId:
          type: string
          format: uuid
        purpose:
          $ref: '#/components/schemas/MediaPurpose'
        fileName:
          type: string
          minLength: 1
          maxLength: 255
          description: Original display name only. It is never used as the OSS object key.
        size:
          type: integer
          format: int64
          minimum: 1
        mimeType:
          type: string
          minLength: 3
          maxLength: 127
        sha256:
          type: string
          pattern: '^[a-fA-F0-9]{64}$'
    AuthorizeMediaPartRequest:
      type: object
      additionalProperties: false
      required: [partNumber, contentLength]
      properties:
        partNumber:
          type: integer
          minimum: 1
          maximum: 10000
        contentLength:
          type: integer
          format: int64
          minimum: 1
        contentMd5:
          type: [string, 'null']
          pattern: '^[A-Za-z0-9+/]{22}==$'
    CompleteMediaUploadRequest:
      type: object
      additionalProperties: false
      required: [sha256, parts]
      properties:
        sha256:
          type: string
          pattern: '^[a-fA-F0-9]{64}$'
        parts:
          type: array
          maxItems: 10000
          description: Empty for SINGLE_PUT. Required, unique and ascending for MULTIPART.
          items:
            $ref: '#/components/schemas/CompletedMediaPart'
    CompletedMediaPart:
      type: object
      additionalProperties: false
      required: [partNumber, etag]
      properties:
        partNumber:
          type: integer
          minimum: 1
          maximum: 10000
        etag:
          type: string
          minLength: 1
          maxLength: 128
    MediaUploadGrant:
      type: object
      additionalProperties: false
      required: [method, url, headers, expiresAt]
      properties:
        method:
          type: string
          const: PUT
        url:
          type: string
          format: uri
          description: Short-lived bearer URL. Never persist or log it.
        headers:
          type: object
          additionalProperties:
            type: string
          description: Exact headers that must accompany the direct OSS request.
        expiresAt:
          type: string
          format: date-time
    MediaMultipartUpload:
      type: object
      additionalProperties: false
      required: [partSize, maxParts, uploadedParts]
      properties:
        partSize:
          type: integer
          format: int64
          minimum: 5242880
        maxParts:
          type: integer
          minimum: 1
          maximum: 10000
        uploadedParts:
          type: array
          items:
            $ref: '#/components/schemas/UploadedMediaPart'
    UploadedMediaPart:
      type: object
      additionalProperties: false
      required: [partNumber, etag, size]
      properties:
        partNumber:
          type: integer
        etag:
          type: string
        size:
          type: integer
          format: int64
    MediaUploadSession:
      type: object
      additionalProperties: false
      required: [uploadId, clientRequestId, purpose, mode, status, fileName, size, mimeType, sha256, expiresAt, createdAt]
      properties:
        uploadId:
          type: string
          format: uuid
        clientRequestId:
          type: string
          format: uuid
        purpose:
          $ref: '#/components/schemas/MediaPurpose'
        mode:
          $ref: '#/components/schemas/MediaUploadMode'
        status:
          $ref: '#/components/schemas/MediaUploadStatus'
        fileName:
          type: string
        size:
          type: integer
          format: int64
        mimeType:
          type: string
        sha256:
          type: string
        uploadGrant:
          oneOf:
            - $ref: '#/components/schemas/MediaUploadGrant'
            - type: 'null'
        multipart:
          oneOf:
            - $ref: '#/components/schemas/MediaMultipartUpload'
            - type: 'null'
        mediaId:
          type: [string, 'null']
          format: uuid
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    MediaVariant:
      type: object
      additionalProperties: false
      required: [variant, mimeType, size]
      properties:
        variant:
          type: string
          maxLength: 80
          example: baseline-mp4-v1
        mimeType:
          type: string
        size:
          type: integer
          format: int64
          minimum: 0
        componentCount:
          type: integer
          minimum: 0
          description: Number of private HLS segment components; zero for a single-object variant.
    MediaAsset:
      type: object
      additionalProperties: false
      required: [mediaId, purpose, status, processingStatus, originalFileName, mimeType, size, sha256, variants, createdAt, updatedAt]
      properties:
        mediaId:
          type: string
          format: uuid
        purpose:
          $ref: '#/components/schemas/MediaPurpose'
        status:
          $ref: '#/components/schemas/MediaAssetStatus'
        processingStatus:
          $ref: '#/components/schemas/MediaProcessingStatus'
        originalFileName:
          type: string
        mimeType:
          type: string
        size:
          type: integer
          format: int64
        sha256:
          type: string
        variants:
          type: array
          items:
            $ref: '#/components/schemas/MediaVariant'
        errorCode:
          type: [string, 'null']
        errorMessage:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MediaAssetPage:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MediaAsset'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          format: int64
          minimum: 0
    CreateMediaAccessGrantRequest:
      type: object
      additionalProperties: false
      required: [variant, disposition]
      properties:
        variant:
          type: string
          maxLength: 80
          description: Use `ORIGINAL` for the verified private source object or a listed variant name. HLS playlist variants return a signed temporary rewritten playlist whose segment URLs share the same expiry.
        disposition:
          type: string
          enum: [INLINE, ATTACHMENT]
    MediaAccessGrant:
      type: object
      additionalProperties: false
      required: [method, url, headers, expiresAt]
      properties:
        method:
          type: string
          const: GET
        url:
          type: string
          format: uri
          description: Short-lived bearer URL. Never persist or log it.
        headers:
          type: object
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
    CourseMediaPlaybackGrant:
      type: object
      additionalProperties: false
      required: [method, url, headers, expiresAt]
      description: Short-lived playback projection returned by course-service after domain authorization. It contains no Bucket, Object Key, permanent URL or service credential.
      properties:
        method:
          type: string
          const: GET
        url:
          type: string
          format: uri
          description: Expiring OSS URL for an HLS temporary playlist. Playlist segment URLs expire at the same time; never persist or log this value.
        headers:
          type: object
          additionalProperties:
            type: string
          description: Headers required by the authorized GET request; currently empty for OSS signed URLs.
        expiresAt:
          type: string
          format: date-time
    MediaBindingValidationRequest:
      type: object
      additionalProperties: false
      required: [purpose]
      properties:
        purpose:
          $ref: '#/components/schemas/MediaPurpose'
    MediaBindingValidation:
      type: object
      additionalProperties: false
      required: [mediaId, purpose, status, bindable]
      properties:
        mediaId:
          type: string
          format: uuid
        purpose:
          $ref: '#/components/schemas/MediaPurpose'
        status:
          type: string
          const: READY
        bindable:
          type: boolean
          const: true
          description: True only after media-service has verified owner, exact purpose and READY state for this request.
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, traceId, timestamp, path, fieldErrors]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*\.[A-Z][A-Z0-9_]*$'
          example: COMMON.VALIDATION_FAILED
        message:
          type: string
        traceId:
          type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      additionalProperties: false
      required: [field, reason]
      properties:
        field:
          type: string
        reason:
          type: string
security:
  - bearerAuth: []

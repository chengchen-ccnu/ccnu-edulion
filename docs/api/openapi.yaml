        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCourseResourceAccessGrantRequest'}
      responses:
        '201': {description: Short-lived resource read grant., content: {application/json: {schema: {$ref: '#/components/schemas/CourseMediaAccessGrant'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/CoursePlaybackForbidden'}

openapi: 3.1.0
info:
  title: EDU Platform Gateway API
  version: 0.9.0
  description: T09A Gateway contract. Retains T09 CSV/XLSX imports and adds bounded, idempotent legacy per-question JSON migration, composite-question projections, review issues and media-service-owned external image transfer. No T10 page or T11 attempt/grading API is exposed.
servers:
  - url: http://localhost:8080
    description: Local Gateway
  - url: http://127.0.0.1:4010
    description: OpenAPI mock
tags:
  - name: Authentication
  - name: Users
  - name: Courses
  - name: Teacher Courses
  - name: Media
  - name: Teacher Questions
  - name: Question Imports
  - name: Knowledge Points
paths:
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Log in with a platform account
      description: Validates credentials with account/IP rate limiting, records a login audit, returns a short-lived access token and sets a rotating HttpOnly refresh cookie. Failed credentials never reveal whether the account exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              student:
                value:
                  account: student_test_01
                  password: example-password
      responses:
        '200':
          description: Login succeeded
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                success:
                  value:
                    tokenType: Bearer
                    accessToken: mock-access-token
                    expiresIn: 900
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshAccessToken
      summary: Rotate the refresh session and issue a new access token
      description: The current refresh token is read only from the HttpOnly cookie. A successful call invalidates it and sets a replacement cookie.
      security:
        - refreshCookie: []
      responses:
        '200':
          description: Refresh succeeded and the refresh cookie was rotated.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/RefreshConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current refresh session and clear its cookie
      description: Missing or previously revoked refresh cookies are treated as idempotent success; the response always expires the browser cookie.
      security: []
      responses:
        '204':
          description: The session is revoked or was already absent. The refresh cookie is cleared.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Set-Cookie:
              $ref: '#/components/headers/ClearedRefreshCookie'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: Get the authenticated user summary
      description: Re-reads the active IAM account, roles and permissions for the JWT subject so frontends can restore current authorization without trusting persisted browser profile data.
      responses:
        '200':
          description: Current user
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
              examples:
                student:
                  value:
                    id: 0195d9c2-1c3f-7b6e-a9dd-7367730a6171
                    displayName: 示例学生
                    avatarUrl: https://cdn.example.test/avatars/student.png
                    roles: [STUDENT]
                    permissions: [learning:access]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/courses:
    get:
      tags: [Courses]
      operationId: listCourses
      summary: List published courses
      description: Returns only the current public version of published courses. Draft and unpublished versions are never projected, and all filters are optional.
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: keyword
          in: query
          schema:
            type: string
            maxLength: 100
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: level
          in: query
          schema:
            $ref: '#/components/schemas/CourseLevel'
        - name: accessType
          in: query
          schema:
            $ref: '#/components/schemas/CourseAccessType'
      responses:
        '200':
          description: Paged course summaries
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursePage'
              examples:
                firstPage:
                  value:
                    items:
                      - id: 0195d9c2-1c3f-7b6e-a9dd-7367730a6201
                        title: 七年级代数基础
                        summary: 从有理数到一元一次方程
                        coverMediaId: null
                        coverUrl: https://cdn.example.test/courses/algebra-cover.jpg
                        teacher:
                          id: 0195d9c2-1c3f-7b6e-a9dd-7367730a6101
                          displayName: 王老师
                        category:
                          id: 0195d9c2-1c3f-7b6e-a9dd-7367730a6301
                          name: 初中数学
                        level: BEGINNER
                        accessType: PUBLIC
                    page: 1
                    size: 20
                    total: 1
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/courses/categories:
    get:
      tags: [Courses]
      operationId: listCourseCategories
      summary: List active course categories
      security: []
      responses:
        '200':
          description: Active categories ordered by name and identifier
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategorySummary'
              examples:
                active:
                  value:
                    - id: 0195d9c2-1c3f-7b6e-a9dd-7367730a6301
                      name: 初中数学
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/courses/{courseId}:
    get:
      tags: [Courses]
      operationId: getCourse
      summary: Get a published course detail
      description: Returns the immutable public version and ordered curriculum. Missing, draft and unpublished courses share the same not-found response to avoid leaking private course existence.
      security: []
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Course detail
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'
              examples:
                algebra:
                  value:
                    id: 0195d9c2-1c3f-7b6e-a9dd-7367730a6201
                    title: 七年级代数基础
                    summary: 从有理数到一元一次方程
                    description: "## 课程介绍\n循序渐进掌握代数基础。"
                    coverMediaId: null
                    coverUrl: https://cdn.example.test/courses/algebra-cover.jpg
                    teacher:
                      id: 0195d9c2-1c3f-7b6e-a9dd-7367730a6101
                      displayName: 王老师
                    category:
                      id: 0195d9c2-1c3f-7b6e-a9dd-7367730a6301
                      name: 初中数学
                    level: BEGINNER
                    accessType: PUBLIC
                    publishedVersion: v1
                    chapters:
                      - id: 0195d9c2-1c3f-7b6e-a9dd-7367730a6401
                        title: 有理数
                        sequence: 1
                        lessons:
                          - id: 0195d9c2-1c3f-7b6e-a9dd-7367730a6501
                            title: 正数与负数
                            type: VIDEO
                            sequence: 1
                            previewable: true
                            resources: []
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/courses/{courseId}/lessons/{lessonId}/resources/{resourceId}/playback-grants:
    post:
      tags: [Courses]
      operationId: createCourseLessonPlaybackGrant
      summary: Authorize playback of one published lesson video resource
      description: |
        Course-service resolves the resource from the current immutable published version and derives its media ID and purpose server-side. An authenticated visitor may play a PUBLIC course or a previewable lesson. Until T11 supplies enrollment facts, a non-preview lesson in an ENROLLMENT_REQUIRED course returns `COURSE.ENROLLMENT_REQUIRED`. Missing, draft, archived, historical-version and mismatched resources share the same not-found response. The returned OSS/HLS URL is short-lived and must not be persisted or logged.
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/LessonId'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '201':
          description: Short-lived playback grant for the bound READY LESSON_VIDEO resource.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseMediaPlaybackGrant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CoursePlaybackForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MediaConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/MediaDependencyUnavailable'
  /api/v1/teacher/courses:
    get:
      tags: [Teacher Courses]
      operationId: listTeacherCourses
      summary: List courses owned by the current teacher
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Paged teacher course editor snapshots ordered by most recently updated
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherCoursePage'
              examples:
                firstPage:
                  value:
                    items:
                      - id: 0195d9c2-1c3f-7b6e-a9dd-7367730a6201
                        publicationStatus: DRAFT
                        hasUnpublishedChanges: true
                        publishedVersion: null
                        draftVersion: v1
                        version: v1
                        revision: 0
                        title: 七年级代数基础
                        summary: 从有理数到一元一次方程
                        description: "## 课程介绍\n循序渐进掌握代数基础。"
                        coverMediaId: null
                        coverUrl: https://cdn.example.test/courses/algebra-cover.jpg
                        instructorDisplayName: 王老师
                        category:
                          id: 0195d9c2-1c3f-7b6e-a9dd-7367730a6301
                          name: 初中数学
                        level: BEGINNER
                        accessType: PUBLIC
                        chapters: []
                        createdAt: '2026-08-01T00:00:00Z'
                        updatedAt: '2026-08-01T00:00:00Z'
                    page: 1
                    size: 20
                    total: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Teacher Courses]
      operationId: createTeacherCourse
      summary: Create an idempotent course draft owned by the current teacher
      description: Repeating the same `clientRequestId` for the same teacher returns the originally created course.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourseRequest'
      responses:
        '201':
          description: Course draft created
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Location:
              schema:
                type: string
                example: /api/v1/teacher/courses/0195d9c2-1c3f-7b6e-a9dd-7367730a6201
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherCourse'
        '200':
          description: Existing course returned for a repeated `clientRequestId`
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherCourse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/teacher/courses/{courseId}:
    get:
      tags: [Teacher Courses]
      operationId: getTeacherCourse
      summary: Get the current teacher-owned course editor snapshot
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Current draft when present, otherwise the latest published version
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherCourse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Teacher Courses]
      operationId: updateTeacherCourse
      summary: Replace editable course metadata
      description: Editing a course without a draft copies the immutable published version into a new draft first. Repeating an identical request body is a no-op.
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCourseRequest'
      responses:
        '200':
          description: Updated editor snapshot
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherCourse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/teacher/courses/{courseId}/curriculum:
    put:
      tags: [Teacher Courses]
      operationId: replaceTeacherCourseCurriculum
      summary: Replace the complete editable chapter and lesson ordering
      description: Repeating an identical curriculum body is a no-op and preserves the current chapter and lesson identifiers.
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceCurriculumRequest'
      responses:
        '200':
          description: Updated editor snapshot
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherCourse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/teacher/courses/{courseId}/publication:
    put:
      tags: [Teacher Courses]
      operationId: updateTeacherCoursePublication
      summary: Publish the current draft or unpublish the current live course
      description: Publishing archives the previous published version without modifying it. Repeating the same target status is idempotent.
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePublicationRequest'
      responses:
        '200':
          description: Current publication state
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursePublication'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/teacher/courses/{courseId}/lessons/{lessonId}/resources/{resourceId}/playback-grants:
    post:
      tags: [Teacher Courses]
      operationId: createTeacherCourseLessonPlaybackGrant
      summary: Preview one lesson video resource owned by the current teacher
      description: |
        Resolves the current editable version (the draft when present, otherwise the published version) and permits preview only when the authenticated TEACHER owns the course. The browser cannot submit a media ID, purpose, visibility decision or service credential. Other owners, stale resource IDs and non-video resources are indistinguishable from missing resources.
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/LessonId'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '201':
          description: Short-lived owner preview grant for the bound READY LESSON_VIDEO resource.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseMediaPlaybackGrant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MediaConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/MediaDependencyUnavailable'
  /api/v1/teacher/knowledge-points:
    get:
      tags: [Knowledge Points]
      operationId: listTeacherKnowledgePoints
      summary: List the enabled junior-mathematics knowledge-point tree
      description: Teachers can query and bind enabled knowledge points but cannot maintain them. Results are ordered by parent, sortOrder and code.
      parameters:
        - name: grade
          in: query
          schema:
            $ref: '#/components/schemas/QuestionGrade'
        - name: parentId
          in: query
          description: Omit for the complete tree; use the literal root UUID only when querying one branch.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Enabled knowledge points visible to teachers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgePoint'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/admin/knowledge-points:
    post:
      tags: [Knowledge Points]
      operationId: createKnowledgePoint
      summary: Create one administrator-maintained knowledge point
      description: Requires the trusted `administration:access` permission. Parent relationships remain inside learning-service and never reference another service schema.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKnowledgePointRequest'
      responses:
        '201':
          description: Knowledge point created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgePoint'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/QuestionConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/admin/knowledge-points/{knowledgePointId}:
    put:
      tags: [Knowledge Points]
      operationId: updateKnowledgePoint
      summary: Update mutable knowledge-point metadata with optimistic locking
      description: Requires `administration:access`. Stable ID and code are immutable; disabling a node does not rewrite historical question versions.
      parameters:
        - $ref: '#/components/parameters/KnowledgePointId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateKnowledgePointRequest'
      responses:
        '200':
          description: Updated knowledge point.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgePoint'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/QuestionNotFound'
        '409':
          $ref: '#/components/responses/QuestionConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/teacher/questions:
    get:
      tags: [Teacher Questions]
      operationId: listTeacherQuestions
      summary: List questions owned by the current teacher
      description: Answers and full analyses are intentionally absent from list projections. Filters apply to the current immutable version only.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: keyword
          in: query
          schema:
            type: string
            maxLength: 100
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/QuestionType'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/QuestionStatus'
        - name: difficulty
          in: query
          schema:
            $ref: '#/components/schemas/QuestionDifficulty'
        - name: knowledgePointId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Paged owner-only question summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [Teacher Questions]
      operationId: createTeacherQuestion
      summary: Idempotently create a teacher-owned draft question
      description: Replaying the same `clientRequestId` and body returns the original aggregate; a different body conflicts. Media assets are validated for owner, exact purpose and READY state before the local transaction commits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuestionRequest'
      responses:
        '201':
          description: Draft question and immutable version 1 created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherQuestion'
        '200':
          description: Original question returned for an identical idempotent replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherQuestion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/QuestionConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/QuestionDependencyUnavailable'
  /api/v1/teacher/questions/{questionId}:
    get:
      tags: [Teacher Questions]
      operationId: getTeacherQuestion
      summary: Get the current immutable version of an owned question
      parameters:
        - $ref: '#/components/parameters/QuestionId'
      responses:
        '200':
          description: Owner editor projection including the answer and analysis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherQuestion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/QuestionNotFound'
    put:
      tags: [Teacher Questions]
      operationId: updateTeacherQuestion
      summary: Create a new immutable version of an owned question
      description: Never overwrites a historical version. `expectedRevision` guards the aggregate pointer; historical media references remain retained so old snapshots cannot lose assets.
      parameters:
        - $ref: '#/components/parameters/QuestionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQuestionRequest'
      responses:
        '200':
          description: Aggregate now points at the newly inserted immutable version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherQuestion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/QuestionNotFound'
        '409':
          $ref: '#/components/responses/QuestionConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/QuestionDependencyUnavailable'
  /api/v1/teacher/questions/{questionId}/status:
    put:
      tags: [Teacher Questions]
      operationId: updateTeacherQuestionStatus
      summary: Activate or archive an owned question
      description: DRAFT may become ACTIVE; ACTIVE or DRAFT may become ARCHIVED. Archived questions are retained for historical consumers and cannot be edited or reactivated in T09.
      parameters:
        - $ref: '#/components/parameters/QuestionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQuestionStatusRequest'
      responses:
        '200':
          description: Updated aggregate lifecycle state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherQuestion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/QuestionNotFound'
        '409':
          $ref: '#/components/responses/QuestionConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/teacher/question-imports:
    get:
      tags: [Question Imports]
      operationId: listQuestionImports
      summary: List asynchronous import tasks owned by the current teacher
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Paged import task summaries ordered by creation time descending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionImportPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Question Imports]
      operationId: createQuestionImport
      summary: Create an idempotent CSV or XLSX import task
      description: The source must be the current teacher's READY `QUESTION_IMPORT_SOURCE`. The task retains a media reference until the configured post-completion retention deadline and then releases it asynchronously.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuestionImportRequest'
      responses:
        '202':
          description: Import task and local Outbox event committed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionImportTask'
        '200':
          description: Original task returned for an identical idempotent replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionImportTask'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/QuestionConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/QuestionDependencyUnavailable'
  /api/v1/teacher/question-imports/{importTaskId}:
    get:
      tags: [Question Imports]
      operationId: getQuestionImport
      summary: Get one owned import task and its row errors
      description: Row errors identify the row, stable code and safe message; rejected source content is never echoed in bulk.
      parameters:
        - $ref: '#/components/parameters/ImportTaskId'
      responses:
        '200':
          description: Import progress, totals and complete row-error list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionImportTask'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/QuestionNotFound'
  /api/v1/teacher/legacy-question-imports:
    post:
      tags: [Question Imports]
      operationId: createLegacyQuestionImport
      summary: Create an explicitly bounded legacy JSON migration task
      description: |
        The caller must stream a read-only directory through bounded batch requests. `dryRun` defaults
        to true in migration tooling; the API never scans a server path. Creating a task does not import
        any item and does not authorize full migration of the historical corpus.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLegacyQuestionImportRequest'
      responses:
        '201':
          description: Empty legacy migration task created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionImportTask'
        '200':
          description: Identical task replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionImportTask'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/QuestionConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/v1/teacher/legacy-question-imports/{importTaskId}/batches:
    post:
      tags: [Question Imports]
      operationId: submitLegacyQuestionImportBatch
      summary: Submit one idempotent legacy JSON batch of at most 20 items
      description: |
        Each item is parsed independently. The response contains only stable source keys, outcomes and
        issue codes; it never echoes question text, answers or raw JSON. Dry-run performs no media transfer
        and creates no question. A duplicate batchId returns its original aggregate result.
      parameters:
        - $ref: '#/components/parameters/ImportTaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegacyQuestionImportBatchRequest'
      responses:
        '200':
          description: Bounded batch processed or safely replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyQuestionImportBatchResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/QuestionNotFound'
        '409':
          $ref: '#/components/responses/QuestionConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/QuestionDependencyUnavailable'
  /api/v1/teacher/legacy-question-imports/{importTaskId}/created-resources:
    delete:
      tags: [Question Imports]
      operationId: cleanupLegacyQuestionImport
      summary: Precisely clean resources created by one non-dry-run acceptance task
      description: Only DRAFT questions still owned by the caller and linked to this exact task are removed; media references are released through Outbox. The historical source directory and unrelated questions are never touched.
      parameters:
        - $ref: '#/components/parameters/ImportTaskId'
      responses:
        '200':
          description: Exact cleanup counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyQuestionImportCleanupResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/QuestionNotFound'
  /api/v1/media/external-image-transfers:
    post:
      tags: [Media]
      operationId: transferExternalQuestionImage
      summary: Idempotently transfer one allow-listed HTTPS question image into media-service
      description: |
        Teacher-only T09A compatibility endpoint. media-service validates the HTTPS host before and after
        redirects, blocks private/link-local destinations, enforces image MIME and size limits, stores the
        object through its own storage port and returns only a stable mediaId. The source URL is neither
        persisted nor logged. Dry-run callers must not invoke this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalImageTransferRequest'
      responses:
        '201':
          description: Image transferred and READY asset created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
        '200':
          description: Identical transfer replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/MediaConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/MediaDependencyUnavailable'
  /api/v1/media/uploads:
    post:
      tags: [Media]
      operationId: createMediaUpload
      summary: Create or replay an upload session
      description: |
        The authenticated caller declares the intended media purpose and immutable file metadata. The service validates role, purpose, extension, MIME, size and quota, then generates an unguessable private OSS object key. Reusing the same `clientRequestId` with the same request fingerprint returns the original session; changing any immutable field returns `MEDIA.IDEMPOTENCY_CONFLICT`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMediaUploadRequest'
      responses:
        '201':
          description: Upload session created.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Location:
              schema:
                type: string
                example: /api/v1/media/uploads/0198f434-215d-7abc-9123-123456789abc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadSession'
        '200':
          description: Existing session returned for an identical `clientRequestId` replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/MediaConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/MediaDependencyUnavailable'
  /api/v1/media/uploads/{uploadId}:
    get:
      tags: [Media]
      operationId: getMediaUpload
      summary: Get an owned upload session and resumable part state
      description: Ownership is derived from the authenticated Gateway identity. A session owned by another user is indistinguishable from a missing session.
      parameters:
        - $ref: '#/components/parameters/UploadId'
      responses:
        '200':
          description: Current upload session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MediaNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [Media]
      operationId: cancelMediaUpload
      summary: Idempotently cancel an unfinished upload session
      description: Cancels the exact recorded single-object upload or multipart provider upload. Terminal sessions are returned unchanged and no bucket listing or broad deletion is performed.
      parameters:
        - $ref: '#/components/parameters/UploadId'
      responses:
        '204':
          description: The unfinished session is canceled, or was already canceled.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MediaNotFound'
        '409':
          $ref: '#/components/responses/MediaConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/MediaDependencyUnavailable'
  /api/v1/media/uploads/{uploadId}/parts/authorize:
    post:
      tags: [Media]
      operationId: authorizeMediaUploadPart
      summary: Create a short-lived URL for one multipart part
      description: Repeating the same part number and declared length is idempotent. The URL is bound to the server-side object key and provider upload ID; neither is a business identifier.
      parameters:
        - $ref: '#/components/parameters/UploadId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizeMediaPartRequest'
      responses:
        '200':
          description: Short-lived part upload grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadGrant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MediaNotFound'
        '409':
          $ref: '#/components/responses/MediaConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/MediaDependencyUnavailable'
  /api/v1/media/uploads/{uploadId}/complete:
    post:
      tags: [Media]
      operationId: completeMediaUpload
      summary: Complete, verify and enqueue an uploaded object
      description: |
        For multipart sessions, parts must be unique and ordered by `partNumber`. The service completes the provider upload, performs an OSS HEAD check for object existence, length and MIME, and records the asset plus Outbox event in one local transaction. An identical replay returns the same asset; conflicting completion data returns `MEDIA.IDEMPOTENCY_CONFLICT`. Processing continues asynchronously and may remain pending while RabbitMQ is unavailable.
      parameters:
        - $ref: '#/components/parameters/UploadId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteMediaUploadRequest'
      responses:
        '202':
          description: Object verified and asynchronous processing accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
        '200':
          description: Existing asset returned for an identical completion replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MediaNotFound'
        '409':
          $ref: '#/components/responses/MediaConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/MediaDependencyUnavailable'
  /api/v1/media:
    get:
      tags: [Media]
      operationId: listMedia
      summary: List media assets owned by the authenticated caller
      description: Results are ordered by `createdAt` descending and then `mediaId` descending. Pagination is one-based and stable for a fixed dataset.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: purpose
          in: query
          schema:
            $ref: '#/components/schemas/MediaPurpose'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/MediaAssetStatus'
      responses:
        '200':
          description: Paged owned assets; no OSS key or signed URL is included.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAssetPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/media/{mediaId}:
    get:
      tags: [Media]
      operationId: getMedia
      summary: Get owned media metadata and processing status
      description: Returns stable media metadata and processing state only for the uploader. It does not grant domain visibility and never exposes an object key or signed URL.
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: Media metadata without storage credentials or a signed URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MediaNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/media/{mediaId}/access-grants:
    post:
      tags: [Media]
      operationId: createMediaAccessGrant
      summary: Issue a short-lived, object-level read grant
      description: The uploader may preview an owned READY asset. HLS grants point to an expiring rewritten playlist whose segment URLs expire with the grant. The client cannot assert course, question, AI-session or review visibility, and signed URLs must never be persisted.
      parameters:
        - $ref: '#/components/parameters/MediaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMediaAccessGrantRequest'
      responses:
        '201':
          description: Short-lived private read grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAccessGrant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/MediaNotFound'
        '409':
          $ref: '#/components/responses/MediaConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/MediaDependencyUnavailable'
  /api/v1/media/{mediaId}/binding-validations:
    post:
      tags: [Media]
      operationId: validateMediaBinding
      summary: Validate that an owned media asset can be bound by a domain service
      description: Validates uploader ownership, exact purpose and READY state without exposing storage metadata. Course-service calls this versioned contract before committing a local media reference; a successful validation does not itself create the reference.
      parameters:
        - $ref: '#/components/parameters/MediaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaBindingValidationRequest'
      responses:
        '200':
          description: The asset exists, belongs to the authenticated caller, matches the requested purpose and is READY.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaBindingValidation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MediaNotFound'
        '409':
          $ref: '#/components/responses/MediaConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: EDU_REFRESH
  headers:
    TraceId:
      description: Correlation identifier propagated through Gateway and services.
      schema:
        type: string
    RefreshCookie:
      description: Rotating opaque refresh token. HttpOnly, SameSite=Strict, Path=/api/v1/auth and Secure outside local development.
      schema:
        type: string
        example: EDU_REFRESH=opaque-token; Max-Age=604800; Path=/api/v1/auth; HttpOnly; SameSite=Strict; Secure
    ClearedRefreshCookie:
      description: Expired refresh cookie returned by logout.
      schema:
        type: string
        example: EDU_REFRESH=; Max-Age=0; Path=/api/v1/auth; HttpOnly; SameSite=Strict; Secure
  parameters:
    Page:
      name: page
      in: query
      description: One-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LessonId:
      name: lessonId
      in: path
      required: true
      description: Course-domain lesson ID; it must belong to the version selected by the authorization endpoint.
      schema:
        type: string
        format: uuid
    ResourceId:
      name: resourceId
      in: path
      required: true
      description: Course-domain lesson media reference ID. The client never substitutes a media-service asset ID here.
      schema:
        type: string
        format: uuid
    UploadId:
      name: uploadId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MediaId:
      name: mediaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuestionId:
      name: questionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    KnowledgePointId:
      name: knowledgePointId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ImportTaskId:
      name: importTaskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: IAM.UNAUTHORIZED
            message: 请先登录或重新登录
            traceId: 2f6c8c3b98f14a9c
            timestamp: '2026-07-16T10:00:00Z'
            path: /api/v1/users/me
            fieldErrors: []
    Forbidden:
      description: The authenticated user cannot access the resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: IAM.FORBIDDEN
            message: 无权访问该资源
            traceId: 2f6c8c3b98f14a9c
            timestamp: '2026-07-16T10:00:00Z'
            path: /api/v1/users/me
            fieldErrors: []
    CoursePlaybackForbidden:
      description: The published course exists, but T11 enrollment/learning permission is required for this non-preview lesson.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: COURSE.ENROLLMENT_REQUIRED
            message: 该课时需要报名后观看
            traceId: 2f6c8c3b98f14a9c
            timestamp: '2026-08-05T10:00:00Z'
            path: /api/v1/courses/0195d9c2-1c3f-7b6e-a9dd-7367730a6201/lessons/0195d9c2-1c3f-7b6e-a9dd-7367730a6501/resources/0195d9c2-1c3f-7b6e-a9dd-7367730a6601/playback-grants
            fieldErrors: []
    RefreshConflict:
      description: The refresh token was already rotated or revoked. The whole token family is revoked and the user must log in again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: IAM.REFRESH_REUSED
            message: 登录会话已失效，请重新登录
            traceId: 2f6c8c3b98f14a9c
            timestamp: '2026-07-16T10:00:00Z'
            path: /api/v1/auth/refresh
            fieldErrors: []
    NotFound:
      description: The requested resource does not exist or is not visible.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: COURSE.NOT_FOUND
            message: 课程不存在或不可见
            traceId: 2f6c8c3b98f14a9c
            timestamp: '2026-07-16T10:00:00Z'
            path: /api/v1/courses/0195d9c2-1c3f-7b6e-a9dd-7367730a6201
            fieldErrors: []
    ValidationFailed:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: COMMON.VALIDATION_FAILED
            message: 请求参数不合法
            traceId: 2f6c8c3b98f14a9c
            timestamp: '2026-07-16T10:00:00Z'
            path: /api/v1/auth/login
            fieldErrors:
              - field: account
                reason: 账号不能为空
    VersionConflict:
      description: The editable course revision changed since it was read.
      content:
        application/json:

      required: [questionVersionId, sequence, points]
      properties:
        questionVersionId: {type: string, format: uuid}
        sequence: {type: integer, minimum: 1, maximum: 500}
        points: {type: number, minimum: 0.01, maximum: 1000, multipleOf: 0.01}
    ReplaceAssessmentQuestionsRequest:

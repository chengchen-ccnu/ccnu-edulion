          type: string
          format: uri
          pattern: '^https://'
          maxLength: 2000
          description: Used only during this call; media-service must not persist or log it.
        scope:
          $ref: '#/components/schemas/MediaAssetScope'
    CreateAssessmentMediaAccessGrantRequest:
      type: object
      additionalProperties: false
      required: [variant, disposition]
      properties:
        variant:
          type: string
          const: ORIGINAL
          description: T11A assessment question media uses the frozen original READY asset; the browser cannot select an arbitrary derived variant.
        disposition:
          type: string
          enum: [INLINE, ATTACHMENT]
          description: QUESTION_IMAGE and QUESTION_AUDIO require INLINE; QUESTION_ATTACHMENT requires ATTACHMENT. The service derives and validates the exact purpose from the assessment snapshot.
    MediaPurpose:
      type: string
      description: Stable business purpose. ARTICLE_IMAGE and AI_QUESTION_IMAGE accept JPG/JPEG, PNG or WebP single-object uploads up to 10 MiB; SVG and GIF are rejected. AI_QUESTION_IMAGE requires learning:access and becomes USER_PRIVATE. Existing SUBTITLE policy remains enabled, but no subtitle access/UI is added.
      enum: [COURSE_COVER, LESSON_VIDEO, VIDEO_POSTER, SUBTITLE, COURSEWARE, ARTICLE_ATTACHMENT, ARTICLE_IMAGE, QUESTION_IMAGE, QUESTION_AUDIO, QUESTION_ATTACHMENT, QUESTION_IMPORT_SOURCE, AI_QUESTION_IMAGE, USER_AVATAR, TEACHER_QUALIFICATION, BANNER_IMAGE, TOPIC_COVER, REPORT_EXPORT]
    MediaUploadMode:
      type: string
      enum: [SINGLE_PUT, MULTIPART]
    MediaUploadStatus:
      type: string
      enum: [CREATED, UPLOADING, UPLOADED, VERIFYING, PROCESSING, READY, REJECTED, FAILED, EXPIRED, CANCELED]
    MediaAssetStatus:
      type: string
      enum: [UPLOADED, VERIFYING, PROCESSING, READY, REJECTED, FAILED, EXPIRED, DELETING, DELETED]
    MediaProcessingStatus:
      type: string
      enum: [PENDING, RUNNING, SUCCEEDED, FAILED, CANCELED]
    MediaAssetScope:
      type: string
      description: SYSTEM assets are authorized platform assets. TEACHER assets are teacher business assets. USER_PRIVATE assets belong to an ordinary authenticated user. TEACHER and USER_PRIVATE remain owner-only outside an authorized domain grant.
      enum: [SYSTEM, TEACHER, USER_PRIVATE]
    CreateMediaUploadRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId, purpose, fileName, size, mimeType, sha256]
      properties:
        clientRequestId:
          type: string
          format: uuid
        purpose:
          $ref: '#/components/schemas/MediaPurpose'
        fileName:
          type: string
          minLength: 1
          maxLength: 255
          description: Original display name only. It is never used as the OSS object key.
        size:
          type: integer
          format: int64
          minimum: 1
        mimeType:
          type: string
          minLength: 3
          maxLength: 127
        sha256:
          type: string
          pattern: '^[a-fA-F0-9]{64}$'
    AuthorizeMediaPartRequest:
      type: object
      additionalProperties: false
      required: [partNumber, contentLength]
      properties:
        partNumber:
          type: integer
          minimum: 1
          maximum: 10000
        contentLength:
          type: integer
          format: int64
          minimum: 1
        contentMd5:
          type: [string, 'null']
          pattern: '^[A-Za-z0-9+/]{22}==$'
    CompleteMediaUploadRequest:
      type: object
      additionalProperties: false
      required: [sha256, parts]
      properties:
        sha256:
          type: string
          pattern: '^[a-fA-F0-9]{64}$'
        parts:
          type: array
          maxItems: 10000
          description: Empty for SINGLE_PUT. Required, unique and ascending for MULTIPART.
          items:
            $ref: '#/components/schemas/CompletedMediaPart'
    CompletedMediaPart:
      type: object
      additionalProperties: false
      required: [partNumber, etag]
      properties:
        partNumber:
          type: integer
          minimum: 1
          maximum: 10000
        etag:
          type: string
          minLength: 1
          maxLength: 128
    MediaUploadGrant:
      type: object
      additionalProperties: false
      required: [method, url, headers, expiresAt]
      properties:
        method:
          type: string
          const: PUT
        url:
          type: string
          format: uri
          description: Short-lived bearer URL. Never persist or log it.
        headers:
          type: object
          additionalProperties:
            type: string
          description: Exact headers that must accompany the direct OSS request.
        expiresAt:
          type: string
          format: date-time
    MediaMultipartUpload:
      type: object
      additionalProperties: false
      required: [partSize, maxParts, uploadedParts]
      properties:
        partSize:
          type: integer
          format: int64
          minimum: 5242880
        maxParts:
          type: integer
          minimum: 1
          maximum: 10000
        uploadedParts:
          type: array
          items:
            $ref: '#/components/schemas/UploadedMediaPart'
    UploadedMediaPart:
      type: object
      additionalProperties: false
      required: [partNumber, etag, size]
      properties:
        partNumber:
          type: integer
        etag:
          type: string
        size:
          type: integer
          format: int64
    MediaUploadSession:
      type: object
      additionalProperties: false
      required: [uploadId, clientRequestId, purpose, mode, status, fileName, size, mimeType, sha256, expiresAt, createdAt]
      properties:
        uploadId:
          type: string
          format: uuid
        clientRequestId:
          type: string
          format: uuid
        purpose:
          $ref: '#/components/schemas/MediaPurpose'
        mode:
          $ref: '#/components/schemas/MediaUploadMode'
        status:
          $ref: '#/components/schemas/MediaUploadStatus'
        fileName:
          type: string
        size:
          type: integer
          format: int64
        mimeType:
          type: string
        sha256:
          type: string
        uploadGrant:
          oneOf:
            - $ref: '#/components/schemas/MediaUploadGrant'
            - type: 'null'
        multipart:
          oneOf:
            - $ref: '#/components/schemas/MediaMultipartUpload'
            - type: 'null'
        mediaId:
          type: [string, 'null']
          format: uuid
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    MediaVariant:
      type: object
      additionalProperties: false
      required: [variant, mimeType, size]
      properties:
        variant:
          type: string
          maxLength: 80
          example: baseline-mp4-v1
        mimeType:
          type: string
        size:
          type: integer
          format: int64
          minimum: 0
        componentCount:
          type: integer
          minimum: 0
          description: Number of private HLS segment components; zero for a single-object variant.
    MediaAsset:
      type: object
      additionalProperties: false
      required: [mediaId, scope, purpose, status, processingStatus, originalFileName, mimeType, size, sha256, variants, createdAt, updatedAt]
      properties:
        mediaId:
          type: string
          format: uuid
        scope:
          $ref: '#/components/schemas/MediaAssetScope'
        purpose:
          $ref: '#/components/schemas/MediaPurpose'
        status:
          $ref: '#/components/schemas/MediaAssetStatus'
        processingStatus:
          $ref: '#/components/schemas/MediaProcessingStatus'
        originalFileName:
          type: string
        mimeType:
          type: string
        size:
          type: integer
          format: int64
        sha256:
          type: string
        variants:
          type: array
          items:
            $ref: '#/components/schemas/MediaVariant'
        processingContractVersion:
          type: [string, 'null']
          description: New LESSON_VIDEO uploads use LESSON_VIDEO_V5 and cannot become READY until hls-fmp4-v2 and poster-v1 both succeed. Null identifies historical assets and does not trigger reprocessing.
        errorCode:
          type: [string, 'null']
        errorMessage:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MediaAssetPage:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MediaAsset'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          format: int64
          minimum: 0
    CreateMediaAccessGrantRequest:
      type: object
      additionalProperties: false
      required: [variant, disposition]
      properties:
        variant:
          type: string
          maxLength: 80
          description: Use `ORIGINAL` for the verified private source object or a listed variant name. HLS playlist variants return a signed temporary rewritten playlist whose segment URLs share the same expiry.
        disposition:
          type: string
          enum: [INLINE, ATTACHMENT]
    MediaAccessGrant:
      type: object
      additionalProperties: false
      required: [mediaId, mimeType, sizeBytes, method, url, headers, expiresAt]
      properties:
        mediaId: {type: string, format: uuid}
        mimeType: {type: string, minLength: 3, maxLength: 127}
        sizeBytes: {type: integer, format: int64, minimum: 1}
        method:
          type: string
          const: GET
        url:
          type: string
          format: uri
          description: Short-lived bearer URL. Never persist or log it.
        headers:
          type: object
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
    CourseMediaPlaybackGrant:
      type: object
      additionalProperties: false
      required: [mediaId, mimeType, sizeBytes, method, url, headers, expiresAt]
      description: Short-lived playback projection returned by course-service after domain authorization. It contains no Bucket, Object Key, permanent URL or service credential.
      properties:
        mediaId: {type: string, format: uuid}
        mimeType: {type: string, minLength: 3, maxLength: 127}
        sizeBytes: {type: integer, format: int64, minimum: 1}
        method:
          type: string
          const: GET
        url:
          type: string
          format: uri
          description: Expiring OSS URL for an HLS temporary playlist. Playlist segment URLs expire at the same time; never persist or log this value.
        headers:
          type: object
          additionalProperties:
            type: string
          description: Headers required by the authorized GET request; currently empty for OSS signed URLs.
        expiresAt:
          type: string
          format: date-time
    CourseMediaAccessGrant:
      type: object
      additionalProperties: false
      required: [mediaId, mimeType, sizeBytes, method, url, headers, expiresAt]
      description: Short-lived course-authorized poster, inline image, preview or download projection. It contains no Bucket, Object Key, permanent URL, media-service credential or service JWT.
      properties:
        mediaId: {type: string, format: uuid}
        mimeType: {type: string, minLength: 3, maxLength: 127}
        sizeBytes: {type: integer, format: int64, minimum: 1}
        method: {type: string, const: GET}
        url:
          type: string
          format: uri
          description: Expiring bearer URL. Never persist or log it.
        headers:
          type: object
          additionalProperties: {type: string}
        expiresAt: {type: string, format: date-time}
    MediaBindingValidationRequest:
      type: object
      additionalProperties: false
      required: [purpose]
      properties:
        purpose:
          $ref: '#/components/schemas/MediaPurpose'
    MediaBindingValidation:
      type: object
      additionalProperties: false
      required: [mediaId, purpose, status, bindable, originalFileName, mimeType, size, variants]
      properties:
        mediaId:
          type: string
          format: uuid
        purpose:
          $ref: '#/components/schemas/MediaPurpose'
        status:
          type: string
          const: READY
        bindable:
          type: boolean
          const: true
          description: True only after media-service has verified owner, exact purpose and READY state for this request.
        originalFileName:
          type: string
          minLength: 1
          maxLength: 255
          description: Safe original filename for the course-service immutable binding snapshot.
        mimeType:
          type: string
          minLength: 3
          maxLength: 127
        size:
          type: integer
          format: int64
          minimum: 1
        variants:
          type: array
          uniqueItems: true
          items: {type: string, maxLength: 80}
          description: Safe derived-variant names only; no Object Key, Bucket or URL is returned.
        processingContractVersion:
          type: [string, 'null']
          description: LESSON_VIDEO_V5 for newly uploaded videos that require both hls-fmp4-v2 and poster-v1; null for historical assets.
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, traceId, timestamp, path, fieldErrors]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*\.[A-Z][A-Z0-9_]*$'
          example: COMMON.VALIDATION_FAILED
        message:
          type: string
        traceId:
          type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      additionalProperties: false
      required: [field, reason]
      properties:
        field:
          type: string
          description: Safe dotted request-field path when the server can locate the failure (for example, version.type); request is the fallback for malformed bodies without a reliable field path.
        reason:
          type: string
security:
  - bearerAuth: []

      summary: Authorize playback of one published lesson video resource
      description: |
        Course-service resolves the resource from the current immutable published version and derives its media ID and purpose server-side. An authenticated visitor may play a PUBLIC course, a previewable lesson, or a non-preview ENROLLMENT_REQUIRED lesson when the local reliable enrollment projection is ACTIVE. Canceled or absent enrollment returns `COURSE.ENROLLMENT_REQUIRED`. Missing, draft, archived, historical-version and mismatched resources share the same not-found response. The returned OSS/HLS URL is short-lived and must not be persisted or logged.
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/LessonId'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '201':
          description: Short-lived playback grant for the bound READY LESSON_VIDEO resource.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseMediaPlaybackGrant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':

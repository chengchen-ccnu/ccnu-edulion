    PublishAssessmentResultRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId, expectedRevision]
      properties:
        clientRequestId: {type: string, format: uuid}
        expectedRevision: {type: integer, format: int64, minimum: 0}
    AssessmentSummary:
      type: object
      additionalProperties: false
      required: [id, courseId, lessonId, title, type, status, closeStatus, settlementStatus, gradePublicationPolicy, answerPublicationPolicy, gradePublicationStatus, answerPublicationStatus, closedAt, affectedInProgressAttemptCount, activeAttemptCount, pendingSettlementCount, pendingManualGradingAttemptCount, pendingManualGradingAnswerCount, gradePublishedAt, answerPublishedAt, gradePublicationEligible, answerPublicationEligible, resultsReady, opensAt, closesAt, latePolicy, lateUntil, maxAttempts, timeLimitSeconds, questionCount, totalPoints, revision, publishedAt, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        courseId:
          type: [string, 'null']
          format: uuid
          description: Null only for an owner-bound autonomous PRACTICE; course task and teacher APIs never return autonomous assessments.
        lessonId: {type: [string, 'null'], format: uuid}
        title: {type: string}
        type: {$ref: '#/components/schemas/AssessmentType'}
        status: {$ref: '#/components/schemas/AssessmentStatus'}
        closeStatus: {$ref: '#/components/schemas/AssessmentCloseStatus'}
        settlementStatus: {$ref: '#/components/schemas/AssessmentSettlementStatus'}
        gradePublicationPolicy: {$ref: '#/components/schemas/GradePublicationPolicy'}
        answerPublicationPolicy: {$ref: '#/components/schemas/AnswerPublicationPolicy'}
        gradePublicationStatus: {$ref: '#/components/schemas/ResultPublicationStatus'}
        answerPublicationStatus: {$ref: '#/components/schemas/ResultPublicationStatus'}
        closedAt: {type: [string, 'null'], format: date-time}
        affectedInProgressAttemptCount: {type: integer, minimum: 0, description: Frozen number of DRAFT attempts observed by the irreversible close transaction.}
        activeAttemptCount: {type: integer, minimum: 0, description: Current DRAFT attempts; before closure this supports the high-risk confirmation preview.}
        pendingSettlementCount: {type: integer, minimum: 0}
        pendingManualGradingAttemptCount: {type: integer, minimum: 0}
        pendingManualGradingAnswerCount: {type: integer, minimum: 0}

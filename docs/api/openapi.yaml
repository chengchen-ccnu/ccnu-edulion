        - $ref: '#/components/parameters/QuestionId'
        - $ref: '#/components/parameters/MediaId'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateAssessmentMediaAccessGrantRequest'}}}
      responses:
        '201': {description: Short-lived authorized content asset., content: {application/json: {schema: {$ref: '#/components/schemas/MediaAccessGrant'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/QuestionNotFound'}
        '409': {$ref: '#/components/responses/LearningConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/MediaDependencyUnavailable'}

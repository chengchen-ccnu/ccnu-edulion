    ReportLessonProgressRequest:
      type: object
      additionalProperties: false
      required: [clientEventId, occurredAt, positionSeconds, watchedSeconds, completed]
      properties:
        clientEventId: {type: string, format: uuid}
        occurredAt: {type: string, format: date-time}
        positionSeconds: {type: integer, format: int64, minimum: 0, maximum: 28800}
        watchedSeconds: {type: integer, minimum: 0, maximum: 300}
        completed: {type: boolean}
        eventType:
          allOf: [{$ref: '#/components/schemas/ProgressEventType'}]
          description: Optional for legacy clients. When present, HEARTBEAT is buffered and the four checkpoint types persist directly to MySQL.
    ProgressEventType:
      type: string
      enum: [HEARTBEAT, PAUSE, LESSON_SWITCH, LEAVE, ENDED]
      description: Explicit playback lifecycle event; the server never infers it from request intervals.
    ProgressPersistenceStatus:
      type: string
      enum: [BUFFERED, PERSISTED, PERSISTED_ONLY]
      description: BUFFERED is accepted in Redis, PERSISTED is in MySQL, and PERSISTED_ONLY means the student read degraded to MySQL because Redis was unavailable.
    CompleteArticleLessonRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId]
      properties:
        clientRequestId:
          type: string
          format: uuid
          description: Stable for one logical successfully rendered ARTICLE completion attempt; all bounded retries reuse it.
    ArticleLessonCompletion:
      type: object
      additionalProperties: false
      required: [courseId, lessonId, completionPercent, completedAt, revision, replayed]
      properties:
        courseId: {type: string, format: uuid}
        lessonId: {type: string, format: uuid}
        completionPercent:
          type: integer
          const: 100
          description: ARTICLE completion is a monotonic 0-to-100 fact and cannot be moved backwards by ordinary clients.
        completedAt: {type: string, format: date-time}
        revision: {type: integer, format: int64, minimum: 1}
        replayed: {type: boolean}
    LessonProgress:
      type: object
      additionalProperties: false
      required: [courseId, lessonId, positionSeconds, watchedSeconds, completed, lastEventAt, revision, replayed, persistenceStatus]
      properties:
        courseId: {type: string, format: uuid}
        lessonId: {type: string, format: uuid}
        positionSeconds: {type: integer, format: int64, minimum: 0}
        watchedSeconds: {type: integer, format: int64, minimum: 0}
        completed: {type: boolean}
        lastEventAt: {type: string, format: date-time}
        revision: {type: integer, format: int64, minimum: 0}
        replayed: {type: boolean}
        persistenceStatus: {$ref: '#/components/schemas/ProgressPersistenceStatus'}
    CourseProgress:
      type: object
      additionalProperties: false
      required: [courseId, completedLessonCount, lessonCount, completionPercent, lessons]
      properties:
        courseId: {type: string, format: uuid}
        completedLessonCount: {type: integer, minimum: 0}
        lessonCount: {type: integer, minimum: 0}
        completionPercent: {type: number, format: double, minimum: 0, maximum: 100}
        lessons: {type: array, items: {$ref: '#/components/schemas/LessonProgress'}}
    CreateLearningNoteRequest:
      type: object
      additionalProperties: false
      required: [content, positionSeconds]
      properties:
        content: {type: string, minLength: 1, maxLength: 10000}
        positionSeconds: {type: [integer, 'null'], format: int64, minimum: 0, maximum: 28800}
    UpdateLearningNoteRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, content, positionSeconds]
      properties:
        expectedRevision: {type: integer, format: int64, minimum: 0}
        content: {type: string, minLength: 1, maxLength: 10000}
        positionSeconds: {type: [integer, 'null'], format: int64, minimum: 0, maximum: 28800}
    LearningNote:
      type: object
      additionalProperties: false
      required: [id, courseId, lessonId, content, positionSeconds, revision, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        courseId: {type: string, format: uuid}
        lessonId: {type: string, format: uuid}
        content: {type: string}
        positionSeconds: {type: [integer, 'null'], format: int64}
        revision: {type: integer, format: int64, minimum: 0}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    AssessmentType:
      type: string
      enum: [PRACTICE, HOMEWORK, EXAM]
    HomeworkLatePolicy:
      type: string
      description: HOMEWORK only. DISALLOW closes at closesAt; ALLOW_UNTIL records late submissions without an automatic score penalty and closes at lateUntil.
      enum: [DISALLOW, ALLOW_UNTIL]
    AssessmentTimeState:
      type: string
      enum: [NOT_OPEN, OPEN, LATE_WINDOW, CLOSED]
    AssessmentSubmissionStatus:
      type: string
      enum: [NOT_STARTED, IN_PROGRESS, SUBMITTED, MISSING, WITHDRAWN]
    AssessmentGradingStatus:
      type: string
      enum: [NOT_REQUIRED, PENDING, PARTIALLY_GRADED, GRADED]
    GradebookAggregateStatus:
      type: string
      enum: [READY, PENDING]
    GradebookSortField:
      type: string
      enum: [STUDENT_NUMBER, LAST_SUBMITTED_AT, SCORE, SUBMISSION_STATUS, GRADING_STATUS]
    AssessmentStatus:
      type: string
      enum: [DRAFT, PUBLISHED, ARCHIVED]
    AssessmentCloseStatus:
      type: string
      enum: [OPEN, CLOSED]
    AssessmentSettlementStatus:
      type: string
      description: FAILED means the finite automatic retries were exhausted; the persisted assessment and drafts remain recoverable and are never treated as ready.
      enum: [NOT_STARTED, PENDING, PROCESSING, COMPLETED, FAILED]
    GradePublicationPolicy:
      type: string
      enum: [AUTOMATIC_AFTER_GRADING, MANUAL]
    ResultPublicationStatus:
      type: string
      enum: [UNPUBLISHED, PUBLISHED]
    AnswerPublicationPolicy:
      type: string
      description: AFTER_SUBMISSION is valid only for PRACTICE. AFTER_GRADED is a deprecated compatibility alias for the safe whole-assessment AFTER_ASSESSMENT_GRADED policy; neither form discloses HOMEWORK or EXAM answers before closure. MANUAL_AFTER_CLOSE requires an explicit teacher command. NEVER cannot be manually overridden.
      enum: [AFTER_SUBMISSION, AFTER_GRADED, AFTER_ASSESSMENT_GRADED, MANUAL_AFTER_CLOSE, NEVER]
    AttemptStatus:
      type: string
      enum: [DRAFT, SUBMITTED, PARTIALLY_GRADED, GRADED]
    LearnerAssessmentState:
      type: string
      description: Safe participation state derived from the service clock, assessment window and the current learner's single immutable attempt.
      enum: [NOT_OPEN, AVAILABLE, IN_PROGRESS, SUBMITTED, PARTIALLY_GRADED, GRADED, CLOSED]
    CreateAssessmentRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId, courseId, lessonId, title, description, type, gradePublicationPolicy, answerPublicationPolicy, opensAt, closesAt, timeLimitSeconds]
      properties:
        clientRequestId: {type: string, format: uuid}
        courseId: {type: string, format: uuid}
        lessonId: {type: [string, 'null'], format: uuid}
        title: {type: string, minLength: 1, maxLength: 160}
        description: {type: string, maxLength: 5000}
        type: {$ref: '#/components/schemas/AssessmentType'}
        gradePublicationPolicy: {$ref: '#/components/schemas/GradePublicationPolicy'}
        answerPublicationPolicy: {$ref: '#/components/schemas/AnswerPublicationPolicy'}
        opensAt:
          type: [string, 'null']
          format: date-time
          description: HOMEWORK may omit this and then opens immediately after publication; EXAM keeps its existing server-enforced open-time rule; PRACTICE must omit it.
        closesAt:
          type: [string, 'null']
          format: date-time
          description: Required for HOMEWORK and must be later than opensAt when both are present; EXAM keeps its existing close-time rule; PRACTICE must omit it.
        latePolicy: {$ref: '#/components/schemas/HomeworkLatePolicy'}
        lateUntil:
          type: [string, 'null']
          format: date-time
          description: Required at least one hour after closesAt for ALLOW_UNTIL; null for DISALLOW and non-HOMEWORK.
        maxAttempts:
          type: integer
          minimum: 1
          maximum: 5
          description: HOMEWORK formal submission limit. Omitted values default to 1. Draft creation and autosave do not consume this count; EXAM and PRACTICE use one.
        timeLimitSeconds:
          type: [integer, 'null']
          minimum: 60
          maximum: 28800
          description: EXAM duration in seconds. The effective deadline is frozen by the server at attempt start and cannot exceed closesAt; HOMEWORK and PRACTICE must omit it.
    UpdateAssessmentRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, title, description, type, gradePublicationPolicy, answerPublicationPolicy, opensAt, closesAt, timeLimitSeconds]
      properties:
        expectedRevision: {type: integer, format: int64, minimum: 0}
        title: {type: string, minLength: 1, maxLength: 160}
        description: {type: string, maxLength: 5000}
        type: {$ref: '#/components/schemas/AssessmentType'}
        gradePublicationPolicy: {$ref: '#/components/schemas/GradePublicationPolicy'}
        answerPublicationPolicy: {$ref: '#/components/schemas/AnswerPublicationPolicy'}
        opensAt: {type: [string, 'null'], format: date-time}
        closesAt: {type: [string, 'null'], format: date-time}
        latePolicy: {$ref: '#/components/schemas/HomeworkLatePolicy'}
        lateUntil: {type: [string, 'null'], format: date-time}
        maxAttempts: {type: integer, minimum: 1, maximum: 5, description: Omitted values default to 1.}
        timeLimitSeconds: {type: [integer, 'null'], minimum: 60, maximum: 28800}
    UpdateAssessmentDeadlineRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, closesAt, lateUntil, reason]
      properties:
        expectedRevision: {type: integer, format: int64, minimum: 0}
        closesAt: {type: string, format: date-time}
        lateUntil: {type: [string, 'null'], format: date-time}
        reason: {type: string, minLength: 1, maxLength: 500}
    AssessmentQuestionInput:
      type: object

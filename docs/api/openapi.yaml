openapi: 3.1.0
info:
  title: EDU Platform Gateway API
  version: 0.13.1
  description: T10B Gateway contract. Adds SYSTEM/TEACHER question scope, administrator-owned bounded legacy migration, public system-question reads, SYSTEM media assets and stable inline question-image markers. No T11 attempt/grading API is exposed.
servers:
  - url: http://localhost:8080
    description: Local Gateway
  - url: http://127.0.0.1:4010
    description: OpenAPI mock
tags:
  - name: Authentication
  - name: Users
  - name: Courses
  - name: Teacher Courses
  - name: Media
  - name: Teacher Questions
  - name: System Questions
  - name: Question Imports
  - name: Knowledge Points
paths:
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Log in with a platform account
      description: Validates credentials with account/IP rate limiting, records a login audit, returns a short-lived access token and sets a rotating HttpOnly refresh cookie. Failed credentials never reveal whether the account exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              student:
                value:
                  account: student_test_01
                  password: example-password
      responses:
        '200':
          description: Login succeeded
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                success:
                  value:
                    tokenType: Bearer
                    accessToken: mock-access-token
                    expiresIn: 900
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshAccessToken
      summary: Rotate the refresh session and issue a new access token
      description: The current refresh token is read only from the HttpOnly cookie. A successful call invalidates it and sets a replacement cookie.
      security:
        - refreshCookie: []
      responses:
        '200':
          description: Refresh succeeded and the refresh cookie was rotated.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/RefreshConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current refresh session and clear its cookie
      description: Missing or previously revoked refresh cookies are treated as idempotent success; the response always expires the browser cookie.
      security: []
      responses:
        '204':
          description: The session is revoked or was already absent. The refresh cookie is cleared.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Set-Cookie:
              $ref: '#/components/headers/ClearedRefreshCookie'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: Get the authenticated user summary
      description: Re-reads the active IAM account, roles and permissions for the JWT subject so frontends can restore current authorization without trusting persisted browser profile data.
      responses:
        '200':
          description: Current user
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
              examples:
                student:
                  value:
                    id: 0195d9c2-1c3f-7b6e-a9dd-7367730a6171
                    displayName: 示例学生
                    avatarUrl: https://cdn.example.test/avatars/student.png
                    roles: [STUDENT]
                    permissions: [learning:access]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/courses:
    get:
      tags: [Courses]
      operationId: listCourses
      summary: List published courses
      description: Returns only the current public version of published courses. Draft and unpublished versions are never projected, and all filters are optional.
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: keyword
          in: query
          schema:
            type: string
            maxLength: 100
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: level
          in: query
          schema:
            $ref: '#/components/schemas/CourseLevel'
        - name: accessType
          in: query
          schema:
            $ref: '#/components/schemas/CourseAccessType'
      responses:
        '200':
          description: Paged course summaries
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursePage'
              examples:
                firstPage:
                  value:
                    items:
                      - id: 0195d9c2-1c3f-7b6e-a9dd-7367730a6201
                        title: 七年级代数基础
                        summary: 从有理数到一元一次方程
                        coverMediaId: null
                        coverUrl: https://cdn.example.test/courses/algebra-cover.jpg
                        teacher:
                          id: 0195d9c2-1c3f-7b6e-a9dd-7367730a6101
                          displayName: 王老师
                        category:
                          id: 0195d9c2-1c3f-7b6e-a9dd-7367730a6301
                          name: 初中数学
                        level: BEGINNER
                        accessType: PUBLIC
                    page: 1
                    size: 20
                    total: 1
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/courses/categories:
    get:
      tags: [Courses]
      operationId: listCourseCategories
      summary: List active course categories
      security: []
      responses:
        '200':
          description: Active categories ordered by name and identifier
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategorySummary'
              examples:
                active:
                  value:
                    - id: 0195d9c2-1c3f-7b6e-a9dd-7367730a6301
                      name: 初中数学
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/courses/{courseId}:
    get:
      tags: [Courses]
      operationId: getCourse
      summary: Get a published course detail
      description: Returns the immutable public version and ordered curriculum. Missing, draft and unpublished courses share the same not-found response to avoid leaking private course existence.
      security: []
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Course detail
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'
              examples:
                algebra:
                  value:
                    id: 0195d9c2-1c3f-7b6e-a9dd-7367730a6201
                    title: 七年级代数基础
                    summary: 从有理数到一元一次方程
                    description: "## 课程介绍\n循序渐进掌握代数基础。"
                    coverMediaId: null
                    coverUrl: https://cdn.example.test/courses/algebra-cover.jpg
                    teacher:
                      id: 0195d9c2-1c3f-7b6e-a9dd-7367730a6101
                      displayName: 王老师
                    category:
                      id: 0195d9c2-1c3f-7b6e-a9dd-7367730a6301
                      name: 初中数学
                    level: BEGINNER
                    accessType: PUBLIC
                    publishedVersion: v1
                    chapters:
                      - id: 0195d9c2-1c3f-7b6e-a9dd-7367730a6401
                        title: 有理数
                        sequence: 1
                        lessons:
                          - id: 0195d9c2-1c3f-7b6e-a9dd-7367730a6501
                            title: 正数与负数
                            type: VIDEO
                            sequence: 1
                            previewable: true
                            resources: []
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/courses/{courseId}/lessons/{lessonId}/resources/{resourceId}/playback-grants:
    post:
      tags: [Courses]
      operationId: createCourseLessonPlaybackGrant
      summary: Authorize playback of one published lesson video resource
      description: |
        Course-service resolves the resource from the current immutable published version and derives its media ID and purpose server-side. An authenticated visitor may play a PUBLIC course or a previewable lesson. Until T11 supplies enrollment facts, a non-preview lesson in an ENROLLMENT_REQUIRED course returns `COURSE.ENROLLMENT_REQUIRED`. Missing, draft, archived, historical-version and mismatched resources share the same not-found response. The returned OSS/HLS URL is short-lived and must not be persisted or logged.
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/LessonId'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '201':
          description: Short-lived playback grant for the bound READY LESSON_VIDEO resource.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseMediaPlaybackGrant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CoursePlaybackForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MediaConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/MediaDependencyUnavailable'
  /api/v1/teacher/courses:
    get:
      tags: [Teacher Courses]
      operationId: listTeacherCourses
      summary: List courses owned by the current teacher
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Paged teacher course editor snapshots ordered by most recently updated
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherCoursePage'
              examples:
                firstPage:
                  value:
                    items:
                      - id: 0195d9c2-1c3f-7b6e-a9dd-7367730a6201
                        publicationStatus: DRAFT
                        hasUnpublishedChanges: true
                        publishedVersion: null
                        draftVersion: v1
                        version: v1
                        revision: 0
                        title: 七年级代数基础
                        summary: 从有理数到一元一次方程
                        description: "## 课程介绍\n循序渐进掌握代数基础。"
                        coverMediaId: null
                        coverUrl: https://cdn.example.test/courses/algebra-cover.jpg
                        instructorDisplayName: 王老师
                        category:
                          id: 0195d9c2-1c3f-7b6e-a9dd-7367730a6301
                          name: 初中数学
                        level: BEGINNER
                        accessType: PUBLIC
                        chapters: []
                        createdAt: '2026-08-01T00:00:00Z'
                        updatedAt: '2026-08-01T00:00:00Z'
                    page: 1
                    size: 20
                    total: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Teacher Courses]
      operationId: createTeacherCourse
      summary: Create an idempotent course draft owned by the current teacher
      description: Repeating the same `clientRequestId` for the same teacher returns the originally created course.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourseRequest'
      responses:
        '201':
          description: Course draft created
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
            Location:
              schema:
                type: string
                example: /api/v1/teacher/courses/0195d9c2-1c3f-7b6e-a9dd-7367730a6201
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherCourse'
        '200':
          description: Existing course returned for a repeated `clientRequestId`
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherCourse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/teacher/courses/{courseId}:
    get:
      tags: [Teacher Courses]
      operationId: getTeacherCourse
      summary: Get the current teacher-owned course editor snapshot
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Current draft when present, otherwise the latest published version
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherCourse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Teacher Courses]
      operationId: updateTeacherCourse
      summary: Replace editable course metadata
      description: Editing a course without a draft copies the immutable published version into a new draft first. Repeating an identical request body is a no-op.
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCourseRequest'
      responses:
        '200':
          description: Updated editor snapshot
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherCourse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/teacher/courses/{courseId}/curriculum:
    put:
      tags: [Teacher Courses]
      operationId: replaceTeacherCourseCurriculum
      summary: Replace the complete editable chapter and lesson ordering
      description: Repeating an identical curriculum body is a no-op and preserves the current chapter and lesson identifiers.
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceCurriculumRequest'
      responses:
        '200':
          description: Updated editor snapshot
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherCourse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/teacher/courses/{courseId}/publication:
    put:
      tags: [Teacher Courses]
      operationId: updateTeacherCoursePublication
      summary: Publish the current draft or unpublish the current live course
      description: Publishing archives the previous published version without modifying it. Repeating the same target status is idempotent.
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePublicationRequest'
      responses:
        '200':
          description: Current publication state
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursePublication'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/teacher/courses/{courseId}/lessons/{lessonId}/resources/{resourceId}/playback-grants:
    post:
      tags: [Teacher Courses]
      operationId: createTeacherCourseLessonPlaybackGrant
      summary: Preview one lesson video resource owned by the current teacher
      description: |
        Resolves the current editable version (the draft when present, otherwise the published version) and permits preview only when the authenticated TEACHER owns the course. The browser cannot submit a media ID, purpose, visibility decision or service credential. Other owners, stale resource IDs and non-video resources are indistinguishable from missing resources.
      parameters:
        - $ref: '#/components/parameters/CourseId'
        - $ref: '#/components/parameters/LessonId'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '201':
          description: Short-lived owner preview grant for the bound READY LESSON_VIDEO resource.
          headers:
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseMediaPlaybackGrant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/MediaConflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/MediaDependencyUnavailable'
  /api/v1/teacher/knowledge-points:
    get:
      tags: [Knowledge Points]
      operationId: listTeacherKnowledgePoints
      summary: List the enabled primary-or-junior mathematics knowledge-point tree
      description: Teachers can query and bind enabled knowledge points but cannot maintain them. PRIMARY and JUNIOR are supported; SENIOR remains disabled. Results are ordered by parent, sortOrder and code.
      parameters:
        - name: stage
          in: query
          description: Defaults to JUNIOR for compatibility with existing teacher links.
          schema:
            allOf:
              - $ref: '#/components/schemas/QuestionStage'
            default: JUNIOR
        - name: grade
          in: query
          schema:
            $ref: '#/components/schemas/QuestionGrade'
        - name: parentId
          in: query
          description: Omit for the complete tree; use the literal root UUID only when querying one branch.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Enabled knowledge points visible to teachers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgePoint'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/teacher/knowledge-points/search:
    get:
      tags: [Knowledge Points]
      operationId: searchTeacherKnowledgePoints
      summary: Search enabled knowledge points without loading the complete graph
      description: Returns only platform-enabled points. Source identifiers and source grouping keys are not exposed as user labels.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: normalizedStage
          in: query
          required: true
          schema: {$ref: '#/components/schemas/QuestionStage'}
        - name: knowledgeTypeId
          in: query
          schema: {type: string, maxLength: 80}
        - name: keyword
          in: query
          schema: {type: string, maxLength: 100}
      responses:
        '200':
          description: One bounded page ordered deterministically.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgePointSearchPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /api/v1/teacher/knowledge-points/{knowledgePointId}/graph:
    get:
      tags: [Knowledge Points]
      operationId: getTeacherKnowledgePointGraph
      summary: Get direct and bounded prerequisite neighbourhood
      parameters:
        - $ref: '#/components/parameters/KnowledgePointId'
        - name: depth
          in: query
          schema: {type: integer, minimum: 1, maximum: 5, default: 1}
      responses:
        '200':
          description: The selected point and a bounded graph projection.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgePointGraph'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/QuestionNotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/v1/admin/knowledge-graph-imports:
    post:
      tags: [Knowledge Points]
      operationId: createKnowledgeGraphImport
      summary: Create an administrator-only knowledge graph import task
      description: Defaults are enforced by the migration client. Formal imports enable confirmed PRIMARY/JUNIOR nodes and retain SENIOR nodes disabled; relationship and parent-key validation remain independent.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateKnowledgeGraphImportRequest'}
      responses:
        '201':
          description: Task created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeGraphImportTask'}
        '200':
          description: Idempotent replay.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeGraphImportTask'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/QuestionConflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/v1/admin/knowledge-graph-imports/{importTaskId}:
    get:
      tags: [Knowledge Points]
      operationId: getKnowledgeGraphImport
      summary: Get aggregate-only import status and dry-run result
      parameters:
        - $ref: '#/components/parameters/ImportTaskId'
      responses:
        '200':
          description: Safe aggregate result without full source identifiers.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/KnowledgeGraphImportTask'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/QuestionNotFound'}
  /api/v1/admin/knowledge-graph-imports/{importTaskId}/node-batches:
    post:
      tags: [Knowledge Points]
      operationId: submitKnowledgeGraphNodeBatch
      summary: Submit one deterministic node batch

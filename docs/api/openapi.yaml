          type: integer
          minimum: 0
          maximum: 100
        totalRows:
          type: integer
          minimum: 0
        processedRows:
          type: integer
          minimum: 0
        successCount:
          type: integer
          minimum: 0
        reviewCount:
          type: integer
          minimum: 0
          description: Current unresolved NEEDS_REVIEW count.
        resolvedCount:
          type: integer
          minimum: 0
          description: Number of historical JSON items explicitly imported after correction or confirmed skipped.
        skippedCount:
          type: integer
          minimum: 0
        failureCount:
          type: integer
          minimum: 0
        errors:
          type: array
          items:
            $ref: '#/components/schemas/QuestionImportRowError'
        failureCode:
          type: [string, 'null']
        failureMessage:
          type: [string, 'null']
        retainUntil:
          type: string
          format: date-time
          description: Earliest time the source reference may be released after a terminal result.
        sourceReleasedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateLegacyQuestionImportRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId, sourceSystem, sourceRootFingerprint, dryRun, maxItems]
      properties:
        clientRequestId: {type: string, format: uuid}
        sourceSystem:
          type: string
          pattern: '^[A-Z0-9][A-Z0-9_-]{2,79}$'
          description: Stable namespace such as LEGACY_RAWSTON_V3; it is not a filesystem path.
        sourceRootFingerprint:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: SHA-256 of the normalized read-only root label; the directory path is not stored.
        dryRun:
          type: boolean
        maxItems:
          type: integer
          minimum: 1
          maximum: 1000
          description: Hard ceiling for one task. A full corpus must be explicitly orchestrated as multiple tasks without raising this limit.
    LegacyQuestionImportItem:
      type: object
      additionalProperties: false
      required: [externalId, relativePath, pathEdition, pathGrade, contentSha256, json]
      properties:
        externalId:
          type: string
          minLength: 1
          maxLength: 160
        relativePath:
          type: string
          minLength: 1
          maxLength: 500
          description: Normalized relative path only; absolute paths and `..` are rejected and only its hash is persisted.
        pathEdition: {type: string, minLength: 1, maxLength: 100}
        pathGrade: {type: string, minLength: 1, maxLength: 100}
        contentSha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: SHA-256 of the original UTF-8 file bytes; treated as an opaque source idempotency fingerprint.
        json:
          type: object
          description: One legacy per-question object. It is bounded to 256 KiB by the server and never echoed or logged.
          additionalProperties: true
    LegacyQuestionImportBatchRequest:
      type: object
      additionalProperties: false
      required: [batchId, finalBatch, items]
      properties:
        batchId: {type: string, format: uuid}
        finalBatch:
          type: boolean
          description: Marks the task terminal after this batch; later new batches are rejected.
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/LegacyQuestionImportItem'
    LegacyQuestionImportIssue:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [EMBEDDED_OPTIONS_AMBIGUOUS, IMPLICIT_MULTI_PART, SUBQUESTION_ANSWER_MISSING, PATH_JSON_METADATA_CONFLICT, SOURCE_CONTENT_CONFLICT, TYPE_UNSUPPORTED, FIELD_INVALID, HTML_UNSAFE, EXTERNAL_IMAGE_TRANSFER_FAILED, KNOWLEDGE_POINT_UNKNOWN, KNOWLEDGE_POINT_NAME_CONFLICT, KNOWLEDGE_POINT_TYPE_CONFLICT, KNOWLEDGE_POINT_STAGE_MISMATCH, KNOWLEDGE_POINT_DUPLICATE, KNOWLEDGE_POINT_BINDING_INVALID]
        message: {type: string, maxLength: 300}
    LegacyQuestionImportItemResult:
      type: object
      additionalProperties: false

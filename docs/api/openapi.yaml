      required: [importTaskId, batchId, replayed, finalBatch, processedCount, importedCount, validCount, reviewCount, skippedCount, failedCount, items]
      properties:
        importTaskId: {type: string, format: uuid}
        batchId: {type: string, format: uuid}
        replayed: {type: boolean}

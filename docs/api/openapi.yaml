    QuestionImportSourceFormat:
      type: string
      enum: [CSV, XLSX]
    QuestionImportStatus:
      type: string
      enum: [PENDING, PROCESSING, COMPLETED, PARTIAL_SUCCESS, FAILED, CLEANED]
    QuestionImportItemOutcome:
      type: string
      enum: [IMPORTED, VALID, NEEDS_REVIEW, SKIPPED, FAILED]
    CreateQuestionImportRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId, sourceMediaId, sourceFormat]
      properties:
        clientRequestId:
          type: string
          format: uuid
        sourceMediaId:
          type: string
          format: uuid
          description: READY QUESTION_IMPORT_SOURCE owned by the current teacher.
        sourceFormat:
          $ref: '#/components/schemas/QuestionImportSourceFormat'
    QuestionImportRowError:
      type: object
      additionalProperties: false
      required: [rowNumber, code, message]
      properties:
        rowNumber:
          type: integer
          minimum: 2
        code:
          type: string
          pattern: '^QUESTION_IMPORT\.[A-Z][A-Z0-9_]*$'
        message:
          type: string
          maxLength: 500
    QuestionImportTask:
      type: object
      additionalProperties: false
      required: [id, questionScope, sourceMediaId, sourceFormat, sourceSystem, dryRun, maxItems, status, progress, totalRows, processedRows, successCount, reviewCount, resolvedCount, skippedCount, failureCount, errors, retainUntil, sourceReleasedAt, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        questionScope:
          $ref: '#/components/schemas/QuestionScope'
        sourceMediaId:
          type: [string, 'null']
          format: uuid
        sourceFormat:
          oneOf:
            - $ref: '#/components/schemas/QuestionImportSourceFormat'
            - type: string
              const: LEGACY_JSON
        sourceSystem:
          type: [string, 'null']
          maxLength: 80
          description: Stable migration namespace; null for CSV/XLSX.
        dryRun:
          type: boolean
        maxItems:
          type: [integer, 'null']
          minimum: 1
          maximum: 1000
          description: Hard LEGACY_JSON task ceiling; null for CSV/XLSX.
        status:
          $ref: '#/components/schemas/QuestionImportStatus'
        progress:
          type: integer
          minimum: 0
          maximum: 100
        totalRows:
          type: integer
          minimum: 0
        processedRows:
          type: integer
          minimum: 0
        successCount:
          type: integer
          minimum: 0
        reviewCount:
          type: integer
          minimum: 0
          description: Current unresolved NEEDS_REVIEW count.
        resolvedCount:
          type: integer
          minimum: 0
          description: Number of historical JSON items explicitly imported after correction or confirmed skipped.
        skippedCount:
          type: integer
          minimum: 0
        failureCount:
          type: integer
          minimum: 0
        errors:
          type: array
          items:
            $ref: '#/components/schemas/QuestionImportRowError'
        failureCode:
          type: [string, 'null']
        failureMessage:
          type: [string, 'null']
        retainUntil:
          type: string
          format: date-time
          description: Earliest time the source reference may be released after a terminal result.
        sourceReleasedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateLegacyQuestionImportRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId, sourceSystem, sourceRootFingerprint, dryRun, maxItems]
      properties:
        clientRequestId: {type: string, format: uuid}
        sourceSystem:
          type: string
          pattern: '^[A-Z0-9][A-Z0-9_-]{2,79}$'
          description: Stable namespace such as LEGACY_RAWSTON_V3; it is not a filesystem path.
        sourceRootFingerprint:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: SHA-256 of the normalized read-only root label; the directory path is not stored.
        dryRun:
          type: boolean
        maxItems:
          type: integer
          minimum: 1
          maximum: 1000
          description: Hard ceiling for one task. A full corpus must be explicitly orchestrated as multiple tasks without raising this limit.
    LegacyQuestionImportItem:
      type: object
      additionalProperties: false
      required: [externalId, relativePath, pathEdition, pathGrade, contentSha256, json]
      properties:
        externalId:
          type: string
          minLength: 1
          maxLength: 160
        relativePath:
          type: string
          minLength: 1
          maxLength: 500
          description: Normalized relative path only; absolute paths and `..` are rejected and only its hash is persisted.
        pathEdition: {type: string, minLength: 1, maxLength: 100}
        pathGrade: {type: string, minLength: 1, maxLength: 100}
        contentSha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: SHA-256 of the original UTF-8 file bytes; treated as an opaque source idempotency fingerprint.
        json:
          type: object
          description: One legacy per-question object. It is bounded to 256 KiB by the server and never echoed or logged.
          additionalProperties: true
    LegacyQuestionImportBatchRequest:
      type: object
      additionalProperties: false
      required: [batchId, finalBatch, items]
      properties:
        batchId: {type: string, format: uuid}
        finalBatch:
          type: boolean
          description: Marks the task terminal after this batch; later new batches are rejected.
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/LegacyQuestionImportItem'
    LegacyQuestionImportIssue:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [EMBEDDED_OPTIONS_AMBIGUOUS, IMPLICIT_MULTI_PART, SUBQUESTION_ANSWER_MISSING, PATH_JSON_METADATA_CONFLICT, SOURCE_CONTENT_CONFLICT, TYPE_UNSUPPORTED, FIELD_INVALID, HTML_UNSAFE, EXTERNAL_IMAGE_TRANSFER_FAILED, KNOWLEDGE_POINT_UNKNOWN, KNOWLEDGE_POINT_NAME_CONFLICT, KNOWLEDGE_POINT_TYPE_CONFLICT, KNOWLEDGE_POINT_STAGE_MISMATCH, KNOWLEDGE_POINT_DUPLICATE, KNOWLEDGE_POINT_BINDING_INVALID]
        message: {type: string, maxLength: 300}
    LegacyQuestionImportItemResult:
      type: object
      additionalProperties: false
      required: [externalId, outcome, questionId, issueCodes]
      properties:
        externalId: {type: string, maxLength: 160}
        outcome: {$ref: '#/components/schemas/QuestionImportItemOutcome'}
        questionId: {type: [string, 'null'], format: uuid}
        issueCodes:
          type: array
          uniqueItems: true
          items: {type: string}
    LegacyQuestionImportBatchResult:
      type: object
      additionalProperties: false
      required: [importTaskId, batchId, replayed, finalBatch, processedCount, importedCount, validCount, reviewCount, skippedCount, failedCount, items]
      properties:
        importTaskId: {type: string, format: uuid}
        batchId: {type: string, format: uuid}
        replayed: {type: boolean}
        finalBatch: {type: boolean}
        processedCount: {type: integer, minimum: 0, maximum: 20}
        importedCount: {type: integer, minimum: 0, maximum: 20}
        validCount: {type: integer, minimum: 0, maximum: 20}
        reviewCount: {type: integer, minimum: 0, maximum: 20}
        skippedCount: {type: integer, minimum: 0, maximum: 20}
        failedCount: {type: integer, minimum: 0, maximum: 20}
        items:
          type: array
          maxItems: 20
          items: {$ref: '#/components/schemas/LegacyQuestionImportItemResult'}
    LegacyQuestionImportCleanupResult:
      type: object
      additionalProperties: false
      required: [importTaskId, questionsDeleted, sourceReferencesDeleted, mediaReferencesReleased, alreadyCleaned]
      properties:
        importTaskId: {type: string, format: uuid}
        questionsDeleted: {type: integer, minimum: 0}
        sourceReferencesDeleted: {type: integer, minimum: 0}
        mediaReferencesReleased: {type: integer, minimum: 0}
        alreadyCleaned: {type: boolean}
    LegacyQuestionImportResolutionAction:
      type: string
      enum: [IMPORT_CORRECTED, CONFIRM_SKIP]
    LegacyQuestionImportResolution:
      type: object
      additionalProperties: false
      required: [action, resolvedAt]
      properties:
        action: {$ref: '#/components/schemas/LegacyQuestionImportResolutionAction'}
        resolvedAt: {type: string, format: date-time}
    LegacyQuestionImportReviewItem:
      type: object
      additionalProperties: false
      required: [id, revision, externalId, outcome, questionId, sourceSystem, originalDifficulty, pathEdition, jsonEdition, pathGrade, jsonGrade, issues, resolution, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        revision: {type: integer, format: int64, minimum: 0}
        externalId: {type: string, maxLength: 160}
        outcome: {$ref: '#/components/schemas/QuestionImportItemOutcome'}
        questionId: {type: [string, 'null'], format: uuid}
        sourceSystem: {type: string, maxLength: 80}
        originalDifficulty: {type: [string, 'null'], maxLength: 40}
        pathEdition: {type: [string, 'null'], maxLength: 100}
        jsonEdition: {type: [string, 'null'], maxLength: 100}
        pathGrade: {type: [string, 'null'], maxLength: 100}
        jsonGrade: {type: [string, 'null'], maxLength: 100}
        issues:
          type: array
          items: {$ref: '#/components/schemas/LegacyQuestionImportIssue'}
        resolution:
          oneOf:
            - $ref: '#/components/schemas/LegacyQuestionImportResolution'
            - type: 'null'
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    LegacyQuestionImportItemPage:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/LegacyQuestionImportReviewItem'}
        page: {type: integer, minimum: 1}
        size: {type: integer, minimum: 1}
        total: {type: integer, format: int64, minimum: 0}
    ResolveLegacyQuestionImportItemRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId, expectedRevision, action, correctedVersion]
      properties:
        clientRequestId: {type: string, format: uuid}
        expectedRevision: {type: integer, format: int64, minimum: 0}
        action: {$ref: '#/components/schemas/LegacyQuestionImportResolutionAction'}
        correctedVersion:
          oneOf:
            - $ref: '#/components/schemas/QuestionVersionInput'
            - type: 'null'
    QuestionImportPage:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/QuestionImportTask'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          format: int64
          minimum: 0
    ExternalImageTransferRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId, sourceUrl, scope]
      properties:
        clientRequestId:
          type: string
          format: uuid
          description: Deterministically derived from sourceSystem/externalId/image index for safe retry.
        sourceUrl:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 2000
          description: Used only during this call; media-service must not persist or log it.
        scope:
          $ref: '#/components/schemas/MediaAssetScope'
    MediaPurpose:
      type: string
      description: Stable business purpose. T08A enables the six course purposes; T09 additionally enables QUESTION_IMAGE, QUESTION_AUDIO, QUESTION_ATTACHMENT and QUESTION_IMPORT_SOURCE through reviewed teacher-only policies. Other frozen values remain disabled until their owning domain supplies policy and authorization.
      enum: [COURSE_COVER, LESSON_VIDEO, VIDEO_POSTER, SUBTITLE, COURSEWARE, ARTICLE_ATTACHMENT, QUESTION_IMAGE, QUESTION_AUDIO, QUESTION_ATTACHMENT, QUESTION_IMPORT_SOURCE, AI_QUESTION_IMAGE, USER_AVATAR, TEACHER_QUALIFICATION, BANNER_IMAGE, TOPIC_COVER, REPORT_EXPORT]
    MediaUploadMode:
      type: string
      enum: [SINGLE_PUT, MULTIPART]
    MediaUploadStatus:
      type: string
      enum: [CREATED, UPLOADING, UPLOADED, VERIFYING, PROCESSING, READY, REJECTED, FAILED, EXPIRED, CANCELED]
    MediaAssetStatus:
      type: string
      enum: [UPLOADED, VERIFYING, PROCESSING, READY, REJECTED, FAILED, EXPIRED, DELETING, DELETED]
    MediaProcessingStatus:
      type: string
      enum: [PENDING, RUNNING, SUCCEEDED, FAILED, CANCELED]
    MediaAssetScope:
      type: string
      description: SYSTEM assets are administrator-owned and readable by authenticated users; TEACHER assets remain owner-only.
      enum: [SYSTEM, TEACHER]
    CreateMediaUploadRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId, purpose, fileName, size, mimeType, sha256]
      properties:
        clientRequestId:
          type: string
          format: uuid
        purpose:
          $ref: '#/components/schemas/MediaPurpose'
        fileName:
          type: string
          minLength: 1
          maxLength: 255
          description: Original display name only. It is never used as the OSS object key.
        size:
          type: integer
          format: int64
          minimum: 1
        mimeType:
          type: string
          minLength: 3
          maxLength: 127
        sha256:
          type: string
          pattern: '^[a-fA-F0-9]{64}$'
    AuthorizeMediaPartRequest:
      type: object
      additionalProperties: false
      required: [partNumber, contentLength]
      properties:
        partNumber:
          type: integer
          minimum: 1
          maximum: 10000
        contentLength:
          type: integer
          format: int64
          minimum: 1
        contentMd5:
          type: [string, 'null']
          pattern: '^[A-Za-z0-9+/]{22}==$'
    CompleteMediaUploadRequest:
      type: object
      additionalProperties: false
      required: [sha256, parts]
      properties:
        sha256:
          type: string
          pattern: '^[a-fA-F0-9]{64}$'
        parts:
          type: array
          maxItems: 10000
          description: Empty for SINGLE_PUT. Required, unique and ascending for MULTIPART.
          items:
            $ref: '#/components/schemas/CompletedMediaPart'
    CompletedMediaPart:
      type: object
      additionalProperties: false
      required: [partNumber, etag]
      properties:
        partNumber:
          type: integer
          minimum: 1
          maximum: 10000
        etag:
          type: string
          minLength: 1
          maxLength: 128
    MediaUploadGrant:
      type: object
      additionalProperties: false
      required: [method, url, headers, expiresAt]
      properties:
        method:
          type: string
          const: PUT
        url:
          type: string
          format: uri
          description: Short-lived bearer URL. Never persist or log it.
        headers:
          type: object
          additionalProperties:
            type: string
          description: Exact headers that must accompany the direct OSS request.
        expiresAt:
          type: string
          format: date-time
    MediaMultipartUpload:
      type: object
      additionalProperties: false
      required: [partSize, maxParts, uploadedParts]
      properties:
        partSize:
          type: integer
          format: int64
          minimum: 5242880
        maxParts:
          type: integer
          minimum: 1
          maximum: 10000
        uploadedParts:
          type: array
          items:
            $ref: '#/components/schemas/UploadedMediaPart'
    UploadedMediaPart:
      type: object
      additionalProperties: false
      required: [partNumber, etag, size]
      properties:
        partNumber:
          type: integer
        etag:
          type: string
        size:
          type: integer
          format: int64
    MediaUploadSession:
      type: object
      additionalProperties: false
      required: [uploadId, clientRequestId, purpose, mode, status, fileName, size, mimeType, sha256, expiresAt, createdAt]
      properties:
        uploadId:
          type: string
          format: uuid
        clientRequestId:
          type: string
          format: uuid
        purpose:
          $ref: '#/components/schemas/MediaPurpose'
        mode:
          $ref: '#/components/schemas/MediaUploadMode'
        status:
          $ref: '#/components/schemas/MediaUploadStatus'
        fileName:
          type: string
        size:
          type: integer
          format: int64
        mimeType:
          type: string
        sha256:
          type: string
        uploadGrant:
          oneOf:
            - $ref: '#/components/schemas/MediaUploadGrant'
            - type: 'null'
        multipart:
          oneOf:
            - $ref: '#/components/schemas/MediaMultipartUpload'
            - type: 'null'
        mediaId:
          type: [string, 'null']
          format: uuid
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    MediaVariant:
      type: object
      additionalProperties: false
      required: [variant, mimeType, size]
      properties:
        variant:
          type: string
          maxLength: 80
          example: baseline-mp4-v1
        mimeType:
          type: string
        size:
          type: integer
          format: int64
          minimum: 0
        componentCount:
          type: integer
          minimum: 0
          description: Number of private HLS segment components; zero for a single-object variant.
    MediaAsset:
      type: object
      additionalProperties: false
      required: [mediaId, scope, purpose, status, processingStatus, originalFileName, mimeType, size, sha256, variants, createdAt, updatedAt]
      properties:
        mediaId:
          type: string
          format: uuid
        scope:
          $ref: '#/components/schemas/MediaAssetScope'
        purpose:
          $ref: '#/components/schemas/MediaPurpose'
        status:
          $ref: '#/components/schemas/MediaAssetStatus'
        processingStatus:
          $ref: '#/components/schemas/MediaProcessingStatus'
        originalFileName:
          type: string
        mimeType:
          type: string
        size:
          type: integer
          format: int64
        sha256:
          type: string
        variants:
          type: array
          items:
            $ref: '#/components/schemas/MediaVariant'
        errorCode:
          type: [string, 'null']
        errorMessage:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MediaAssetPage:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MediaAsset'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          format: int64
          minimum: 0
    CreateMediaAccessGrantRequest:
      type: object
      additionalProperties: false
      required: [variant, disposition]
      properties:
        variant:
          type: string
          maxLength: 80
          description: Use `ORIGINAL` for the verified private source object or a listed variant name. HLS playlist variants return a signed temporary rewritten playlist whose segment URLs share the same expiry.
        disposition:
          type: string
          enum: [INLINE, ATTACHMENT]
    MediaAccessGrant:
      type: object
      additionalProperties: false
      required: [method, url, headers, expiresAt]
      properties:
        method:
          type: string
          const: GET
        url:
          type: string
          format: uri
          description: Short-lived bearer URL. Never persist or log it.
        headers:
          type: object
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
    CourseMediaPlaybackGrant:
      type: object
      additionalProperties: false
      required: [method, url, headers, expiresAt]
      description: Short-lived playback projection returned by course-service after domain authorization. It contains no Bucket, Object Key, permanent URL or service credential.
      properties:
        method:
          type: string
          const: GET
        url:
          type: string
          format: uri
          description: Expiring OSS URL for an HLS temporary playlist. Playlist segment URLs expire at the same time; never persist or log this value.
        headers:
          type: object
          additionalProperties:
            type: string
          description: Headers required by the authorized GET request; currently empty for OSS signed URLs.
        expiresAt:
          type: string
          format: date-time
    MediaBindingValidationRequest:
      type: object
      additionalProperties: false
      required: [purpose]
      properties:
        purpose:
          $ref: '#/components/schemas/MediaPurpose'
    MediaBindingValidation:
      type: object
      additionalProperties: false
      required: [mediaId, purpose, status, bindable]
      properties:
        mediaId:
          type: string
          format: uuid
        purpose:
          $ref: '#/components/schemas/MediaPurpose'
        status:
          type: string
          const: READY
        bindable:
          type: boolean
          const: true
          description: True only after media-service has verified owner, exact purpose and READY state for this request.
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, traceId, timestamp, path, fieldErrors]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*\.[A-Z][A-Z0-9_]*$'
          example: COMMON.VALIDATION_FAILED
        message:
          type: string
        traceId:
          type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      additionalProperties: false
      required: [field, reason]
      properties:
        field:
          type: string
          description: Safe dotted request-field path when the server can locate the failure (for example, version.type); request is the fallback for malformed bodies without a reliable field path.
        reason:
          type: string
security:
  - bearerAuth: []

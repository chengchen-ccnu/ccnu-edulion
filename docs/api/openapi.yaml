        unresolvedParentKeyCount: {type: integer, minimum: 0}
        addedNodeCount: {type: integer, minimum: 0}
        reusedNodeCount: {type: integer, minimum: 0}
        conflictNodeCount: {type: integer, minimum: 0}
        addedRelationCount: {type: integer, minimum: 0}
        reusedRelationCount: {type: integer, minimum: 0}
        skippedRelationCount: {type: integer, minimum: 0}
        missingEndpointCount: {type: integer, minimum: 0}
        duplicateEdgeCount: {type: integer, minimum: 0}
        selfLoopCount: {type: integer, minimum: 0}
        crossDisciplineEdgeCount: {type: integer, minimum: 0}
        crossStageEdgeCount: {type: integer, minimum: 0}
        cycleDetected: {type: boolean}

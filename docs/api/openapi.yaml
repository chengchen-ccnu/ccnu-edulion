        '403': {$ref: '#/components/responses/CoursePlaybackForbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/MediaConflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/MediaDependencyUnavailable'}

  schemas:
    AgentEntryPoint:
      type: string
      enum: [INDEPENDENT_CHAT, PRACTICE_FLOATING]
    AgentConversationStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]
    AgentRunStatus:
      type: string
      enum: [ACCEPTED, RUNNING, COMPLETED, DEGRADED, LIMIT_REACHED, CANCELLED, FAILED]
    AgentMessageRole:
      type: string
      enum: [USER, ASSISTANT]
    AgentMessageCompleteness:
      type: string
      enum: [COMPLETE, PARTIAL]
    PracticeDifficulty:
      type: string
      enum: [EASY, MEDIUM, HARD]
    PracticeQuestionType:
      type: string
      enum: [SINGLE_CHOICE, MULTIPLE_CHOICE, TRUE_FALSE, FILL_BLANK, COMPOSITE]
      description: SHORT_ANSWER is intentionally absent because the first autonomous-practice flow accepts only questions reliably scored by existing deterministic rules. COMPOSITE is valid only when every child is independently auto-scorable.
    PracticeGenerationCriteria:
      type: object
      additionalProperties: false
      required: [topic, difficulty, requestedCount]
      properties:
        topic: {type: string, minLength: 1, maxLength: 200}
        difficulty: {$ref: '#/components/schemas/PracticeDifficulty'}
        requestedCount: {type: integer, minimum: 1, maximum: 20, default: 5}
        allowDifficultyFallback:
          type: boolean
          description: 未指定难度时为 true，以 difficulty 为优先难度，不足允许同主题其他难度补齐；明确难度和缺省旧记录为 false。候选逐题 difficulty 始终是真实难度。
    PracticeCandidateQuestion:
      type: object
      additionalProperties: false
      required: [questionId, questionVersionId, questionType, difficulty]
      properties:
        questionId: {type: string, format: uuid}
        questionVersionId: {type: string, format: uuid}
        questionType: {$ref: '#/components/schemas/PracticeQuestionType'}
        difficulty: {$ref: '#/components/schemas/PracticeDifficulty'}
      description: Safe identity-only projection after Learning revalidates exact immutable versions. It contains no stem, answer, analysis, scoring rule, storage location, or temporary URL.
    PendingPracticeActionStatus:
      type: string
      enum: [PENDING, CONFIRMED, CANCELLED, EXPIRED, EXECUTING, SUCCEEDED, FAILED]
    AutonomousPracticeExecutionResult:
      type: object
      additionalProperties: false
      required: [autonomousPracticeId, assessmentId, startRoute]
      properties:
        autonomousPracticeId: {type: string, format: uuid}
        assessmentId: {type: string, format: uuid}
        startRoute: {type: string, pattern: '^/practice/[0-9a-fA-F-]{36}$', maxLength: 80}
      description: Stable result of the confirmed action. Replays return the same identifiers and relative route.
    PendingPracticeAction:
      type: object
      additionalProperties: false
      required: [actionId, conversationId, criteria, requestedCount, actualCount, candidateQuestions, status, revision, expiresAt]
      properties:
        actionId: {type: string, format: uuid}
        conversationId: {type: string, format: uuid}
        criteria: {$ref: '#/components/schemas/PracticeGenerationCriteria'}
        requestedCount: {type: integer, minimum: 1, maximum: 20}
        actualCount: {type: integer, minimum: 1, maximum: 20}
        candidateQuestions:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: {$ref: '#/components/schemas/PracticeCandidateQuestion'}
        status: {$ref: '#/components/schemas/PendingPracticeActionStatus'}
        revision: {type: integer, minimum: 0}
        expiresAt: {type: string, format: date-time}
        executionResult:
          oneOf:
            - {$ref: '#/components/schemas/AutonomousPracticeExecutionResult'}
            - {type: 'null'}
      description: Browser-safe projection containing at least one Java-verified candidate. Zero-candidate retrieval has no action projection. ownerUserId, source run details, request fingerprints, answers, prompts, and raw model/tool output are deliberately absent.
    ConfirmPendingPracticeActionRequest:
      type: object
      additionalProperties: false
      required: [requestId, expectedRevision]
      properties:
        requestId: {type: string, format: uuid}
        expectedRevision: {type: integer, minimum: 0}
    CancelPendingPracticeActionRequest:
      type: object
      additionalProperties: false
      required: [requestId, expectedRevision]
      properties:
        requestId: {type: string, format: uuid}
        expectedRevision: {type: integer, minimum: 0}
    AutonomousPracticeEntry:
      type: object
      additionalProperties: false
      required: [autonomousPracticeId, assessmentId, title, questionCount, startRoute]
      properties:
        autonomousPracticeId: {type: string, format: uuid}
        assessmentId: {type: string, format: uuid}
        title: {type: string, minLength: 1, maxLength: 160}
        questionCount: {type: integer, minimum: 1, maximum: 20}
        startRoute: {type: string, pattern: '^/practice/[0-9a-fA-F-]{36}$', maxLength: 80}
    CreateAgentConversationRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId, entryPoint]
      properties:
        clientRequestId:
          type: string
          format: uuid
          description: Stable logical-create key generated by the client and scoped to the authenticated user.
        entryPoint: {$ref: '#/components/schemas/AgentEntryPoint'}
        title:
          type: string
          minLength: 1
          maxLength: 80
          description: Optional user-visible title only; it never changes permissions or routing.
    AgentConversation:
      type: object
      additionalProperties: false
      required: [id, entryPoint, title, status, revision, createdAt, updatedAt, lastMessageAt]
      properties:
        id: {type: string, format: uuid}
        entryPoint: {$ref: '#/components/schemas/AgentEntryPoint'}
        title: {type: string, minLength: 1, maxLength: 80}
        status: {$ref: '#/components/schemas/AgentConversationStatus'}
        revision: {type: integer, minimum: 0}
        activeRunId:
          type: [string, 'null']
          format: uuid
          description: Current run identity when one run is active; null in a quiescent conversation.
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        lastMessageAt: {type: string, format: date-time}
    AgentConversationPage:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AgentConversation'}}
        page: {type: integer, minimum: 1}
        size: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, format: int64, minimum: 0}
    RenameAgentConversationRequest:
      type: object
      additionalProperties: false
      required: [requestId, title, expectedRevision]
      properties:
        requestId: {type: string, format: uuid, description: Stable logical-rename key generated by the browser.}
        title:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '^[^\u0000-\u001F\u007F]*\S[^\u0000-\u001F\u007F]*$'
          description: User-visible title; surrounding whitespace is removed by the server and control characters are rejected.
        expectedRevision: {type: integer, format: int64, minimum: 0, description: Revision from the last owner-visible conversation projection.}
    ArchiveAgentConversationRequest:
      type: object
      additionalProperties: false
      required: [requestId, expectedRevision]
      properties:
        requestId: {type: string, format: uuid, description: Stable logical-archive key generated by the browser.}
        expectedRevision: {type: integer, format: int64, minimum: 0, description: Revision from the last owner-visible conversation projection.}
    AgentMessageContextRequest:
      type: object
      additionalProperties: false
      properties:
        questionId:
          type: string
          format: uuid
          description: Untrusted browser hint. Java must resolve the current learner-safe question projection and version.
        courseId:
          type: string
          format: uuid
          description: Untrusted browser hint. Java must verify current course access and never fall back to public retrieval when authorization is unavailable.
        lessonId:
          type: string
          format: uuid
          description: Requires courseId and must belong to the authorized current course version.
        questionMediaIds:
          type: array
          maxItems: 8
          uniqueItems: true
          items: {type: string, format: uuid}
          description: Optional subset of media bound to the authorized question. Arbitrary media IDs are rejected.
        aiQuestionMediaIds:
          type: array
          maxItems: 8
          uniqueItems: true
          items: {type: string, format: uuid}
          description: Optional stable AI_QUESTION_IMAGE media IDs uploaded by the current user. Java validates owner, exact purpose and READY state before binding them to this message; URLs are never accepted or stored.
    SendAgentMessageRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId, content]
      properties:
        clientRequestId:
          type: string
          format: uuid
          description: Stable logical-send key unique within the conversation.
        content: {type: string, minLength: 1, maxLength: 10000}
        context: {$ref: '#/components/schemas/AgentMessageContextRequest'}
        selectedCapability:
          $ref: '#/components/schemas/AgentSelectableCapability'
          description: Optional public capability selected only for this message. The server maps it to a trusted internal Skill and never accepts an internal Skill name from the browser.
    AgentSelectableCapability:
      type: string
      enum: [GENERATE_AUTONOMOUS_PRACTICE]
      description: Finite student-facing capability allowlist. It is not an internal Skill name, version or script reference.
    AgentExplanationStyle:
      type: string
      enum: [GUIDED_STEP_BY_STEP, COMPLETE_SOLUTION]
      description: User-selected explanation mode. GUIDED_STEP_BY_STEP is the default until the user explicitly changes it.
    AgentExplanationPreference:
      type: object
      additionalProperties: false
      required: [value, revision, explicitlySet]
      properties:
        value: {$ref: '#/components/schemas/AgentExplanationStyle'}
        revision: {type: integer, format: int64, minimum: 0}
        explicitlySet: {type: boolean, description: False only when the returned value is the default and no explicit setting exists.}
      description: Public explicit setting only. It never includes inferred preferences, profile evidence or memory.
    UpdateAgentExplanationPreferenceRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId, value, expectedRevision]
      properties:
        clientRequestId: {type: string, format: uuid, description: Stable logical update key for safe network retry.}
        value: {$ref: '#/components/schemas/AgentExplanationStyle'}
        expectedRevision: {type: integer, format: int64, minimum: 0}
    RegenerateAgentMessageRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId]
      properties:
        clientRequestId: {type: string, format: uuid, description: Stable key for one regeneration. No message body, media or context may be resubmitted.}
    AgentMessageContext:
      type: object
      additionalProperties: false
      properties:
        questionId: {type: string, format: uuid}
        questionVersionId: {type: string, format: uuid}
        courseId: {type: string, format: uuid}
        courseVersionId: {type: string, minLength: 1, maxLength: 64}
        lessonId: {type: string, format: uuid}
        mediaIds:
          type: array
          maxItems: 8
          items: {type: string, format: uuid}
      description: Persisted stable authorized identifiers only. Temporary URLs and hidden answer fields are never stored.
    AgentQuestionContextProjectionStatus:
      type: string
      enum: [AVAILABLE, UNAVAILABLE]
      description: UNAVAILABLE is a fail-closed historical state; clients must not substitute the current public question or render an empty question.
    AgentQuestionContextOption:
      type: object
      additionalProperties: false
      required: [key, content]
      properties:
        key: {type: string, minLength: 1, maxLength: 16}
        content: {type: string, minLength: 1, maxLength: 20000}
    AgentQuestionContextMedia:
      type: object
      additionalProperties: false
      required: [id, mediaId, purpose, sequence]
      description: Stable learner-visible content binding metadata only. It contains no Bucket, Object Key, URL, credential, answer-only media or storage details.
      properties:
        id: {type: string, format: uuid, description: Immutable Learning version-media row ID.}
        mediaId: {type: string, format: uuid}
        purpose: {type: string, enum: [QUESTION_IMAGE, QUESTION_AUDIO, QUESTION_ATTACHMENT]}
        sequence: {type: integer, minimum: 1}
    AgentQuestionContextChild:
      type: object
      additionalProperties: false
      required: [questionId, questionVersionId, sequence, type, stem, options, media]
      properties:
        questionId: {type: string, format: uuid}
        questionVersionId: {type: string, format: uuid}
        sequence: {type: integer, minimum: 1, maximum: 100}
        type: {$ref: '#/components/schemas/QuestionInputType'}
        stem: {type: string, minLength: 1, maxLength: 50000}
        options: {type: array, maxItems: 8, items: {$ref: '#/components/schemas/AgentQuestionContextOption'}}
        media: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/AgentQuestionContextMedia'}}
    AgentQuestionContextQuestion:
      type: object
      additionalProperties: false
      required: [questionId, questionVersionId, type, stem, options, media, children]
      description: Exact immutable learner-safe question version. Correct answers, analysis, grading facts, private runtime state and temporary media access are intentionally absent.
      properties:
        questionId: {type: string, format: uuid}
        questionVersionId: {type: string, format: uuid}
        type: {$ref: '#/components/schemas/QuestionType'}
        stem: {type: string, minLength: 1, maxLength: 50000}
        options: {type: array, maxItems: 8, items: {$ref: '#/components/schemas/AgentQuestionContextOption'}}
        media: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/AgentQuestionContextMedia'}}
        children: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/AgentQuestionContextChild'}}
    AgentQuestionContextProjection:
      type: object
      additionalProperties: false
      required: [status, question]
      description: Message-time question context resolution result. A single unavailable historical context does not fail the whole message page and is never represented as an empty question.
      properties:
        status: {$ref: '#/components/schemas/AgentQuestionContextProjectionStatus'}
        question:
          oneOf:
            - {$ref: '#/components/schemas/AgentQuestionContextQuestion'}
            - type: 'null'
    AgentMessage:
      type: object
      additionalProperties: false
      required: [id, conversationId, role, content, completeness, sequenceNo, createdAt]
      properties:
        id: {type: string, format: uuid}
        conversationId: {type: string, format: uuid}
        runId: {type: [string, 'null'], format: uuid}
        role: {$ref: '#/components/schemas/AgentMessageRole'}
        content: {type: string, maxLength: 100000}
        completeness: {$ref: '#/components/schemas/AgentMessageCompleteness'}
        contentState:
          type: string
          enum: [RETAINED, PURGED]
          description: Optional forward-compatible retention projection. PURGED means the original body was removed by policy; empty content must not be presented as the original text.
        context: {$ref: '#/components/schemas/AgentMessageContext'}
        questionContextProjection:
          $ref: '#/components/schemas/AgentQuestionContextProjection'
          description: Present only for USER messages in PRACTICE_FLOATING conversations that persisted questionId and questionVersionId. UNAVAILABLE explicitly forbids current-version fallback.
        sequenceNo: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
    AgentMessagePage:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AgentMessage'}}
        page: {type: integer, minimum: 1}
        size: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, format: int64, minimum: 0}
    AgentClientStreamEvent:
      oneOf:
        - {$ref: '#/components/schemas/AgentRunAcceptedEvent'}
        - {$ref: '#/components/schemas/AgentStageChangedEvent'}
        - {$ref: '#/components/schemas/AgentTextDeltaEvent'}
        - {$ref: '#/components/schemas/AgentClarificationRequiredEvent'}
        - {$ref: '#/components/schemas/AgentReferenceEvent'}
        - {$ref: '#/components/schemas/AgentPartialCheckpointEvent'}
        - {$ref: '#/components/schemas/AgentHeartbeatEvent'}
        - {$ref: '#/components/schemas/AgentRunErrorEvent'}
        - {$ref: '#/components/schemas/AgentFinalResultEvent'}
      description: Browser-safe projection of the internal typed event. FINAL_RESULT occurs exactly once and carries the terminal AgentRunStatus.
    AgentStreamEventBase:
      type: object
      required: [runId, messageId, sequence, occurredAt]
      properties:
        runId: {type: string, format: uuid}
        messageId: {type: string, format: uuid}
        sequence: {type: integer, minimum: 1}
        occurredAt: {type: string, format: date-time}
    AgentRunAcceptedEvent:
      allOf:
        - {$ref: '#/components/schemas/AgentStreamEventBase'}
        - {type: object, required: [eventType, payload], properties: {eventType: {type: string, const: RUN_ACCEPTED}, payload: {$ref: '#/components/schemas/AgentRunAcceptedPayload'}}}
      unevaluatedProperties: false
    AgentStageChangedEvent:
      allOf:
        - {$ref: '#/components/schemas/AgentStreamEventBase'}
        - {type: object, required: [eventType, payload], properties: {eventType: {type: string, const: STAGE_CHANGED}, payload: {$ref: '#/components/schemas/AgentStageChangedPayload'}}}
      unevaluatedProperties: false
    AgentTextDeltaEvent:
      allOf:
        - {$ref: '#/components/schemas/AgentStreamEventBase'}
        - {type: object, required: [eventType, payload], properties: {eventType: {type: string, const: TEXT_DELTA}, payload: {$ref: '#/components/schemas/AgentTextDeltaPayload'}}}
      unevaluatedProperties: false
    AgentClarificationRequiredEvent:
      allOf:
        - {$ref: '#/components/schemas/AgentStreamEventBase'}
        - {type: object, required: [eventType, payload], properties: {eventType: {type: string, const: CLARIFICATION_REQUIRED}, payload: {$ref: '#/components/schemas/AgentClarificationPayload'}}}
      unevaluatedProperties: false
    AgentReferenceEvent:
      allOf:
        - {$ref: '#/components/schemas/AgentStreamEventBase'}
        - {type: object, required: [eventType, payload], properties: {eventType: {type: string, const: REFERENCE}, payload: {$ref: '#/components/schemas/AgentReferencePayload'}}}
      unevaluatedProperties: false
    AgentPartialCheckpointEvent:
      allOf:
        - {$ref: '#/components/schemas/AgentStreamEventBase'}
        - {type: object, required: [eventType, payload], properties: {eventType: {type: string, const: PARTIAL_CHECKPOINT}, payload: {$ref: '#/components/schemas/AgentPartialCheckpointPayload'}}}
      unevaluatedProperties: false
    AgentHeartbeatEvent:
      allOf:
        - {$ref: '#/components/schemas/AgentStreamEventBase'}
        - {type: object, required: [eventType, payload], properties: {eventType: {type: string, const: HEARTBEAT}, payload: {$ref: '#/components/schemas/AgentHeartbeatPayload'}}}
      unevaluatedProperties: false
    AgentRunErrorEvent:
      allOf:
        - {$ref: '#/components/schemas/AgentStreamEventBase'}
        - {type: object, required: [eventType, payload], properties: {eventType: {type: string, const: RUN_ERROR}, payload: {$ref: '#/components/schemas/AgentRunErrorPayload'}}}
      unevaluatedProperties: false
    AgentFinalResultEvent:
      allOf:
        - {$ref: '#/components/schemas/AgentStreamEventBase'}
        - {type: object, required: [eventType, payload], properties: {eventType: {type: string, const: FINAL_RESULT}, payload: {$ref: '#/components/schemas/AgentFinalResultPayload'}}}
      unevaluatedProperties: false
    AgentRunAcceptedPayload:
      type: object
      additionalProperties: false
      required: [conversationId, messageId, replayed]
      properties:
        conversationId: {type: string, format: uuid}
        messageId: {type: string, format: uuid}
        replayed: {type: boolean}
    AgentStage:
      type: string
      enum: [UNDERSTANDING, RETRIEVING, CHECKING_WORK, PLANNING, EXPLAINING, FINALIZING]
    AgentStageChangedPayload:
      type: object
      additionalProperties: false
      required: [stage, message]
      properties:
        stage: {$ref: '#/components/schemas/AgentStage'}
        message: {type: string, minLength: 1, maxLength: 120}
    AgentTextDeltaPayload:
      type: object
      additionalProperties: false
      required: [delta]
      properties:
        delta: {type: string, minLength: 1, maxLength: 4000}
    AgentClarificationPayload:
      type: object
      additionalProperties: false
      required: [question, missingSlots]
      properties:
        question: {type: string, minLength: 1, maxLength: 500}
        missingSlots: {type: array, minItems: 1, maxItems: 8, uniqueItems: true, items: {type: string, enum: [problemText, conceptName, questionId, courseId, lessonId, studentWork, hintLevel, wrongQuestionId, practiceTopic, planGoal, platformTopic, actionId]}}
    AgentAuthorizedReference:
      type: object
      additionalProperties: false
      required: [referenceId, sourceType, title, accessDecision]
      properties:
        referenceId: {type: string, minLength: 1, maxLength: 128}
        sourceType: {type: string, enum: [QUESTION, KNOWLEDGE_POINT, COURSE_TEXT, STUDENT_FACT, USER_HELP]}
        title: {type: string, minLength: 1, maxLength: 200}
        accessDecision: {type: string, const: AUTHORIZED_BY_JAVA}
        courseId: {type: string, format: uuid}
        lessonId: {type: string, format: uuid}
        appRoute: {type: string, pattern: '^/[a-z0-9-]+(?:/[a-z0-9-]+)*$', maxLength: 120, description: Allowed only for USER_HELP and only from the Java whitelist.}
    AgentReferencePayload:
      type: object
      additionalProperties: false
      required: [reference]
      properties:
        reference: {$ref: '#/components/schemas/AgentAuthorizedReference'}
    AgentPartialCheckpointPayload:
      type: object
      additionalProperties: false
      required: [text, complete, persisted]
      properties:
        text: {type: string, minLength: 1, maxLength: 30000}
        complete: {type: boolean, const: false}
        persisted: {type: boolean, const: true}
    AgentHeartbeatPayload:
      type: object
      additionalProperties: false
      required: [stage]
      properties:
        stage: {$ref: '#/components/schemas/AgentStage'}
    AgentSafeError:
      type: object
      additionalProperties: false
      required: [code, message, retryable, traceId]
      properties:
        code: {type: string, pattern: '^AGENT\\.[A-Z0-9_]{3,48}$'}
        message: {type: string, minLength: 1, maxLength: 300}
        retryable: {type: boolean}
        traceId: {type: string, pattern: '^[A-Za-z0-9_-]{8,64}$'}
      description: Safe browser error only; no prompts, reasoning, raw tool output, credentials, stack traces or temporary URLs.
    AgentRunErrorPayload:
      type: object
      additionalProperties: false
      required: [error, terminal]
      properties:
        error: {$ref: '#/components/schemas/AgentSafeError'}
        terminal: {type: boolean, const: false}
    AgentFinalResultPayload:
      type: object
      additionalProperties: false
      required: [terminal, terminalStatus, answerCompleteness]
      properties:
        terminal: {type: boolean, const: true}
        terminalStatus: {type: string, enum: [COMPLETED, DEGRADED, LIMIT_REACHED, CANCELLED, FAILED]}
        finalAnswer: {type: string, minLength: 1, maxLength: 60000}
        answerCompleteness: {type: string, enum: [COMPLETE, SIMPLIFIED, INTERRUPTED]}
        interruptionNotice: {type: string, const: 回答已中断}
        savedCheckpointSequence: {type: integer, minimum: 1}
        references: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/AgentAuthorizedReference'}}
        pendingPracticeAction:
          $ref: '#/components/schemas/PendingPracticeAction'
          description: Present only after Java revalidates and persists at least one Practice Coach candidate. Zero-candidate retrieval has no action or card. Python candidate data is never forwarded directly.
        skillOffer:
          $ref: '#/components/schemas/AgentSkillOffer'
          description: A server-issued, single-next-turn offer. It is not a pending action and does not mean a Skill, search or write has executed.
        error: {$ref: '#/components/schemas/AgentSafeError'}
      description: COMPLETED requires COMPLETE plus finalAnswer; DEGRADED/LIMIT_REACHED require SIMPLIFIED plus finalAnswer; CANCELLED/FAILED require INTERRUPTED plus the fixed interruptionNotice.
      allOf:
        - if: {properties: {terminalStatus: {const: COMPLETED}}}
          then: {required: [finalAnswer], properties: {answerCompleteness: {const: COMPLETE}}}
        - if: {properties: {terminalStatus: {enum: [DEGRADED, LIMIT_REACHED]}}}
          then: {required: [finalAnswer], properties: {answerCompleteness: {const: SIMPLIFIED}}}
        - if: {properties: {terminalStatus: {enum: [CANCELLED, FAILED]}}}
          then: {required: [interruptionNotice], properties: {answerCompleteness: {const: INTERRUPTED}}}
    AgentSkillOffer:
      type: object
      additionalProperties: false
      required: [offerId, capability, topic, prompt]
      properties:
        offerId: {type: string, format: uuid}
        capability: {$ref: '#/components/schemas/AgentSelectableCapability'}
        topic: {type: string, minLength: 1, maxLength: 200, description: The bounded topic proposed for the next-turn practice request.}
        difficulty: {type: string, enum: [EASY, MEDIUM, HARD]}
        questionCount: {type: integer, minimum: 1, maximum: 20}
        prompt: {type: string, minLength: 1, maxLength: 200, description: Student-facing confirmation question; no internal Skill identity is exposed.}
    AgentRunEventPage:
      type: object
      additionalProperties: false
      required: [runId, status, items]
      properties:
        runId: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/AgentRunStatus'}
        items: {type: array, maxItems: 1000, items: {$ref: '#/components/schemas/AgentClientStreamEvent'}}
    CancelAgentRunRequest:
      type: object
      additionalProperties: false
      required: [cancelRequestId, reason]
      properties:
        cancelRequestId: {type: string, format: uuid}
        reason: {type: string, enum: [USER_STOP, CLIENT_DISCONNECTED, PAGE_CLOSED]}
    CancelAgentRunResponse:
      type: object
      additionalProperties: false
      required: [runId, status, accepted, terminal]
      properties:
        runId: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/AgentRunStatus'}
        accepted: {type: boolean}
        terminal: {type: boolean}
        terminalEventSequence: {type: [integer, 'null'], minimum: 1}
    IdentityType:
      type: string
      enum: [PHONE, EMAIL]
    VerificationPurpose:
      type: string
      enum: [REGISTRATION, PASSWORD_RESET, VERIFICATION_LOGIN, IDENTITY_BIND, IDENTITY_REPLACE]
    IdentityChangeOperation:
      type: string
      enum: [BIND, REPLACE]
    ArithmeticCaptchaAnswer:
      type: object
      additionalProperties: false
      required: [captchaId, answer]
      properties:
        captchaId: {type: string, format: uuid}
        answer:
          type: string
          pattern: '^-?[0-9]{1,4}$'
          writeOnly: true
          description: Arithmetic result entered by the user. It is never logged or persisted in MySQL.
    ArithmeticCaptcha:
      type: object
      additionalProperties: false
      required: [captchaId, imageMimeType, imageBase64, expiresIn, refreshesRemaining]
      properties:
        captchaId: {type: string, format: uuid}
        imageMimeType: {type: string, const: image/png}
        imageBase64:
          type: string
          contentEncoding: base64
          description: PNG bytes only. The response, accessible labels and logs never contain the answer as text or metadata.
        expiresIn: {type: integer, minimum: 1, maximum: 180, description: Remaining lifetime in seconds; the configured target is approximately two minutes.}
        refreshesRemaining: {type: integer, minimum: 0, maximum: 5}
    CreateProtectedVerificationChallengeRequest:
      type: object
      additionalProperties: false
      required: [identityType, target, captcha]
      properties:
        identityType: {$ref: '#/components/schemas/IdentityType'}
        target: {type: string, minLength: 3, maxLength: 254, description: Server-normalized email or mainland-China phone input.}
        captcha: {$ref: '#/components/schemas/ArithmeticCaptchaAnswer'}
    VerificationChallenge:
      type: object
      additionalProperties: false
      required: [challengeId, purpose, expiresIn, resendAfter, deliveryHint]
      properties:
        challengeId: {type: string, format: uuid}
        purpose: {$ref: '#/components/schemas/VerificationPurpose'}
        expiresIn: {type: integer, minimum: 1, description: Remaining challenge lifetime in seconds.}
        resendAfter: {type: integer, minimum: 1, description: Minimum delay before another challenge for the same target/purpose.}
        deliveryHint: {type: string, maxLength: 254, description: Masked target only; never a code or account-existence indicator.}
    AuthenticationChannelCapability:
      type: object
      additionalProperties: false
      required: [identityType, passwordLoginAvailable, verificationLoginAvailable, registrationAvailable, verificationDeliveryAvailable]
      properties:
        identityType: {$ref: '#/components/schemas/IdentityType'}
        passwordLoginAvailable: {type: boolean, description: True for already verified identities even when no delivery provider is configured.}
        verificationLoginAvailable: {type: boolean}
        registrationAvailable: {type: boolean}
        verificationDeliveryAvailable: {type: boolean}
    AuthenticationChannelCapabilities:
      type: object
      additionalProperties: false
      required: [channels]
      properties:
        channels:
          type: array
          minItems: 2
          maxItems: 2
          items: {$ref: '#/components/schemas/AuthenticationChannelCapability'}
    ProtocolDocumentType:
      type: string
      enum: [TERMS, PRIVACY]
    ProtocolDocument:
      type: object
      additionalProperties: false
      required: [documentType, version, body, effectiveAt, current, requiresReconsent]
      properties:
        documentType: {$ref: '#/components/schemas/ProtocolDocumentType'}
        version: {type: string, pattern: '^[A-Za-z0-9._-]{1,40}$', description: Immutable version identifier.}
        body: {type: string, minLength: 1, maxLength: 100000, description: Immutable plain Markdown body. Local/test content explicitly states that it cannot be used for a production release.}
        effectiveAt: {type: string, format: date-time}
        current: {type: boolean, const: true}
        requiresReconsent: {type: boolean}
    CurrentProtocolDocuments:
      type: object
      additionalProperties: false
      required: [documents]
      properties:
        documents:
          type: array
          minItems: 2
          maxItems: 2
          items: {$ref: '#/components/schemas/ProtocolDocument'}
    ProtocolAgreementInput:
      type: object
      additionalProperties: false
      required: [documentType, version]
      properties:
        documentType: {$ref: '#/components/schemas/ProtocolDocumentType'}
        version: {type: string, pattern: '^[A-Za-z0-9._-]{1,40}$'}
    RegisterStudentRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId, challengeId, identityType, target, verificationCode, nickname, password, agreements]
      properties:
        clientRequestId: {type: string, format: uuid}
        challengeId: {type: string, format: uuid}
        identityType: {$ref: '#/components/schemas/IdentityType'}
        target: {type: string, minLength: 3, maxLength: 254}
        verificationCode: {type: string, pattern: '^[0-9]{6}$', writeOnly: true}
        nickname:
          type: string
          minLength: 1
          maxLength: 30
          description: Required display nickname containing 1-30 visible characters after trimming. Chinese and duplicate nicknames are allowed; blank text and control characters are rejected. It never participates in authentication.
        password: {type: string, minLength: 12, maxLength: 128, writeOnly: true}
        agreements:
          type: array
          minItems: 2
          maxItems: 2
          items: {$ref: '#/components/schemas/ProtocolAgreementInput'}
    RegistrationResult:
      type: object
      additionalProperties: false
      required: [userId, nickname, roles, permissions, createdAt]
      properties:
        userId: {type: string, format: uuid}
        nickname: {type: string}
        roles: {type: array, items: {$ref: '#/components/schemas/UserRole'}}
        permissions: {type: array, items: {type: string}}
        createdAt: {type: string, format: date-time}
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [challengeId, identityType, target, verificationCode, newPassword]
      properties:
        challengeId: {type: string, format: uuid}
        identityType: {$ref: '#/components/schemas/IdentityType'}
        target: {type: string, minLength: 3, maxLength: 254}
        verificationCode: {type: string, pattern: '^[0-9]{6}$', writeOnly: true}
        newPassword: {type: string, minLength: 12, maxLength: 128, writeOnly: true}
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: {type: string, minLength: 8, maxLength: 128, writeOnly: true}
        newPassword: {type: string, minLength: 12, maxLength: 128, writeOnly: true}
    AccountSession:
      type: object
      additionalProperties: false
      required: [id, deviceName, current, createdAt, lastUsedAt, expiresAt]
      properties:
        id: {type: string, format: uuid}
        deviceName: {type: string, maxLength: 120}
        current: {type: boolean}
        createdAt: {type: string, format: date-time}
        lastUsedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
    VerifiedIdentity:
      type: object
      additionalProperties: false
      required: [identityType, maskedValue, verifiedAt]
      properties:
        identityType: {$ref: '#/components/schemas/IdentityType'}
        maskedValue: {type: string, minLength: 3, maxLength: 254, description: Masked normalized identity; the full email or phone is never returned.}
        verifiedAt: {type: string, format: date-time}
    VerifiedIdentityCollection:
      type: object
      additionalProperties: false
      required: [identities, revision]
      properties:
        identities:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: {$ref: '#/components/schemas/VerifiedIdentity'}
        revision: {type: integer, format: int64, minimum: 0, description: Optimistic identity revision required by every bind, replace and unbind command.}
    CreateIdentityVerificationChallengeRequest:
      type: object
      additionalProperties: false
      required: [operation, identityType, target, currentPassword, expectedRevision]
      properties:
        operation: {$ref: '#/components/schemas/IdentityChangeOperation'}
        identityType: {$ref: '#/components/schemas/IdentityType'}
        target: {type: string, minLength: 3, maxLength: 254}
        currentPassword: {type: string, minLength: 8, maxLength: 128, writeOnly: true}
        expectedRevision: {type: integer, format: int64, minimum: 0}
    BindIdentityRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId, expectedRevision, challengeId, identityType, target, verificationCode, currentPassword]
      properties:
        clientRequestId: {type: string, format: uuid}
        expectedRevision: {type: integer, format: int64, minimum: 0}
        challengeId: {type: string, format: uuid}
        identityType: {$ref: '#/components/schemas/IdentityType'}
        target: {type: string, minLength: 3, maxLength: 254}
        verificationCode: {type: string, pattern: '^[0-9]{6}$', writeOnly: true}
        currentPassword: {type: string, minLength: 8, maxLength: 128, writeOnly: true}
    ReplaceIdentityRequest:
      allOf:
        - $ref: '#/components/schemas/BindIdentityRequest'
      description: identityType must match the path and the consumed challenge must be bound to IDENTITY_REPLACE.
    UnbindIdentityRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId, expectedRevision, currentPassword]
      properties:
        clientRequestId: {type: string, format: uuid}
        expectedRevision: {type: integer, format: int64, minimum: 0}
        currentPassword: {type: string, minLength: 8, maxLength: 128, writeOnly: true}
    IdentityMutationResult:
      type: object
      additionalProperties: false
      required: [identities, revision, sessionVersion, revokedSessionScope, reauthenticationRequired, session]
      properties:
        identities:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items: {$ref: '#/components/schemas/VerifiedIdentity'}
        revision: {type: integer, format: int64, minimum: 0}
        sessionVersion: {type: integer, format: int64, minimum: 0}
        revokedSessionScope: {type: string, enum: [OTHER_DEVICES, ALL_DEVICES]}
        reauthenticationRequired: {type: boolean}
        session:
          anyOf:
            - $ref: '#/components/schemas/LoginResponse'
            - type: 'null'
          description: Non-null only after binding a second identity; clients replace their in-memory Access Token. Replace/unbind return null and require login.
    TeacherApplicationStatus:
      type: string
      enum: [SUBMITTED, UNDER_REVIEW, APPROVED, REJECTED]
      description: T12D creates SUBMITTED only. T16 owns every review transition and the accompanying capability grant.
    SubmitTeacherApplicationRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId, expectedRevision, qualificationMediaId, statement]
      properties:
        clientRequestId: {type: string, format: uuid}
        expectedRevision: {type: [integer, 'null'], format: int64, minimum: 0, description: Null for the first submission; required current revision for a rejected resubmission.}
        qualificationMediaId: {type: string, format: uuid, description: Caller-owned READY TEACHER_QUALIFICATION asset.}
        statement: {type: string, minLength: 20, maxLength: 2000}
    TeacherApplication:
      type: object
      additionalProperties: false
      required: [id, userId, qualificationMediaId, statement, status, revision, submittedAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        userId: {type: string, format: uuid}
        qualificationMediaId: {type: string, format: uuid}
        statement: {type: string}
        status: {$ref: '#/components/schemas/TeacherApplicationStatus'}
        rejectionReason: {type: [string, 'null'], maxLength: 1000}
        revision: {type: integer, format: int64, minimum: 0}
        submittedAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    AccountStatus:
      type: string
      enum: [ACTIVE, DISABLED]
      description: Short-term login lock is Redis security state and is projected separately as loginLocked.
    AdminUser:
      type: object
      additionalProperties: false
      required: [id, account, displayName, maskedIdentities, status, loginLocked, roles, permissions, sessionVersion, revision, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        account: {type: string}
        displayName: {type: string, minLength: 1, maxLength: 30, description: Non-unique nickname; never a login identifier.}
        maskedIdentities: {type: array, items: {type: string}}
        status: {$ref: '#/components/schemas/AccountStatus'}
        loginLocked: {type: boolean}
        roles: {type: array, items: {$ref: '#/components/schemas/UserRole'}}
        permissions: {type: array, items: {type: string}}
        sessionVersion: {type: integer, format: int64, minimum: 0}
        revision: {type: integer, format: int64, minimum: 0}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    AdminUserPage:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AdminUser'}}
        page: {type: integer, minimum: 1}
        size: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, format: int64, minimum: 0}
    AdminAccountCommandRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId, expectedRevision, reason]
      properties:
        clientRequestId: {type: string, format: uuid}
        expectedRevision: {type: integer, format: int64, minimum: 0}
        reason: {type: string, minLength: 10, maxLength: 500}
    AdminAccountCommandResult:
      type: object
      additionalProperties: false
      required: [user, replayed]
      properties:
        user: {$ref: '#/components/schemas/AdminUser'}
        replayed: {type: boolean}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [identity, password]
      properties:
        identity:
          type: string
          minLength: 3
          maxLength: 254
          description: Verified email or mainland-China phone only. The server normalizes it before lookup; nickname and internal account are rejected as login identifiers.
        password:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
        captcha:
          anyOf:
            - $ref: '#/components/schemas/ArithmeticCaptchaAnswer'
            - type: 'null'
          description: Omitted for password attempts one through three; required before password verification on attempts four and five.
        deviceId:
          type: [string, 'null']
          format: uuid
          description: Optional installation identifier used only to label Refresh Sessions; it is not trusted for authorization.
        deviceName:
          type: [string, 'null']
          maxLength: 120
          description: User-visible device label after control-character removal.
    VerificationCodeLoginRequest:
      type: object
      additionalProperties: false
      required: [challengeId, identityType, target, verificationCode]
      properties:
        challengeId: {type: string, format: uuid}
        identityType: {$ref: '#/components/schemas/IdentityType'}
        target: {type: string, minLength: 3, maxLength: 254}
        verificationCode: {type: string, pattern: '^[0-9]{6}$', writeOnly: true}
        deviceId:
          type: [string, 'null']
          format: uuid
          description: Optional installation identifier used only to label Refresh Sessions; it is not trusted for authorization.
        deviceName:
          type: [string, 'null']
          maxLength: 120
          description: User-visible device label after control-character removal.
    LoginResponse:
      type: object
      additionalProperties: false
      required: [tokenType, accessToken, expiresIn]
      properties:
        tokenType:
          type: string
          const: Bearer
        accessToken:
          type: string
        expiresIn:
          type: integer
          minimum: 1
          description: Access token lifetime in seconds.
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, displayName, roles, permissions, sessionVersion]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 30
          description: User nickname. It may contain Chinese characters and duplicate another user's nickname, and it is never accepted as a login identity.
        avatarUrl:
          type: [string, 'null']
          format: uri
        roles:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/UserRole'
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
        sessionVersion:
          type: integer
          format: int64
          minimum: 0
          description: Persistent account session generation. Clients must not infer authorization decisions from this value.
    UserRole:
      type: string
      enum: [STUDENT, TEACHER, ADMIN]
    CoursePage:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CourseSummary'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
          format: int64
    CourseSummary:
      type: object
      additionalProperties: false
      required: [id, title, summary, coverMediaId, coverUrl, teacher, category, level, accessType]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 120
        summary:
          type: string
          maxLength: 300
        coverMediaId:
          type: [string, 'null']
          format: uuid
          description: Stable COURSE_COVER media reference for the immutable published version; null only for legacy or intentionally unbound courses.
        coverUrl:
          type: [string, 'null']
          format: uri
          readOnly: true
          description: Read-only display projection. Historical external URLs may appear during migration; signed URLs are transient and must not be persisted.
        teacher:
          $ref: '#/components/schemas/TeacherSummary'
        category:
          $ref: '#/components/schemas/CategorySummary'
        level:
          $ref: '#/components/schemas/CourseLevel'
        accessType:
          $ref: '#/components/schemas/CourseAccessType'
    CourseDetail:
      type: object
      additionalProperties: false
      required: [id, title, summary, description, coverUrl, teacher, category, level, accessType, publishedVersion, chapters]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 120
        summary:
          type: string
          maxLength: 300
        description:
          type: string
          description: Markdown course description.
        coverMediaId:
          type: [string, 'null']
          format: uuid
          deprecated: true
          description: Legacy compatibility field. Public CourseDetail responses no longer emit stable media identifiers; use coverUrl only as a transient authorized display projection.
        coverUrl:
          type: [string, 'null']
          format: uri
          readOnly: true
          description: Historical or authorized display projection; never a course write fact.
        teacher:
          $ref: '#/components/schemas/TeacherSummary'
        category:
          $ref: '#/components/schemas/CategorySummary'
        level:
          $ref: '#/components/schemas/CourseLevel'
        accessType:
          $ref: '#/components/schemas/CourseAccessType'
        publishedVersion:
          type: string
        chapters:
          type: array
          items:
            $ref: '#/components/schemas/Chapter'
    TeacherSummary:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 80
    CategorySummary:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 50
    CourseLevel:
      type: string
      enum: [BEGINNER, INTERMEDIATE, ADVANCED]
    CourseAccessType:
      type: string
      enum: [PUBLIC, ENROLLMENT_REQUIRED]
    CoursePublicationStatus:
      type: string
      enum: [DRAFT, PUBLISHED, UNPUBLISHED]
    Chapter:
      type: object
      additionalProperties: false
      required: [id, title, sequence, lessons]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 120
        sequence:
          type: integer
          minimum: 1
        lessons:
          type: array
          items:
            $ref: '#/components/schemas/LessonSummary'
    LessonSummary:
      type: object
      additionalProperties: false
      required: [id, title, type, sequence, previewable]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 120
        type:
          type: string
          enum: [VIDEO, ARTICLE, ASSESSMENT]
        sequence:
          type: integer
          minimum: 1
        previewable:
          type: boolean
        articleMarkdown:
          type: string
          description: Full controlled Markdown returned only in authenticated teacher draft/editor projections. Public CourseDetail responses omit this field.
        resources:
          type: array
          deprecated: true
          description: Legacy teacher/editor compatibility projection. Public CourseDetail responses omit this field; authenticated clients must use the protected lesson-content endpoint and course-owned resource row IDs.
          items:
            $ref: '#/components/schemas/LessonMediaResource'
    CreateCourseRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId, title, summary, description, coverMediaId, instructorDisplayName, categoryId, level, accessType]
      properties:
        clientRequestId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 120
        summary:
          type: string
          maxLength: 300
        description:
          type: string
          maxLength: 20000
        coverMediaId:
          type: [string, 'null']
          format: uuid
          description: READY COURSE_COVER owned by the current teacher. Null creates a course without a cover; coverUrl is intentionally not accepted for writes.
        instructorDisplayName:
          type: string
          minLength: 1
          maxLength: 80
          description: Course byline content; ownership is always taken from the trusted authenticated user ID.
        categoryId:
          type: string
          format: uuid
        level:
          $ref: '#/components/schemas/CourseLevel'
        accessType:
          $ref: '#/components/schemas/CourseAccessType'
    UpdateCourseRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, title, summary, description, coverMediaId, instructorDisplayName, categoryId, level, accessType]
      properties:
        expectedRevision:
          type: integer
          minimum: 0
          format: int64
        title:
          type: string
          minLength: 1
          maxLength: 120
        summary:
          type: string
          maxLength: 300
        description:
          type: string
          maxLength: 20000
        coverMediaId:
          type: [string, 'null']
          format: uuid
          description: Replacement READY COURSE_COVER media ID. Null atomically releases the draft cover reference; historical coverUrl is not writable.
        instructorDisplayName:
          type: string
          minLength: 1
          maxLength: 80
        categoryId:
          type: string
          format: uuid
        level:
          $ref: '#/components/schemas/CourseLevel'
        accessType:
          $ref: '#/components/schemas/CourseAccessType'
    ReplaceCurriculumRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, chapters]
      properties:
        expectedRevision:
          type: integer
          minimum: 0
          format: int64
        chapters:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ChapterInput'
    ChapterInput:
      type: object
      additionalProperties: false
      required: [title, sequence, lessons]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        sequence:
          type: integer
          minimum: 1
        lessons:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/LessonInput'
    LessonInput:
      type: object
      additionalProperties: false
      required: [title, type, sequence, previewable]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        type:
          type: string
          enum: [VIDEO, ARTICLE, ASSESSMENT]
        sequence:
          type: integer
          minimum: 1
        previewable:
          type: boolean
        articleMarkdown:
          type: [string, 'null']
          description: Controlled ARTICLE source, with at most 100,000 visible Unicode characters. Supports headings, lists, tables, fenced/inline code, HTTPS links, LaTeX and `![required alt](media:UUID)`. Raw HTML/iframe, data URLs, external images, dangerous protocols and malformed media placeholders are rejected immediately. Non-ARTICLE types discard a safe supplied value from persisted content.
        resources:
          type: array
          maxItems: 100
          default: []
          description: Stable media bindings for this lesson. Omission is equivalent to an empty list for T05 client compatibility.
          items:
            $ref: '#/components/schemas/LessonMediaResourceInput'
    LessonMediaPurpose:
      type: string
      description: Course-owned lesson purposes enabled by an explicit binding policy. ARTICLE_IMAGE is always INLINE and may appear only in ARTICLE Markdown placeholders.
      enum: [LESSON_VIDEO, VIDEO_POSTER, SUBTITLE, COURSEWARE, ARTICLE_ATTACHMENT, ARTICLE_IMAGE]
    LessonMediaResourceInput:
      type: object
      additionalProperties: false
      required: [mediaId, purpose, sequence]
      properties:
        mediaId:
          type: string
          format: uuid
          description: READY asset owned by the current teacher and validated by media-service before the course transaction commits.
        purpose:
          $ref: '#/components/schemas/LessonMediaPurpose'
        sequence:
          type: integer
          minimum: 1
          maximum: 100
          description: Ordering within the same purpose; values must be unique and contiguous from 1.
        displayName:
          type: [string, 'null']
          minLength: 1
          maxLength: 120
          description: Optional teacher-facing name. Omission/blank input is normalized to the safe original filename returned by media-service at binding time.
        presentation:
          oneOf:
            - $ref: '#/components/schemas/LessonResourcePresentation'
            - type: 'null'
          description: Preferred primary action. ARTICLE_IMAGE is forced to INLINE; PPTX/TXT are forced to DOWNLOAD. Omission uses the server's safe purpose/MIME default for compatibility.
    LessonMediaResource:
      type: object
      additionalProperties: false
      required: [id, mediaId, purpose, sequence, displayName, presentation, originalFileName, mimeType, size]
      properties:
        id:
          type: string
          format: uuid
          description: Course-domain reference row ID, not a media-service asset ID.
        mediaId:
          type: string
          format: uuid
        purpose:
          $ref: '#/components/schemas/LessonMediaPurpose'
        sequence:
          type: integer
          minimum: 1
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        presentation:
          $ref: '#/components/schemas/LessonResourcePresentation'
        originalFileName:
          type: string
          minLength: 1
          maxLength: 255
          description: Immutable safe filename snapshot captured from media-service when bound.
        mimeType:
          type: string
          minLength: 3
          maxLength: 127
          description: Immutable MIME snapshot captured at binding time.
        size:
          type: integer
          format: int64
          minimum: 1
          description: Immutable byte-size snapshot captured at binding time.
    LessonResourcePresentation:
      type: string
      enum: [INLINE, DOWNLOAD]
    CourseResourceAction:
      type: string
      enum: [PREVIEW, DOWNLOAD]
    CreateCourseResourceAccessGrantRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          $ref: '#/components/schemas/CourseResourceAction'
    LessonContent:
      type: object
      additionalProperties: false
      required: [courseId, courseVersionId, lessonId, title, type, previewable, articleMarkdown, playbackResourceId, poster, inlineImages, resources]
      properties:
        courseId: {type: string, format: uuid}
        courseVersionId:
          type: string
          minLength: 1
          maxLength: 64
          description: Authorized published course-version identity used by Agent retrieval and stale-index checks.
        lessonId: {type: string, format: uuid}
        title: {type: string, minLength: 1, maxLength: 120}
        type: {type: string, enum: [VIDEO, ARTICLE, ASSESSMENT]}
        previewable: {type: boolean}
        articleMarkdown:
          type: [string, 'null']
          description: Full controlled source only for ARTICLE; null for VIDEO/ASSESSMENT. media:UUID values are usable only with the matching inlineImages grants in this response.
        playbackResourceId:
          type: [string, 'null']
          format: uuid
          description: Course-domain LESSON_VIDEO row ID for the existing playback-grant endpoint; never a mediaId.
        poster:
          oneOf:
            - $ref: '#/components/schemas/CourseMediaAccessGrant'
            - type: 'null'
          description: Effective custom VIDEO_POSTER or automatic poster-v1 grant. Historical videos without either return null so the client may use one fixed placeholder.
        inlineImages:
          type: array
          items: {$ref: '#/components/schemas/LessonInlineImage'}
        resources:
          type: array
          description: Safe COURSEWARE/ARTICLE_ATTACHMENT projections. VIDEO, poster, subtitle and ARTICLE_IMAGE bindings are not downloadable through this list.
          items: {$ref: '#/components/schemas/LessonContentResource'}
    LessonInlineImage:
      type: object
      additionalProperties: false
      required: [resourceId, mediaId, grant]
      properties:
        resourceId: {type: string, format: uuid}
        mediaId:
          type: string
          format: uuid
          description: Matches the controlled media:UUID placeholder; it is not accepted by any browser-facing authorization endpoint.
        grant: {$ref: '#/components/schemas/CourseMediaAccessGrant'}
    TeacherArticleContent:
      type: object
      additionalProperties: false
      required: [courseId, lessonId, articleMarkdown, inlineImages]
      description: Minimal current-editor ARTICLE projection. It intentionally omits ordinary resources and storage internals.
      properties:
        courseId: {type: string, format: uuid}
        lessonId: {type: string, format: uuid}
        articleMarkdown:
          type: string
          description: Saved controlled ARTICLE source. Every media:UUID placeholder must have exactly one matching inlineImages item.
        inlineImages:
          type: array
          items: {$ref: '#/components/schemas/TeacherArticleInlineImage'}
    TeacherArticleInlineImage:
      type: object
      additionalProperties: false
      required: [mediaId, grant]
      properties:
        mediaId:
          type: string
          format: uuid
          description: Stable ID parsed from the saved Markdown. No browser-facing endpoint accepts it to mint a grant.
        grant:
          allOf:
            - $ref: '#/components/schemas/CourseMediaAccessGrant'
          description: Fresh short-lived ORIGINAL/INLINE grant issued after owner and current-version authorization.
    LessonContentResource:
      type: object
      additionalProperties: false
      required: [id, purpose, displayName, presentation, originalFileName, mimeType, size, actions]
      properties:
        id: {type: string, format: uuid}
        purpose: {type: string, enum: [COURSEWARE, ARTICLE_ATTACHMENT]}
        displayName: {type: string, minLength: 1, maxLength: 120}
        presentation: {$ref: '#/components/schemas/LessonResourcePresentation'}
        originalFileName: {type: string, minLength: 1, maxLength: 255}
        mimeType: {type: string, minLength: 3, maxLength: 127}
        size: {type: integer, format: int64, minimum: 1}
        actions:
          type: array
          uniqueItems: true
          minItems: 1
          items: {$ref: '#/components/schemas/CourseResourceAction'}
    UpdatePublicationRequest:
      type: object
      additionalProperties: false
      required: [status, expectedRevision]
      properties:
        status:
          type: string
          enum: [PUBLISHED, UNPUBLISHED]
        expectedRevision:
          type: integer
          minimum: 0
          format: int64
    TeacherCourse:
      type: object
      additionalProperties: false
      required: [id, publicationStatus, hasUnpublishedChanges, version, revision, title, summary, description, coverMediaId, coverUrl, instructorDisplayName, category, level, accessType, chapters, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        publicationStatus:
          $ref: '#/components/schemas/CoursePublicationStatus'
        hasUnpublishedChanges:
          type: boolean
        publishedVersion:
          type: [string, 'null']
        draftVersion:
          type: [string, 'null']
        version:
          type: string
        revision:
          type: integer
          minimum: 0
          format: int64
        title:
          type: string
        summary:
          type: string
        description:
          type: string
        coverMediaId:
          type: [string, 'null']
          format: uuid
          description: Stable COURSE_COVER reference of the editable version.
        coverUrl:
          type: [string, 'null']
          format: uri
          readOnly: true
          description: Historical read compatibility or an authorized display projection; never accepted by create/update writes.
        instructorDisplayName:
          type: string
        category:
          $ref: '#/components/schemas/CategorySummary'
        level:
          $ref: '#/components/schemas/CourseLevel'
        accessType:
          $ref: '#/components/schemas/CourseAccessType'
        chapters:
          type: array
          items:
            $ref: '#/components/schemas/Chapter'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TeacherCoursePage:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TeacherCourse'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
          format: int64
    CoursePublication:
      type: object
      additionalProperties: false
      required: [id, status, hasUnpublishedChanges, revision, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/CoursePublicationStatus'
        publishedVersion:
          type: [string, 'null']
        draftVersion:
          type: [string, 'null']
        hasUnpublishedChanges:
          type: boolean
        revision:
          type: integer
          minimum: 0
          format: int64
        updatedAt:
          type: string
          format: date-time
    QuestionStage:
      type: string
      enum: [PRIMARY, JUNIOR]
    QuestionGrade:
      type: string
      enum: [ONE, TWO, THREE, FOUR, FIVE, SIX, SEVEN, EIGHT, NINE]
    QuestionSubject:
      type: string
      enum: [MATHEMATICS]
    QuestionType:
      type: string
      enum: [SINGLE_CHOICE, MULTIPLE_CHOICE, TRUE_FALSE, FILL_BLANK, SHORT_ANSWER, COMPOSITE]
    QuestionInputType:
      type: string
      description: Ordinary leaf type. Composite children cannot themselves be composite.
      enum: [SINGLE_CHOICE, MULTIPLE_CHOICE, TRUE_FALSE, FILL_BLANK, SHORT_ANSWER]
    QuestionDifficulty:
      type: string
      enum: [EASY, MEDIUM, HARD]
    QuestionStatus:
      type: string
      enum: [DRAFT, ACTIVE, ARCHIVED]
    QuestionScope:
      type: string
      description: SYSTEM is the administrator-owned public bank; TEACHER is private to its creating teacher.
      enum: [SYSTEM, TEACHER]
    QuestionMediaPurpose:
      type: string
      enum: [QUESTION_IMAGE, QUESTION_AUDIO, QUESTION_ATTACHMENT]
    KnowledgePoint:
      type: object
      additionalProperties: false
      required: [id, code, name, parentId, stage, grade, subject, sortOrder, enabled, revision, children]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          pattern: '^((PRIMARY|JUNIOR)_MATH_[A-Z0-9_]{2,50}|KG_[a-f0-9]{32})$'
        name:
          type: string
          minLength: 1
          maxLength: 100
        parentId:
          type: [string, 'null']
          format: uuid
        stage:
          $ref: '#/components/schemas/QuestionStage'
        grade:
          description: Null means the knowledge point applies to the confirmed whole stage because the source has no grade field.
          oneOf:
            - {$ref: '#/components/schemas/QuestionGrade'}
            - {type: 'null'}
        subject:
          $ref: '#/components/schemas/QuestionSubject'
        sortOrder:

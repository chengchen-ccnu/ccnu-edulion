contract: edu.course.lesson-content.events
contractVersion: 1
contentType: application/json
exchange: edu.course.lesson-content.events.v1
compatibility: backward
producer: course-service publication transaction
consumers:
  - learning-service current published lesson content projection
deliverySemantics: at-least-once; producer uses a local transactional Outbox and learning-service persists eventId before ACK
description: |
  T12C.0 published lesson content identity contract. Course-service assigns every lesson a UUID contentRevisionId
  without hashing content. Publishing commits one complete current mapping and this Outbox event in the same
  transaction. VIDEO main-resource replacement, removal or rebinding (including A to B to A), lesson type changes,
  and delete/recreate generate a new identity. Title, order, description, poster, ordinary courseware/attachments,
  and ARTICLE body/image/attachment changes retain it. The payload contains no learning facts, mediaId, content,
  signed URL, Bucket or Object Key.

x-consumer-semantics:
  idempotencyKey: eventId
  orderingKey: payload.courseId
  versionField: payload.publicationRevision
  staleEventRule: IGNORE_WHEN_PUBLICATION_REVISION_IS_LOWER
  sameRevisionRule: RETAIN_FIRST_EVENT_PROJECTION_AND_RECORD_LATER_EVENT_ID_AS_NOOP
  retry: three-total-attempts-then-dlq
  exactlyOnceClaimed: false

envelope:
  type: object
  additionalProperties: false
  required: [eventId, eventType, eventVersion, aggregateId, occurredAt, traceId, payload]
  properties:
    eventId: {type: string, format: uuid}
    eventType: {type: string, const: PublishedLessonContentChanged}
    eventVersion: {type: integer, const: 1}
    aggregateId:
      type: string
      format: uuid
      description: courseId; all lesson mappings for one publication are replaced atomically by the consumer.
    occurredAt: {type: string, format: date-time}
    traceId: {type: string, minLength: 8, maxLength: 64}
    payload: {$ref: '#/events/PublishedLessonContentChanged/payload'}

events:
  PublishedLessonContentChanged:
    routingKey: course.lesson-content.published.v1
    aggregate: course
    payload:
      type: object
      additionalProperties: false
      required: [courseId, courseVersionId, publicationRevision, lessons]
      properties:
        courseId: {type: string, format: uuid}
        courseVersionId:
          type: string
          format: uuid
          description: Immutable Course version row identity; it is not the content revision identity.
        publicationRevision:
          type: integer
          minimum: 1
          description: Monotonic course version number used only for stale-event rejection.
        lessons:
          type: array
          maxItems: 20000
          items:
            type: object
            additionalProperties: false
            required: [lessonId, contentRevisionId, lessonType]
            properties:
              lessonId: {type: string, format: uuid}
              contentRevisionId:
                type: string
                format: uuid
                description: Course-issued progress identity; never generated by Learning or the browser.
              lessonType: {type: string, enum: [VIDEO, ARTICLE, ASSESSMENT]}

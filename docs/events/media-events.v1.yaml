contract: edu.media.events
contractVersion: 1
contentType: application/json
exchange: edu.media.events.v1
compatibility: backward
producer: media-service
consumers:
  - media-service processing worker
  - media-service reference ledger
  - version-compatible downstream domain services
deliverySemantics: at-least-once; consumers persist eventId before ACK
description: |
  T07 media-domain events. Producers may add optional payload fields in version 1,
  but removing/renaming fields, changing required fields or changing semantics requires
  a new eventVersion and routing key. Events are created in the same local transaction as
  the media fact via Outbox; storage keys, credentials and signed URLs are forbidden.

envelope:
  type: object
  additionalProperties: false
  required: [eventId, eventType, eventVersion, aggregateId, occurredAt, traceId, payload]
  properties:
    eventId:
      type: string
      format: uuid
      description: Global idempotency key persisted by every consumer.
    eventType:
      type: string
      description: Stable event name used with eventVersion to select the consumer handler.
      enum:
        - MediaUploaded
        - MediaReady
        - MediaRejected
        - MediaFailed
        - MediaDeleted
        - MediaReferenceBound
        - MediaReferenceReleased
    eventVersion:
      type: integer
      const: 1
      description: Envelope and payload semantics version; incompatible changes require a new version and routing key.
    aggregateId:
      type: string
      format: uuid
      description: mediaId for every T07 media event.
    occurredAt:
      type: string
      format: date-time
      description: UTC time when the media fact committed, not the later RabbitMQ publish or consume time.
    traceId:
      type: string
      minLength: 8
      maxLength: 64
      description: Correlates the originating request, local transaction, Outbox delivery and consumer logs.
    payload:
      type: object
      description: Event-specific projection; credentials, object keys and signed URLs are forbidden.

events:
  MediaUploaded:
    routingKey: media.uploaded.v1
    aggregate: media_asset
    description: Emitted after OSS metadata verification and media/upload/processing-job facts commit in one local transaction.
    payload:
      type: object
      additionalProperties: false
      required: [mediaId, purpose, ownerId, mimeType, size, sha256]
      properties:
        mediaId:
          type: string
          format: uuid
        purpose:
          $ref: '#/definitions/MediaPurpose'
        ownerId:
          type: string
          format: uuid
          description: Uploader identity for audit only; consumers must not infer domain visibility from it.
        mimeType:
          type: string
        size:
          type: integer
          format: int64
          minimum: 1
        sha256:
          type: string
          pattern: '^[a-fA-F0-9]{64}$'
          description: Client-declared and server-verified content digest; never a credential or object key.
  MediaReady:
    routingKey: media.ready.v1
    aggregate: media_asset
    description: Emitted once processing succeeds and the original asset plus derived variants are ready for authorized projection.
    payload:
      type: object
      additionalProperties: false
      required: [mediaId, purpose, status, variants]
      properties:
        mediaId:
          type: string
          format: uuid
        purpose:
          $ref: '#/definitions/MediaPurpose'
        status:
          type: string
          const: READY
        variants:
          type: array
          items:
            $ref: '#/definitions/MediaVariant'
  MediaRejected:
    routingKey: media.rejected.v1
    aggregate: media_asset
    description: Permanent validation rejection after upload confirmation; repeating the source event is deduplicated by eventId.
    payload:
      type: object
      additionalProperties: false
      required: [mediaId, purpose, errorCode, reason]
      properties:
        mediaId:
          type: string
          format: uuid
        purpose:
          $ref: '#/definitions/MediaPurpose'
        errorCode:
          type: string
          pattern: '^MEDIA\.[A-Z][A-Z0-9_]*$'
        reason:
          type: string
          maxLength: 500
  MediaFailed:
    routingKey: media.failed.v1
    aggregate: media_asset
    description: Processing failure after finite retries; retryable indicates whether operators may repair and replay the source event.
    payload:
      type: object
      additionalProperties: false
      required: [mediaId, purpose, errorCode, reason, retryable]
      properties:
        mediaId:
          type: string
          format: uuid
        purpose:
          $ref: '#/definitions/MediaPurpose'
        errorCode:
          type: string
          pattern: '^MEDIA\.[A-Z][A-Z0-9_]*$'
        reason:
          type: string
          maxLength: 500
        retryable:
          type: boolean
  MediaDeleted:
    routingKey: media.deleted.v1
    aggregate: media_asset
    description: Emitted after exact recorded object keys are deleted and the asset reaches the terminal DELETED state.
    payload:
      type: object
      additionalProperties: false
      required: [mediaId, purpose, reason]
      properties:
        mediaId:
          type: string
          format: uuid
        purpose:
          $ref: '#/definitions/MediaPurpose'
        reason:
          type: string
          enum: [UNBOUND_RETENTION_EXPIRED, EXPLICIT_RETENTION_EXPIRED]
  MediaReferenceBound:
    routingKey: media.reference.bound.v1
    aggregate: media_asset
    producer: owning-domain-service
    description: Idempotently records that one domain entity retains a stable mediaId; it does not grant read access by itself.
    payload:
      type: object
      additionalProperties: false
      required: [mediaId, ownerService, referenceType, referenceId]
      properties:
        mediaId:
          type: string
          format: uuid
        ownerService:
          $ref: '#/definitions/OwnerService'
        referenceType:
          type: string
          minLength: 1
          maxLength: 80
        referenceId:
          type: string
          minLength: 1
          maxLength: 128
  MediaReferenceReleased:
    routingKey: media.reference.released.v1
    aggregate: media_asset
    producer: owning-domain-service
    description: Idempotently removes one exact domain reference; retention expiry, not this event alone, controls reclamation.
    payload:
      type: object
      additionalProperties: false
      required: [mediaId, ownerService, referenceType, referenceId]
      properties:
        mediaId:
          type: string
          format: uuid
        ownerService:
          $ref: '#/definitions/OwnerService'
        referenceType:
          type: string
          minLength: 1
          maxLength: 80
        referenceId:
          type: string
          minLength: 1
          maxLength: 128

definitions:
  MediaPurpose:
    type: string
    description: Stable business usage that selects upload policy; it never authorizes domain visibility.
    enum:
      - COURSE_COVER
      - LESSON_VIDEO
      - VIDEO_POSTER
      - SUBTITLE
      - COURSEWARE
      - ARTICLE_ATTACHMENT
      - QUESTION_IMAGE
      - QUESTION_AUDIO
      - QUESTION_ATTACHMENT
      - QUESTION_IMPORT_SOURCE
      - AI_QUESTION_IMAGE
      - USER_AVATAR
      - TEACHER_QUALIFICATION
      - BANNER_IMAGE
      - TOPIC_COVER
      - REPORT_EXPORT
  OwnerService:
    type: string
    description: Domain owning the referencing entity; combined with referenceType/referenceId as the idempotency tuple.
    enum: [course-service, learning-service, iam-service, agent-access, operation-service]
  MediaVariant:
    type: object
    description: Safe metadata for one processed derivative; object keys and access URLs remain internal to media-service.
    additionalProperties: false
    required: [variant, mimeType, size]
    properties:
      variant:
        type: string
        maxLength: 80
      mimeType:
        type: string
      size:
        type: integer
        format: int64
        minimum: 0

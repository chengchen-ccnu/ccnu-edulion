spring:
  datasource:
    url: jdbc:h2:mem:iam_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration

platform:
  iam:
    account-permissions:
      worker-enabled: false
    security-store: memory
    jwt:
      issuer: edu-platform-iam-test
      audience: edu-platform-gateway-test
      secret: test-only-secret-with-at-least-32-bytes
      access-ttl: 2m
    refresh:
      ttl: 10m
      cookie-secure: false
    login-rate-limit:
      attempts: 5
      window: 15m
    verification:
      ttl: 10m
      cooldown: 1ms
      max-attempts: 5
      delivery-mode: fixed-local
      fixed-code: "246810"
      hmac-secret: test-only-verification-hmac-secret-32-bytes
      smtp-from: ""
    captcha:
      ttl: 2m
      max-attempts: 3
      max-refreshes: 2
    session-cache:
      key-prefix: edu:iam:session-version
      ttl: 20m
    media:
      base-url: http://127.0.0.1:9
      request-timeout: 100ms
      authorization-secret: test-only-course-media-authorization-secret-32-bytes
    seed:
      enabled: false
      password: ""
    review:
      messaging-enabled: false
      retention-enabled: false

spring:
  application:
    name: iam-service
  flyway:
    enabled: false
  jackson:
    default-property-inclusion: non_null
mybatis:
  configuration:
    map-underscore-to-camel-case: true
server:
  port: ${SERVER_PORT:8081}
management:
  endpoints:
    web:
      exposure:
        include: health,info
platform:
  iam:
    jwt:
      issuer: ${IAM_JWT_ISSUER:edu-platform-iam}
      audience: ${IAM_JWT_AUDIENCE:edu-platform-gateway}
      secret: ${IAM_JWT_SECRET:}
      access-ttl: ${IAM_ACCESS_TOKEN_TTL:15m}
    refresh:
      ttl: ${IAM_REFRESH_TOKEN_TTL:7d}
      cookie-secure: ${IAM_REFRESH_COOKIE_SECURE:true}
    login-rate-limit:
      attempts: ${IAM_LOGIN_RATE_LIMIT_ATTEMPTS:5}
      window: ${IAM_LOGIN_RATE_LIMIT_WINDOW:15m}

---
spring:
  config:
    activate:
      on-profile: "!local & !test"
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration

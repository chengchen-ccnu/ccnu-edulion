spring:
  application:
    name: iam-service
  mail:
    host: ${IAM_SMTP_HOST:localhost}
    port: ${IAM_SMTP_PORT:587}
    username: ${IAM_SMTP_USERNAME:}
    password: ${IAM_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${IAM_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${IAM_SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${IAM_SMTP_STARTTLS_REQUIRED:true}
      mail.smtp.connectiontimeout: ${IAM_SMTP_CONNECTION_TIMEOUT_MS:5000}
      mail.smtp.timeout: ${IAM_SMTP_TIMEOUT_MS:5000}
      mail.smtp.writetimeout: ${IAM_SMTP_WRITE_TIMEOUT_MS:5000}
  flyway:
    enabled: false
  jackson:
    default-property-inclusion: non_null
mybatis:
  configuration:
    map-underscore-to-camel-case: true
server:
  port: ${SERVER_PORT:8081}
management:
  endpoints:
    web:
      exposure:
        include: health,info
platform:
  iam:
    jwt:
      issuer: ${IAM_JWT_ISSUER:edu-platform-iam}
      audience: ${IAM_JWT_AUDIENCE:edu-platform-gateway}
      secret: ${IAM_JWT_SECRET:}
      access-ttl: ${IAM_ACCESS_TOKEN_TTL:15m}
    refresh:
      ttl: ${IAM_REFRESH_TOKEN_TTL:7d}
      cookie-secure: ${IAM_REFRESH_COOKIE_SECURE:true}
    login-rate-limit:
      attempts: ${IAM_LOGIN_RATE_LIMIT_ATTEMPTS:5}
      window: ${IAM_LOGIN_RATE_LIMIT_WINDOW:15m}
    security-store: ${IAM_SECURITY_STORE:redis}
    verification:
      ttl: ${IAM_VERIFICATION_TTL:10m}
      cooldown: ${IAM_VERIFICATION_COOLDOWN:60s}
      max-attempts: ${IAM_VERIFICATION_MAX_ATTEMPTS:5}
      delivery-mode: ${IAM_VERIFICATION_DELIVERY_MODE:disabled}
      fixed-code: ${IAM_VERIFICATION_FIXED_CODE:}
      hmac-secret: ${IAM_VERIFICATION_HMAC_SECRET:}
      smtp-from: ${IAM_SMTP_FROM:}
    captcha:
      ttl: ${IAM_CAPTCHA_TTL:2m}
      max-attempts: ${IAM_CAPTCHA_MAX_ATTEMPTS:5}
      max-refreshes: ${IAM_CAPTCHA_MAX_REFRESHES:3}
    session-cache:
      key-prefix: ${IAM_SESSION_VERSION_KEY_PREFIX:edu:iam:session-version}
      ttl: ${IAM_SESSION_VERSION_CACHE_TTL:20m}
    media:
      base-url: ${MEDIA_SERVICE_BASE_URL:http://127.0.0.1:8083}
      request-timeout: ${IAM_MEDIA_REQUEST_TIMEOUT:5s}
    internal:
      service-token: ${IAM_INTERNAL_SERVICE_TOKEN:}

---
spring:
  config:
    activate:
      on-profile: "!local & !test"
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

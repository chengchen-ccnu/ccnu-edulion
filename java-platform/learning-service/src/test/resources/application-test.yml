spring:
  datasource:
    url: jdbc:h2:mem:learning_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration

platform:
  learning:
    progress-buffer:
      enabled: false
      worker-delay: 1h
      batch-size: 10
      lease-duration: 15s
      backlog-threshold: 10000
    # 集成测试显式调用单批结算，避免后台调度与断言争抢同一份固定测试数据。
    assessment-settlement-poll-delay: 1h
    media:
      base-url: http://127.0.0.1:8083
      request-timeout: 1s
      authorization-issuer: edu-platform-learning-service-test
      authorization-audience: edu-platform-media-service-test
      authorization-token-ttl: 30s
      authorization-secret: test-only-course-media-auth-secret-32-bytes
    course:
      base-url: http://127.0.0.1:8082
      request-timeout: 1s
      fact-cache-ttl: 0s
    import:
      max-source-bytes: 1048576
      retention: 1h
      messaging-enabled: false
      outbox-poll-delay: 2s
      confirm-timeout: 1s
      max-publish-attempts: 3

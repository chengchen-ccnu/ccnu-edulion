spring:
  application:
    name: learning-service
  flyway:
    enabled: false
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
      fail-on-missing-creator-properties: true
      fail-on-null-for-primitives: true
server:
  port: ${SERVER_PORT:8084}
management:
  endpoints:
    web:
      exposure:
        include: health,info
platform:
  learning:
    account-impact:
      # 仅 IAM 的聚合读取，复用暂停写凭据；未配置时入口安全拒绝，不公开到 Gateway。
      iam-token: ${COURSE_SUSPENSION_IAM_TOKEN:}
    # 事件主动追平；即使关闭或 MQ 故障，课程访问仍读取实时 HTTP 暂停事实。
    suspension-messaging:
      enabled: false
    agent-index:
      enabled: ${AGENT_INDEX_API_ENABLED:false}
      service-token: ${AGENT_INDEX_SERVICE_TOKEN:}
    agent-access:
      enabled: ${AGENT_ACCESS_DOMAIN_API_ENABLED:false}
      service-token: ${AGENT_ACCESS_DOMAIN_TOKEN:}
    assessment-settlement-poll-delay: ${LEARNING_ASSESSMENT_SETTLEMENT_POLL_DELAY:2s}
    course-content-messaging:
      enabled: ${LEARNING_COURSE_CONTENT_MESSAGING_ENABLED:false}
    progress-buffer:
      # 默认构建不启用 Redis 缓冲；local profile 由 application-local.yml 显式开启并要求 Redis。
      enabled: ${LEARNING_PROGRESS_BUFFER_ENABLED:false}
      worker-delay: ${LEARNING_PROGRESS_BUFFER_WORKER_DELAY:5s}
      batch-size: ${LEARNING_PROGRESS_BUFFER_BATCH_SIZE:1000}
      worker-concurrency: ${LEARNING_PROGRESS_BUFFER_WORKER_CONCURRENCY:16}
      lease-duration: ${LEARNING_PROGRESS_BUFFER_LEASE_DURATION:15s}
      backlog-threshold: ${LEARNING_PROGRESS_BUFFER_BACKLOG_THRESHOLD:10000}
    media:
      base-url: ${MEDIA_SERVICE_BASE_URL:http://127.0.0.1:8083}
      request-timeout: ${LEARNING_MEDIA_REQUEST_TIMEOUT:5s}
      authorization-issuer: ${LEARNING_MEDIA_AUTH_ISSUER:edu-platform-learning-service}
      authorization-audience: ${COURSE_MEDIA_AUTH_AUDIENCE:edu-platform-media-service}
      authorization-token-ttl: ${LEARNING_MEDIA_AUTH_TOKEN_TTL:30s}
      authorization-secret: ${COURSE_MEDIA_AUTH_SECRET:}
    course:
      base-url: ${COURSE_SERVICE_BASE_URL:http://127.0.0.1:8082}
      request-timeout: ${LEARNING_COURSE_REQUEST_TIMEOUT:3s}
      # T16.1 授权事实不再缓存；旧 TTL 配置保留兼容但不参与 Course 授权读取。
      fact-cache-ttl: ${LEARNING_COURSE_FACT_CACHE_TTL:0s}
    iam:
      base-url: ${IAM_SERVICE_BASE_URL:http://127.0.0.1:8081}
      request-timeout: ${LEARNING_IAM_REQUEST_TIMEOUT:1s}
      service-token: ${IAM_INTERNAL_SERVICE_TOKEN:}
    import:
      max-source-bytes: ${QUESTION_IMPORT_MAX_SOURCE_BYTES:104857600}
      retention: ${QUESTION_IMPORT_RETENTION:7d}
      messaging-enabled: false
      outbox-poll-delay: ${LEARNING_OUTBOX_POLL_DELAY:2s}
      confirm-timeout: ${LEARNING_OUTBOX_CONFIRM_TIMEOUT:10s}
      max-publish-attempts: ${LEARNING_OUTBOX_MAX_ATTEMPTS:20}

---
spring:
  config:
    activate:
      on-profile: "!local & !test"
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration

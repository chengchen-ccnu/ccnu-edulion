spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${LEARNING_MYSQL_DATABASE}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=${MYSQL_SERVER_TIMEZONE:Asia/Shanghai}&useSSL=${MYSQL_SSL_ENABLED:false}&allowPublicKeyRetrieval=${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:true}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${MYSQL_MAXIMUM_POOL_SIZE:2}
      minimum-idle: ${MYSQL_MINIMUM_IDLE:0}
      connection-timeout: ${MYSQL_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${MYSQL_VALIDATION_TIMEOUT_MS:2000}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${LEARNING_REDIS_DATABASE:4}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    virtual-host: ${RABBITMQ_VHOST:/}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

management:
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true

platform:
  learning:
    suspension-messaging:
      # 与既有本地 RabbitMQ 开关一致；关闭消费时访问仍由实时 Course HTTP 拒绝暂停。
      enabled: ${LEARNING_SUSPENSION_MESSAGING_ENABLED:${RABBITMQ_ENABLED:false}}
    course-content-messaging:
      enabled: ${LEARNING_COURSE_CONTENT_MESSAGING_ENABLED:${RABBITMQ_ENABLED:false}}
    progress-buffer:
      enabled: ${LEARNING_PROGRESS_BUFFER_ENABLED:true}
    import:
      messaging-enabled: ${RABBITMQ_ENABLED:false}

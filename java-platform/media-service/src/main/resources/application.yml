spring:
  application:
    name: media-service
  task:
    scheduling:
      pool:
        size: 2
server:
  port: ${SERVER_PORT:8083}
management:
  endpoints:
    web:
      exposure:
        include: health,info
platform:
  media:
    service-authorization:
      issuer: ${COURSE_MEDIA_AUTH_ISSUER:edu-platform-course-service}
      audience: ${COURSE_MEDIA_AUTH_AUDIENCE:edu-platform-media-service}
      max-token-ttl: ${MEDIA_SERVICE_AUTH_MAX_TOKEN_TTL:1m}
      clock-skew: ${MEDIA_SERVICE_AUTH_CLOCK_SKEW:5s}
      secret: ${COURSE_MEDIA_AUTH_SECRET:}

---
spring:
  config:
    activate:
      on-profile: "!local"
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration

platform:
  media:
    enabled: false
    messaging:
      enabled: false
      outbox-poll-delay: 2s
      confirm-timeout: 10s
      max-publish-attempts: 20
    oss:
      enabled: false
      endpoint: ""
      region: ""
      bucket: ""
      key-prefix: quarantine
      access-key-id: ""
      access-key-secret: ""
      security-token: ""
      access-grant-ttl: 10m
    upload:
      grant-ttl: 15m
      session-ttl: 24h
      multipart-threshold: 10485760
      part-size: 5242880
    worker:
      enabled: false
      ffmpeg-path: ffmpeg
      timeout: 2m
      max-concurrent-jobs: 1
      hls-segment-duration: 6s
    maintenance:
      enabled: false
      fixed-delay: 1h
      unbound-retention: 24h

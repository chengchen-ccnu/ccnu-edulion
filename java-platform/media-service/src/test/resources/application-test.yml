spring:
  datasource:
    url: jdbc:h2:mem:media_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    # T09A 真实链路测试在 test classpath 引入 learning-service；限定到本模块，避免拾取下游同版本迁移。
    locations: filesystem:src/main/resources/db/migration
  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration
      # gateway-service 仅作为 T09A 跨服务验收依赖；普通 servlet 测试不得启动 Gateway 或其默认安全链。
      - org.springframework.cloud.gateway.config.GatewayClassPathWarningAutoConfiguration
      - org.springframework.cloud.gateway.config.GatewayAutoConfiguration
      - org.springframework.cloud.gateway.config.GatewayResilience4JCircuitBreakerAutoConfiguration
      - org.springframework.cloud.gateway.config.GatewayNoLoadBalancerClientAutoConfiguration
      - org.springframework.cloud.gateway.config.GatewayFunctionAutoConfiguration
      - org.springframework.cloud.gateway.config.GatewayMetricsAutoConfiguration
      - org.springframework.cloud.gateway.config.GatewayRedisAutoConfiguration
      - org.springframework.cloud.gateway.config.GatewayStreamAutoConfiguration
      - org.springframework.cloud.gateway.discovery.GatewayDiscoveryClientAutoConfiguration
      - org.springframework.cloud.gateway.config.SimpleUrlHandlerMappingGlobalCorsAutoConfiguration
      - org.springframework.cloud.gateway.config.GatewayReactiveLoadBalancerClientAutoConfiguration
      - org.springframework.cloud.gateway.config.LocalResponseCacheAutoConfiguration
      - org.springframework.cloud.gateway.config.GatewayTracingAutoConfiguration
      - org.springframework.boot.security.autoconfigure.SecurityAutoConfiguration
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.security.autoconfigure.actuate.web.servlet.ManagementWebSecurityAutoConfiguration
      - org.springframework.boot.security.autoconfigure.web.servlet.SecurityFilterAutoConfiguration
      - org.springframework.boot.security.autoconfigure.web.servlet.ServletWebSecurityAutoConfiguration
  cloud:
    gateway:
      enabled: false
      server:
        webflux:
          enabled: false

platform:
  media:
    enabled: true
    messaging:
      enabled: false
      outbox-poll-delay: 2s
      confirm-timeout: 2s
      max-publish-attempts: 3
    upload:
      grant-ttl: 15m
      session-ttl: 24h
      multipart-threshold: 10
      part-size: 5
    maintenance:
      enabled: false
      fixed-delay: 1h
      unbound-retention: 24h
    service-authorization:
      issuer: edu-platform-course-service-test
      audience: edu-platform-media-service-test
      max-token-ttl: 1m
      clock-skew: 5s
      secret: test-only-course-media-auth-secret-32-bytes
    worker:
      enabled: true
      ffmpeg-path: ffmpeg
      timeout: 30s
      max-concurrent-jobs: 1
      hls-segment-duration: 2s
    external-image-import:
      enabled: true
      allowed-hosts: [images.fixture.test]
      max-bytes: 1048576
      request-timeout: 1s
      max-redirects: 1
    oss:
      enabled: false
      endpoint: ""
      region: ""
      bucket: ""
      key-prefix: t07-test
      access-key-id: ""
      access-key-secret: ""
      security-token: ""
      access-grant-ttl: 10m

spring:
  application:
    name: course-service
  flyway:
    enabled: false
  jackson:
    default-property-inclusion: non_null
mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mappers/*.xml
server:
  port: ${SERVER_PORT:8082}
management:
  endpoints:
    web:
      exposure:
        include: health,info
platform:
  course:
    media:
      base-url: ${MEDIA_SERVICE_BASE_URL:http://127.0.0.1:8083}
      request-timeout: ${COURSE_MEDIA_REQUEST_TIMEOUT:3s}
      service-authorization:
        issuer: ${COURSE_MEDIA_AUTH_ISSUER:edu-platform-course-service}
        audience: ${COURSE_MEDIA_AUTH_AUDIENCE:edu-platform-media-service}
        token-ttl: ${COURSE_MEDIA_AUTH_TOKEN_TTL:30s}
        secret: ${COURSE_MEDIA_AUTH_SECRET:}
      messaging:
        enabled: false
        outbox-poll-delay: 2s
        confirm-timeout: 10s
        max-publish-attempts: 20

---
spring:
  config:
    activate:
      on-profile: "!local & !test"
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration

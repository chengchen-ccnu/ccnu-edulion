spring:
  application:
    name: gateway-service
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${GATEWAY_REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: iam-service
              uri: ${IAM_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/protocols/**,/api/v1/teacher-applications/**,/api/v1/admin/users/**
            - id: course-service
              uri: ${COURSE_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/courses/**,/api/v1/teacher/courses/**
            - id: media-service
              uri: ${MEDIA_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/media/**
            - id: learning-service
              uri: ${LEARNING_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/teacher/questions/**,/api/v1/teacher/knowledge-points/**,/api/v1/teacher/question-imports/**,/api/v1/teacher/assessments/**,/api/v1/teacher/attempts/**,/api/v1/teacher/learning/**,/api/v1/teacher/gradebook,/api/v1/teacher/gradebook/export,/api/v1/admin/knowledge-points/**,/api/v1/admin/knowledge-graph-imports/**,/api/v1/admin/question-imports/**,/api/v1/admin/legacy-question-imports/**,/api/v1/learning/**
            - id: operation-service
              uri: ${OPERATION_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/operations/**
            - id: agent-access-service
              uri: ${AGENT_ACCESS_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/ai/**

server:
  port: ${SERVER_PORT:8080}

platform:
  gateway:
    allowed-origins: ${GATEWAY_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175}
    jwt:
      issuer: ${IAM_JWT_ISSUER:edu-platform-iam}
      audience: ${IAM_JWT_AUDIENCE:edu-platform-gateway}
      secret: ${IAM_JWT_SECRET:}
    rate-limit:
      enabled: ${GATEWAY_RATE_LIMIT_ENABLED:true}
      key-prefix: ${GATEWAY_RATE_LIMIT_KEY_PREFIX:edu:gateway:rate}
    session-validation:
      enabled: ${GATEWAY_SESSION_VALIDATION_ENABLED:true}
      key-prefix: ${IAM_SESSION_VERSION_KEY_PREFIX:edu:iam:session-version}
      unavailable-retry-after: ${GATEWAY_SECURITY_RETRY_AFTER:2s}

management:
  endpoints:
    web:
      exposure:
        include: health,info

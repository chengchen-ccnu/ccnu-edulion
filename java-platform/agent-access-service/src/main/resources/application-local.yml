spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${AGENT_MYSQL_DATABASE:edu_platform_agent_dev}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia%2FShanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USERNAME:}
    password: ${MYSQL_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    virtual-host: ${RABBITMQ_VHOST:/}
    username: ${RABBITMQ_USERNAME:}
    password: ${RABBITMQ_PASSWORD:}
    publisher-confirm-type: correlated
    publisher-returns: true
platform:
  agent:
    persistence-enabled: true
  agent-index:
    enabled: ${AGENT_INDEX_API_ENABLED:false}
    publish-enabled: ${AGENT_INDEX_PUBLISH_ENABLED:false}
